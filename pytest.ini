[pytest]
# Per-test timeout default so a bare `pytest tests/` (without the
# `--timeout` flag the Makefile passes) still bounds hung tests. The
# Makefile targets may override with a larger value on the CLI.
timeout = 120

# Warning filters. We run with `-W error` implicitly on anything that
# isn't listed here, so new warnings from OUR code become loud test
# failures. The filters below only silence third-party internals we
# cannot fix (torch + coremltools deprecations triggered by their own
# export code paths).

filterwarnings =
    # torch.jit.* deprecations fired by torch itself during coremltools
    # conversion and torch.jit.script_method usage. We don't call these
    # directly — torch and coremltools call them internally.
    ignore:`torch\.jit\.script_method` is deprecated.*:DeprecationWarning
    ignore:`torch\.jit\.trace` is deprecated.*:DeprecationWarning
    ignore:`torch\.jit\.trace_method` is deprecated.*:DeprecationWarning

    # coremltools converter emits a NumPy 1.25 deprecation from inside
    # its MIL frontend — upstream issue, nothing we control.
    ignore:Conversion of an array with ndim > 0 to a scalar.*:DeprecationWarning
