      disassembly)".
    no_witness: >-
      Not applicable — the file makes no semantic claim to witness. An
      instrument pointed at a quarantined byte is the mechanism that LIFTS
      a quarantine; forbidding it would make the quarantine permanent.
    earns_it: n/a
    behaviour: UNCHANGED

  - site: "scripts/tracing/nes_core_nmi_trace.py::ram[0x70]::0x0070"
