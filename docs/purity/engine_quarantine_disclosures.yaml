      a reference emulator.
    no_witness: >-
      Not applicable — no game semantics are asserted; the bytes are diff
      material. Emulator fidelity and mapper work sit outside the purity
      line by standing project rule.
    earns_it: n/a
    behaviour: UNCHANGED

  - site: "scripts/tracing/nes_core_nmi_trace.py::ram[0x84]::0x0084"
    disposition: FIDELITY_TRACE
    asserts: NOTHING. Second byte of the same NMI-entry trace line.
    no_witness: Not applicable — see the $70 row.
    earns_it: n/a
    behaviour: UNCHANGED

  # ---- Revealed 2026-08-27 by dropping the identifier-name requirement --
