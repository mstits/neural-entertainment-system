    no_witness: >-
      Not applicable — the line asserts no semantics. This is the site that
      motivated the detector change: it reads through a variable called
      `r`, and the file names no game, so BOTH halves of the old
      `has_addr AND has_token` guard missed it. It was reachable
      production code carrying two quarantined Zelda addresses with
      nothing in the tree able to see it.
    earns_it: n/a
    behaviour: UNCHANGED

