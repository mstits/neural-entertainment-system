name: "Contra Screen9"
reward_id: contra
# EXPERIMENT: warm-start all envs AT the screen-9 wall (captured from the
# banked policy's furthest point) so the agent practices the hard part
# directly, instead of replaying screens 0-8 every episode. Tests whether
# the screen-9 wall is passable with focused practice (max_screen > 9) or
# genuinely too hard for this policy class. The screen_progress reward
# already incentivizes new max screens from the warm-start.
start_state_path: "checkpoints/contra/curriculum/screen9.state"
rom_hashes:
  - "a70547ac1a4d0f86bdba6b31bf25c8aa"  # Contra (U) — NesDev canonical dump

# Action game — needs responsive control, so frame_skip 4 (NOT the
# trainer's default 16, which is far too coarse to dodge bullets).
frame_skip: 4
max_episode_steps: 2000

description: >
  Training profile for Contra (NES, 1988). Side-scrolling run-and-gun.
  Reward emphasizes forward progress + enemy kills + weapon pickups. Contra
  is brutally unforgiving (one-hit deaths), so death_penalty matters a lot
  and episodes end fast.

ram_mapping:
  # Player 1. This is a warm-start variant minted from the same June map as
  # configs/contra.yaml; that profile has since moved off the first two
  # addresses below, and this one was never updated. The measured truth:
  player_x:        0x0031   # MEASURED DEAD, not a position:
                            # docs/receipts/ram_verify/contra.json reads it 0
                            # throughout live gameplay ("NOT usable"), and
                            # nes_core/src/rewards.rs records it "constant 0
                            # across 2000 frames of varied real play". The
                            # receipted x-observable is 0x0065.
  player_y:        0x0021   # MEASURED DEAD, same receipt: reads 0 throughout
                            # live gameplay, does not move under a jump probe.
                            # The receipted y-observable is 0x031A.
  player_state:    0x002C   # CONTESTED — two in-repo measurements disagree.
                            # docs/receipts/ram_verify/contra.json (2026-07-31)
                            # receipts "0 alive / 1 dead / 2 dying"; a later
                            # purpose-built test that drove a real playthrough
                            # to two actual life losses found the byte frozen
                            # at 4 through BOTH deaths, and configs/contra.yaml
                            # relabels it the game-mode byte. Neither has been
                            # re-run. The verified death signal on this ROM is
                            # the lives decrement (0x0032) below.
  # Scroll / world position (high byte gives which screen)
  screen_number:   0x0064
  # Lives, score
  lives:           0x0032   # remaining lives (starts at 2)
  score_start:     0x07E2   # 6-digit BCD score
  score_end:       0x07E7
  weapon:          0x00AA   # changes on weapon pickup; nonzero == holding a
                            # non-default weapon, which is the only property
                            # the weapon_upgrade reward uses. The specific
                            # value-to-weapon mapping this comment used to
                            # assert has no receipt here, and
                            # docs/research/CONTRA_ROUTE_A_2026-08-27.md
                            # deliberately declines to say what any value of
                            # $00AA corresponds to. Retracted as unmeasured.

reward_weights:
  # PROGRESS must dominate. The prior weights made score_delta ~71x
  # larger than forward (score-farm fixed point: stand and shoot for
  # points instead of advancing). Rebalanced so advancing the stage is
  # the gradient the policy climbs.
  # ADVANCEMENT-SHAPING (2026-06-25): the screen-9 warm-start agent
  # score-farmed at the wall instead of advancing (farming kills was an
  # easier reward than pushing past the obstacle). Remove the farm
  # entirely (score_delta=0) and make the MAX-GATED screen_progress the
  # dominant reward (fires only on a new max screen, so it can't be
  # farmed). Now advancing is the only real reward path.
  forward_progress: 2.0     # per unit of screen/x gain (within-screen guidance)
  score_delta:      0.0     # was 0.0005 — REMOVED: killing enemies must not pay
  screen_progress_bonus: 100.0  # was 30 — dominant, max-gated reward for a NEW screen
  completion_bonus: 2000.0  # terminal stage-1 clear reward (fires at clear_screen)
  # clear_screen: <unset → disabled>. Read vanilla_ppo_max_screen off a
  # run to find the real stage-1-end screen, then set it to arm the win.
  weapon_upgrade:   5.0     # getting a better weapon
  enemy_kill:       1.5     # NOTE: not wired into ContraReward (score_delta is the kill proxy)
  death_penalty:   -25.0
  time_penalty:    -0.005

action_space:
  - []                        # NOOP
  - ["right"]
  - ["left"]
  - ["A"]                     # jump
  - ["B"]                     # fire
  - ["right", "B"]            # run-fire
  - ["right", "A"]            # right-jump
  - ["right", "A", "B"]       # run-jump-fire
  - ["up", "B"]               # shoot up
  - ["down"]                  # prone

curriculum:
  stage_1: ["*"]
  stage_2: ["*"]
  stage_3: ["*"]
  stage_4: ["*"]

reinforce:
  enabled: true
  # === UNIFIED vanilla_ppo (Phase 2 — first non-SMB game on the stack) ===
  trainer_mode: vanilla_ppo
  # Contra has no RAM tile decoder (only SMB does), so it uses the
  # universal pixel CNN path: 4-stacked 84x84 grayscale frames -> Nature
  # DQN encoder -> actor/critic heads. The SMB area-byte save-state
  # curriculum is gated off for non-Mario games (the trainer detects
  # this by name); Contra trains single-stage from its start state.
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  # Skip-per-pixel batched PPU via clean-scanline history (headless-only;
  # a live frame sink keeps exact rendering). Training-quality accepted:
  # rare 1-frame-stale rows are invisible to the 4-frame-stacked policy.
  batched_render: replace
  # Production fast path: drop the per-worker-step catch_unwind wrap.
  panic_isolation: false
  device: mps            # CNN is ~4.7x faster on MPS than CPU (benched); switch to cpu if MPS misbehaves

  # === ROLLOUT ===
  rollout_steps: 1024
  steps: 10              # K PPO epochs / iter
  ppo_minibatch_size: 256

  # === PPO HYPERPARAMETERS ===
  lr: 2.5e-4
  gamma: 0.99            # Contra is denser/longer-horizon than SMB
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01     # was 0.02 — too high: entropy stuck at ~2.2 (96% of
                         # max for 10 actions), so the policy never committed
                         # and regressed off the screen-9 advances it found.
                         # 0.01 matches the proven SMB value (which commits).
  grad_clip: 0.5
  value_loss: huber

  # === RND INTRINSIC EXPLORATION ===
  # Contra is one-hit-death + sparse-reward — exactly the hard-exploration
  # regime RND targets. Set rnd_intrinsic_coef: 0.0 for a pure baseline.
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0
