name: "Kirby's Adventure (USA) (Rev A)"
# Cold-start capture (2026-08-02): ROM-only, no prior assets. Generic masher
# (scripts/capture_start_state.py) reached the WORLD MAP (Level 1: Vegetable
# Valley); pressing UP entered the stage door -> real side-scrolling gameplay
# (right-vs-left divergence 13 -> 352; hold-right scrolls 410 bytes; Kirby
# traverses 10 distinct scenes via his hover in 1500 frames, no deaths).
start_state_path: "roms/Kirby's Adventure (USA) (Rev A)_start.state.bin"
rom_hashes: []

frame_skip: 4
max_episode_steps: 2500

description: >
  Kirby's Adventure (NES, 1993, HAL). Forgiving side-scroll platformer:
  Kirby can HOVER/FLY (hold A) so pits rarely kill, and can INHALE (B) enemies
  to copy abilities. Room-based stages. Objective = reach the stage exit;
  health is the HUD heart meter, lives shown as x04. Solver bootstrap: the
  progress signal is NOT zero-page (MMC3) and needs discovery (world-x /
  camera-scroll / room counter). No hand-authored reward — GenericGame solve:.

action_space:
  - []                      # NOOP
  - ["right"]
  - ["left"]
  - ["A"]                   # jump (hold = puff/float/fly)
  - ["B"]                   # inhale / spit / use ability
  - ["down"]                # duck / (air) descend / swallow
  - ["up"]                  # fly up / enter door
  - ["right", "A"]          # jump/float right
  - ["left", "A"]           # jump/float left
  - ["right", "B"]          # inhale while moving
  - ["right", "down"]       # slide-ish

# Go-Explore solver adapter (cold-start bootstrap 2026-08-02). Every address
# below was discovered and verified from THIS core's own scripted + random
# rollouts — no external RAM maps, no disassembly. Full receipt with the
# confirming test for each byte: runs/kirby/kirby_observables_receipt.json.
#
# THE COLD-MMC3 PROGRESS SIGNAL (the hard part).
# Kirby's Adventure is ROOM-BASED: the start state is a small platform in
# Vegetable Valley Stage 1 whose only exit is a DOOR (walk left ~16px, press UP
# while grounded). Pure hold-right just pins Kirby at the platform edge (a prior
# zero-page scan found nothing monotone because the room does not scroll there).
# Entering the door drops into a horizontal scrolling room, and THAT is where the
# world position lives:
#   progress = ram[0x0083] | ram[0x0095]<<8  — a true 16-bit WORLD-X.
# Confirmed by the gameplay-locked-wrap test (the exact rejection the MM2 $001C
# frame-counter bootstrap failed): under NOOP it is dead FLAT (v=40, so NOT a
# free-running clock); under hold-right it rises a steady ~+5/step (Kirby's walk
# at frame_skip 4) and cleanly crosses the 256 page boundary; under hold-left it
# falls (direction-reversible); and 0x0083 wraps 255->0 exactly when 0x0095
# increments (84.8% of down-wraps) and 0->255 when 0x0095 decrements (100% of
# up-wraps), with hi*256+lo continuous (|d|<64) 99.9% of steps across 8 worker
# trajectories. 0x0071/0x006A are sub-pixel/velocity accumulators (rejected);
# 0x0022 is a free-running clock (the $001C-class trap, rejected).
#
# ROOM ADVANCE. 0x004F is a per-room SCENE id: 58 on the start platform, 62 in
# the post-door room, constant within a room (across 32,000 in-room states),
# stepping only at door/room transitions and increasing forward. Used as `area`
# — which ALSO feeds room_id, so each door transition increments the solver's
# `sect` transit count (sect*10000 dominates the domination score), pushing the
# search door-by-door through the stage while world-X gives fine within-room
# progress. This is the room-based analogue of Contra's screen<<8.
#
# level_key = [] (COVERAGE baseline, same choice as contra/ducktales): no
# stage-clear counter is receipt-verifiable from bootstrap play (clearing
# Vegetable Valley Stage 1 is unreachable here). 0x0030 == 1 is the stage/level
# id (Vegetable Valley = "Level 1"); it would increment on a real clear — wire it
# into level_key once a genuine stage clear is captured and confirmed.
solve:
  rom: "roms/Kirby's Adventure (USA) (Rev A).nes"
  # 16-bit world-X (see the block above). progress_cap guards transition-frame
  # garbage: real world-X here spans 0..~1023 (0x0095 in 0..3); a door-load
  # frame that reads a large 0x0095 (>=16 -> >=4096) is dropped, not archived.
  progress: {lo: 0x0083, hi: 0x0095}
  progress_cap: 4000
  # Kirby vertical position. Standing ~148; a jump dips it to ~64 (up = smaller
  # y) and returns to 148; flat under NOOP. Wide dynamic range (Kirby flies), so
  # it drives a meaningful y-band cell coordinate. (0x0022 is the clock, not y.)
  y: 0x001E
  # Coverage baseline (no verified stage-advance counter from bootstrap play).
  level_key: []
  # TRIED AND REJECTED (2026-08-06): wired clear: {mode: confluence} (the
  # same generic detector used for Contra) to fix real unattended search
  # time that could never bank a win. Verified UNSAFE by direct replay
  # before shipping: it fired 3 times in a 24s smoke run, each on an
  # ordinary ROOM transition (area 58->62 mid-trajectory), not a full
  # stage clear — Kirby's rooms-per-level ratio means "a fresh room
  # loading in" (the detector's own documented "coord" signal target)
  # fires far more often than "the level is actually done." Do not
  # re-wire for room-based games without a mechanism that distinguishes
  # a room transition from the terminal one.
  # Death proxy = HEALTH. 0x0025 == 6 == the six HUD health orbs on the title
  # card, with five HUD display-mirror tiles at 0x06B4-0x06B8; rock-stable at 6
  # across ~70,000 scripted+random steps. Its decrement could NOT be triggered:
  # Kirby's hover+inhale took ZERO damage in the forgiving opening (70k+ steps,
  # 8 grounded/flying workers), exactly as the game is designed. No clean
  # zero-page lives counter exists (the x04 display maps only to 0x05xx-0x07xx
  # HUD-buffer constants). is_dead therefore fires on health < 6 — conservative
  # (treats any hit as terminal), which is fine for this low-damage stage.
  lives: 0x0025
  # Per-room scene id (58 start platform -> 62 horizontal room); constant within
  # a room, steps at doors, increases forward. Self-labels cells per room AND
  # drives room_id -> sect transitions so the search advances through doors.
  area: 0x004F
  # Door-entry maneuver macros (discrete-transition gate — the room exit
  # door needs grounded + UP, which world-X can't gradient toward since the
  # camera clamps at the scroll limit; same generic mechanism as CV's
  # stair up-holds). At a small per-step probability a worker HOLDS up (or
  # up+jump) for N steps; when it lands grounded at a door the transition
  # fires and room-id $004F advances = a dominating sect gain.
  hold_macros:
    - {buttons: ["up"], steps: 20, p: 0.03}
    - {buttons: ["up", "A"], steps: 16, p: 0.015}
    - {buttons: ["right", "up"], steps: 16, p: 0.015}
  # DISCRETE-TRANSITION GATE (first shipped profile to configure it, 2026-08-10).
  # The hold_macros above fire UNIFORMLY along a trajectory; this gate fires the
  # same settle-then-HOLD maneuver only where it can pay — when a worker sits at
  # the DEEP frontier (deepest area reached, and within `near` gx buckets of that
  # area's own max world-X). That is exactly the Kirby stall: the camera clamps at
  # the scroll limit, so world-X stops gradienting and the only remaining progress
  # is the discrete "grounded + UP through the door" event.
  #
  # Kirby is the game whose ROOM-TRANSITION lesson is already receipted here: the
  # confluence clear-detector was tried and rejected above precisely because room
  # loads (area 58 -> 62) are frequent and ordinary. That cuts both ways — if a
  # room transition is common enough to fool a clear detector, then PROVOKING one
  # is the cheapest real progress the search can buy, which is what this gate does.
  #
  # addr = 0x004F, the SAME per-room scene id already declared as `area:` five
  # lines up. No new observable, no external RAM map: the byte's derivation and
  # verification are the ones in this file's ROOM ADVANCE note. The solver reads it
  # for telemetry only (`max_room` on the progress line) — the gate's behaviour
  # comes from the macros.
  #
  # DERIVATION (derive_transition_macros, scripts/go_explore_solve.py): the macro
  # list is auto-built from THIS profile's action_space by selecting every combo
  # containing "up" and holding it `steps` frames — no hand-authored buttons list.
  # With the action_space above that derives exactly ONE macro: index 6 (["up"])
  # held 20 steps. The canonical up+jump / up+right variants do NOT derive here
  # because this action_space declares no ["up","A"] or ["right","up"] combo (the
  # same reason the two hold_macros naming those combos are skipped at solver
  # init). Adding them would change the sampled action distribution for this
  # profile, so that is left alone; `buttons:` is deliberately not set, so the gate
  # stays derived-from-the-space rather than hand-authored.
  #
  # p 0.05 = per-step injection chance while at the frontier (vs 0.03 uniform for
  # the plain up hold); near 24 = 24 gx buckets * GX_BUCKET 16 = 384 world-X units
  # behind the frontier still counts as "at" it. Receipt for the derived list:
  # tests/test_kirby_room_advance.py (asserts [(6, 20)] from this exact block).
  room_advance: {addr: 0x004F, steps: 20, p: 0.05, near: 24}
