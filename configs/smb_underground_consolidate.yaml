name: "Mario 1-2 Underground consolidate"
rom_hashes:
  - "811b027eaf99c2def7b933c5208636de"

# CONTROLLED A/B — CONSOLIDATION (entropy decayed to sharpen the 44%-stochastic 1-2 clear toward a greedy clear).
# Warm-start ALL envs directly at the 1-2 underground main (area byte 2,
# stage_02.state). Curriculum OFF so envs stay there (no stage
# capture/advance pulling them back to 1-1). checkpoint_scale=1.0 → the
# now-correctly-mapped area-byte-2 underground ladder is ON, supplying
# the dense signal the buggy (area-1-mapped) build never delivered to the
# underground. The BASELINE arm (smb_underground_baseline.yaml) is
# identical except checkpoint_scale=0.0, isolating the ladder's effect.
start_state_path: "checkpoints/super_mario_bros/smb_curriculum/stage_02.state"

frame_skip: 4
max_episode_steps: 2400

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E
  float_state:     0x001D

reinforce:
  enabled: true
  encoder: smb_tiles
  tile_frame_stack: 4
  trainer_mode: vanilla_ppo
  # Single-stage from the area-2 warm-start; no curriculum machinery.
  smb_curriculum: false
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 3.0e-4
  gamma: 0.9
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.002
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  sticky_action_prob: 0.0
  device: cpu
  panic_isolation: false
  async_pipeline: false

reward_weights:
  forward_progress: 1.0
  score_delta:      0.025
  death_penalty:   -15.0
  completion_bonus: 50.0
  time_penalty:     0.0
  checkpoint_scale: 1.0      # DENSE: fixed area-byte-2 ladder ON
  jump_clear_bonus: 0.0
  survival_bonus:   0.0
  air_bonus:        0.0
  pit_fall_extra:   0.0
  enemy_death_extra: 0.0

action_space:
  - []
  - ["right"]
  - ["right", "A"]
  - ["right", "B"]
  - ["right", "A", "B"]
  - ["A"]
  - ["left"]

curriculum:
  stages:
    - name: stage_1
      levels: ["1-2"]
      advance_threshold: 0.5
      min_episodes: 200
