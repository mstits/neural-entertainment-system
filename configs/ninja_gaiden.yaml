name: "Ninja Gaiden"

rom_path: "roms/Ninja Gaiden (USA).nes"
rom_hashes:
  - "0c2cccda6ba6cab7bede0ff05e7f6852"          # md5 of the dump actually used
start_state_path: "roms/Ninja Gaiden (USA)_start.state.bin"

description: |
  Ninja Gaiden (NES, 1989), solver profile.

  Written from MEASUREMENT ONLY. An earlier draft of this file was cloned
  from configs/contra.yaml and carried Contra's ROM hash, its player_state
  byte, its boss-defeated flag and its reward weights — the same
  clone-contamination that cost 20.1M training steps on World 2-1 and ran
  through World 1-4's entire campaign undetected. Nothing here is
  inherited: every byte below was discovered by experiment on this ROM,
  and anything not discovered is absent rather than guessed.

frame_skip: 4
# A GENERIC controller, not a tuned set. Contra's action space encodes
# Contra-specific tactics (prone fire for its base wall); inheriting that
# would be handing this game someone else's strategy. Here the agent gets
# the buttons and works out which ones matter.
action_space:
  - []                     # NOOP
  - ["right"]
  - ["left"]
  - ["up"]
  - ["down"]
  - ["A"]
  - ["B"]
  - ["right", "A"]
  - ["right", "B"]
  - ["left", "A"]
  - ["left", "B"]
  - ["right", "A", "B"]
  - ["down", "B"]
  - ["up", "B"]

solve:
  no_clear_predicate: "no witnessed clear exists for this game, so no predicate can be validated; deliberately unminted per the 4-CONFIRMED/41-VOID roster adjudication (docs/research/CLEAR_GAP_CLOSURE_2026-08-26.md). `solutions: 0` here is a compile-time constant, never a search result."
  rom: "roms/Ninja Gaiden (USA).nes"
  # Discovered by scripts/discover_observables.py's 3-probe protocol
  # (forward-hold / NOOP-hold / reverse-hold) from this profile's own
  # start state, 2026-08-21. No RAM map, no disassembly, no walkthrough.
  # Receipt: runs/ninja_gaiden_observables.json
  #
  #   $0086  rises under forward (net +92, monotone fraction 0.96), flat
  #          under NOOP, reverses under reverse-hold; clears both the wrap
  #          and the saturation gate.
  #   $00F3  carries the jump/ballistic signature.
  #   $001F  decrements on death, agreed by 5 of 5 independent runs.
  # 2026-08-23: $0086 was a screen-local byte — the progress-signal
  # gate showed it wraps unpaired on long rolls. Replaced by the PPU
  # scroll odometer: gate re-run SOUND at 126 distinct over 1384 px
  # (runs/odometer/gate_ninja_gaiden_2026-08-23.json). $001F stays as
  # the death byte with its known start-state caveat (reads 0 at the
  # very first frames; decrement detection is unaffected once play
  # begins, per the same gate run reporting lives correctly mid-roll).
  #
  # 2026-08-26: re-audited after discover_observables.py's zero-start
  # nomination fix (commit 158ec74). Confirmed $001F reads 0 at this
  # profile's root state and the fixed tool correctly demotes it
  # (starts_nonzero=False; it's a flicker artifact, 12-26 unpaired
  # 0<->255 ticks/700-step run, that only ever cleared the OLD vacuous
  # reaches_empty/spends_its_stock checks). The fixed tool's new top
  # nomination, $0386 (starts at 1, one clean decrement to 0, never
  # refills, zero idle churn, 5/5 run agreement), LOOKED like a real
  # stock under every static gate but FAILED behavioral verification:
  # cross-checked against the odometer, forward progress keeps climbing
  # for 100+ further steps after $0386 hits 0 (94px -> 426px over the
  # next ~450 frames) -- the character is demonstrably still alive and
  # playing. $0386 tracks rightward movement into the level, not death
  # (probably a consumed item/sub-weapon/status flag). Wiring it in as
  # `lives` collapsed a go_explore smoke from 1096 cells/1046 frontier
  # to 24 cells/0 frontier (--workers 2 --minutes 1 each,
  # runs/false_death_fanout/ninja_gaiden/smoke_{before,after}.log) by
  # firing false deaths on every healthy, still-progressing worker.
  # No verified better candidate exists -- left as $001F, an honest
  # instrument gap, not a fix. Receipts:
  # runs/false_death_fanout/ninja_gaiden/.
  progress: {source: odometer, axis: x}
  # Scene ordinal from the odometer's rendered-cut detector (pseudo-
  # address ODO_LO+3): stage wipes / camera-locked boss rooms become
  # area transitions, so the archive orders cells (scene, x) and the
  # Act-1 boss-room entry at gx 6144 is depth, not regress.
  area: 0x803
  y: 0x00F3
  lives: 0x001F
  clear:
    # scene_cut DECLINED 2026-08-27, superseding the 2026-08-26 arming
    # (4dd15ea). Re-adjudicated by measurement, not judgement:
    # scripts/scene_cut_arming.py.
    # DEMONSTRATED FALSE POSITIVE: driven at its own armed gate (scene_min=6,
    # blank_min=1, kind=['fade']) over 4x6000 steps of mixed-random play that
    # cleared nothing, this gate fired 5 times. Every one is a false positive,
    # and every one survived the death veto.
    # AND the death veto reads lives=0x001F, a MEASURED-FALSE nomination --
    # docs/research/FALSE_DEATH_FANOUT_2026-08-26.md: $001F is a flicker
    # artifact making 12-26 unpaired 0<->255 ticks per run, demoted to rank 15
    # of 22 by the fixed ranker. A veto driven by a flickering byte does not
    # guard the signal, it disables it.
    # THE GENERAL REASON, which applies to every profile in this cohort and not
    # only this one: the audit probe CLEARS NOTHING, so its entire observed
    # (d_scene, d_blank) distribution is null. A gate at or below that null
    # fires on ordinary play; a gate above it has no evidence it can ever fire.
    # An ARM needs a WITNESSED positive -- one blank run known to be a level
    # transition -- and no profile here has one. Same refusal, same reason, as
    # docs/receipts/rygar/clear_predicate_REFUTED.md.
    # The instrument is NOT the problem: odo_blank moves for 20 of the 25
    # cohort profiles and reads 55/55 transitions on Rygar's banked tape.
    # Re-arm by witnessing one transition on this profile, registering it in
    # scene_cut_arming.WITNESSED_TRANSITIONS, and re-running the audit.
    # Reproduce: .venv/bin/python scripts/scene_cut_arming.py --profile configs/ninja_gaiden.yaml
    # Receipt:   docs/receipts/clear_control/scene_cut_arming_2026-08-27.json
    signals:
      scene_cut:
        enabled: false
        reason: >-
          DECLINED 2026-08-27 by scripts/scene_cut_arming.py. DEMONSTRATED
          FALSE POSITIVE: driven at its own armed gate (scene_min=6,
          blank_min=1, kind=['fade']) over 4x6000 steps of mixed-random play
          that cleared nothing, this gate fired 5 times. Every one is a false
          positive, and every one survived the death veto. AND the death veto
          reads lives=0x001F, a MEASURED-FALSE nomination --
          docs/research/FALSE_DEATH_FANOUT_2026-08-26.md: $001F is a flicker
          artifact making 12-26 unpaired 0<->255 ticks per run, demoted to rank
          15 of 22 by the fixed ranker. A veto driven by a flickering byte does
          not guard the signal, it disables it. An ARM requires a witnessed
          level transition to place a length floor against; this profile has
          none.

  # DELIBERATELY EMPTY. Observing a stage-advance byte requires a real
  # clear, and nothing has cleared yet. With an empty level_key the solver
  # explores for coverage but CANNOT declare a solution — it can search,
  # and it cannot yet recognise winning. Guessing a byte here is the
  # authored-semantics class the purity line forbids, so it stays empty
  # until a clear is actually captured.
  level_key: []
