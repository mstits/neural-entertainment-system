name: "Kung Fu"
reward_id: kung_fu
# Live Floor-1 gameplay start state. It loads at the "1-PLAYER 1-FLOOR"
# intro banner (game_mode $0051 == 1, Thomas briefly frozen); control is
# handed over ~40 frames later when $0051 flips to 2 and grippers spawn.
# VERIFIED real gameplay (not the attract demo): from this state, LEFT/RIGHT
# move Thomas and B lands attacks — driving LEFT+B / RIGHT+B raised the score
# 0 -> 50 (a Gripper KO = +100 pts) within ~400 frames. WITHOUT a start state
# the emulator cold-boots to the TITLE MENU (1/2-PLAYER GAME A/B); if START
# is not pressed cleanly on the menu the ROM auto-plays its ATTRACT DEMO
# (mode 2, Thomas auto-walks to the wall and times out, inputs ignored) —
# training on that gives zero signal (the start-state-demo bug).
start_state_path: "roms/Kung Fu (Japan, USA)_start.state.bin"
rom_hashes:
  - "27e5c62c6c169896bf80bafb6595ceb8"  # Kung Fu (Japan, USA) — mapper 0 NROM, 32K PRG / 8K CHR

# Precise beat-'em-up: frame-accurate punch/kick + dodge timing against
# grippers, knife throwers, and floor bosses. frame_skip 4 like Contra /
# Castlevania, NOT the trainer default 16 (too coarse to time an attack
# against a lunging enemy).
frame_skip: 4
max_episode_steps: 2000

description: >
  Training profile for Kung Fu (NES, 1985 — Nintendo's port of Irem's
  Kung-Fu Master / Famicom "Spartan X"). Thomas ascends the Devil's Temple
  one floor at a time: fight across a floor, defeat the floor boss (which
  opens the door and increments the floor byte $0058), and repeat for 5
  floors to rescue Sylvia. Bespoke KungFuReward (nes_core/src/rewards.rs):
  dense forward progress (world-X) + score delta (enemy KOs) + a dominant
  per-floor-clear bonus (= boss defeated) + terminal game-clear jackpot;
  penalties on energy-bar damage and death. Success = floors_cleared >=
  floor_goal (default 1 = clear the first floor, a real stage-clear win).

# ---------------------------------------------------------------------------
# RAM MAP — empirically probed LIVE on THIS ROM/emulator (frame_skip 1-4),
# driving the game past the title menu into Floor-1 play. Status legend:
#   VERIFIED-LIVE = I drove it and watched the expected change;
#   CROSS-SOURCED = from the design brief / datacrystal, not moved live here;
#   DEBUNKED-LIVE = datacrystal label that did NOT hold on this ROM.
# ---------------------------------------------------------------------------
ram_mapping:
  # MEASURED NULL + CROSS-SOURCED LABEL — read both halves separately.
  # MEASURED HERE: this byte has never been observed to leave 0. Not across
  # 3000+ frames of Floor-1 play including every death/respawn
  # (lives 3->2->1->0), and not across the ~719,500 steps of the later
  # census over two campaign dates and 6 method families, which also
  # re-scanned all 32 banked archive cells and found 0x0058 == 0 in 32/32
  # (runs/clear_census/kungfu/s7_verdict.json, disposition
  # NOT_WITNESSABLE_FROM_HERE). That is a real measurement of absence and it
  # stands.
  # NOT MEASURED HERE: the "current floor, 0 = 1F ... 4 = 5F" identity and
  # the increment-on-clear reading are CROSS-SOURCED (design brief +
  # datacrystal). No floor clear has ever been witnessed on this ROM in this
  # repo, so this comment's former claim that the byte "can only rise on a
  # real floor clear" asserted a false-positive rate for an event with zero
  # observations behind it. Retracted: the claim is unfalsified, not
  # verified. Treat the label as a hypothesis to re-derive.
  current_floor: 0x0058
  # VERIFIED-LIVE — remaining lives. Boots at 3; decrements 3->2->1->0 as the
  # energy bar empties. Death / episode-end signal.
  lives:         0x005C
  # VERIFIED-LIVE — player ENERGY/VITALITY bar (~0x30 full). Drains slowly
  # over time (~1 per 47 frames while advancing) and FAST while a gripper has
  # you grabbed (~1 per 6 frames); at 0 it UNDERFLOWS to 255 for the death
  # animation, then a life is lost and it refills. Health + urgency signal.
  # (datacrystal mislabels it "Energy, max $4D".)
  health:        0x04A6
  # VERIFIED-LIVE (16-bit) — player world-X = player_x_hi*256 + player_x_lo.
  # Climbs monotonically 1 -> ~2020 across Floor 1 and saturates at the right
  # wall; resets to ~1 on respawn / new floor. Dense forward-progress signal.
  player_x_lo:   0x0090
  player_x_hi:   0x0081
  # VERIFIED-LIVE — score, ONE DECIMAL DIGIT PER BYTE, big-endian ($0531 most
  # significant .. $0535 least). Each byte reads a raw digit 0-9. One Gripper
  # KO = +100 pts = +1 on the $0534 (hundreds) digit; confirmed the $0534
  # 9->0 rollover carries into $0533 (thousands). read_score() returns
  # score/10 (the ones digit is always 0). The "did the agent fight" signal.
  score_hi:      0x0531
  score_lo:      0x0535
  # CROSS-SOURCED (design brief) — claimed boss / enemy energy, NOT verified
  # here. Idled at 0x30 in all live probes and only hit 0 on the death reset;
  # no boss has ever been reached on this ROM in this repo, so the "boss"
  # half of the label has no witness and the byte is only known to be a
  # value that idles. It drives an OPT-IN shaping term that DEFAULTS OFF,
  # which is the right handling for an unverified label — left in place on
  # that basis rather than promoted.
  boss_energy:   0x04A5
  # VERIFIED-LIVE — game mode: 0 = title/pre-game, 1 = floor-intro banner
  # (Thomas frozen), 2 = active play. Not read by the reward; documents the
  # start-state phase and the demo-vs-real distinction.
  game_mode:     0x0051
  # DEBUNKED-LIVE on this ROM (documented so nobody re-adds them):
  #   $04AF ("enemy energy" per datacrystal) — stayed 0 the entire time; NOT
  #         the boss (the brief's $04A5 is used instead).
  #   $0056 ("defeat count" per datacrystal) — never changed on a KO; NOT a
  #         defeat counter here. Enemy KOs are tracked via the score delta.

# ---------------------------------------------------------------------------
# REWARD WEIGHTS — consumed by KungFuReward (build_reward substring "kung fu").
# The per-floor-clear bonus (500) dwarfs a whole floor's forward shaping
# (~2020 * 0.05 ~= 101) and score (~tens), so clearing strictly dominates
# camping/score-farming — no farmable local optimum.
# ---------------------------------------------------------------------------
reward_weights:
  forward_progress:  0.05    # per NEW-max world-X unit (non-farmable; pacing earns nothing)
  score_delta:       0.05    # per positive score delta (enemy KOs); ~+0.5 per Gripper
  floor_clear_bonus: 500.0   # per $0058 increment = floor boss defeated = THE milestone
  game_clear_bonus:  5000.0  # terminal jackpot when the top floor is reached (Sylvia)
  boss_damage:       0.0     # OPT-IN boss-HP shaping on $04A5; 0 = DISABLED until verified
  health_penalty:   -0.05    # per energy unit lost (damage/drain; guarded vs the 0xFF underflow)
  death_penalty:   -25.0     # one-shot on the first life lost (ends the episode)
  time_penalty:    -0.005    # mild anti-stall (the energy bar already time-pressures)
  survival_weight:  0.01     # small per-step alive bonus
  floor_goal:       1        # floors to clear for episode_success (a real stage-clear win)
  game_clear_floor: 5        # $0058 value that = game beaten / Sylvia rescued (terminal)

# Kung Fu controls: A = JUMP, B = ATTACK (punch when still / kick when moving;
# Down+B = low attack vs crawling knife-throwers & snakes; A+B = jump kick).
# NO select/start (START = PAUSE). Button LABELS are documentation only — the
# pixel-CNN learns each button's effect from frames.
action_space:
  - []                    # NOOP
  - ["right"]             # advance toward the boss
  - ["left"]              # retreat / reposition
  - ["B"]                 # attack (punch/kick)
  - ["right", "B"]        # advance-attack
  - ["left", "B"]         # retreat-attack
  - ["A"]                 # jump
  - ["right", "A"]        # jump forward (over grabbers)
  - ["left", "A"]         # jump back
  - ["A", "B"]            # jump kick
  - ["down"]              # crouch / duck (dodge high attacks)
  - ["down", "B"]         # low attack (hits crawling knife-throwers & snakes)

curriculum:
  floor_1: ["*"]
  floor_2: ["*"]
  floor_3: ["*"]
  floor_4: ["*"]
  floor_5: ["*"]

reinforce:
  # Unified vanilla_ppo pixel-CNN path (same as Contra / Mega Man / Gradius).
  # No RAM tile decoder for Kung Fu -> universal 4x84x84 grayscale -> Nature
  # DQN CNN -> actor/critic. SMB area-byte curriculum is gated Mario-only.
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02        # combat + dodge timing benefits from exploration
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.5   # sparse floor-clear reward -> RND aids exploration
  rnd_loss_coef: 1.0

# Solver adapter (Go-Explore discovery bootstrap 2026-08-03). Every address
# below was found/confirmed from OUR OWN scripted rollouts on this core (full
# 2KB scan, not just zero page) -- no external RAM maps or disassembly.
#
# DEBUNKED first (documented so nobody re-adds it): the ram_mapping above
# labels $0090/$0081 "player world-X, climbs monotonically 1->~2020 across
# Floor 1". Own-rollout replay falsifies this for solver purposes -- under
# TOTAL NOOP (zero input) the combined value climbs from 1 to 116+ at the
# SAME rate it climbs under RIGHT or LEFT input (noop net +115 over 240
# idle steps): it is a free-running PER-LIFE ELAPSED-FRAME counter (the
# exact MM2 $001C frame-counter trap the discovery lore warns about), not
# position. Left untouched above (the shipped reward code may depend on it)
# but NOT wired into solve: below.
#
# The real position signal found instead: $0094 (byte-identical mirrors at
# $00D4 and $04E0). Passes the wrap+reversibility gate cleanly -- rock-flat
# at 128 for 200+ idle NOOP frames (only wobbles on a real hit/knockback,
# confirmed by simultaneous health drain), CLAMPED at 128 under sustained
# LEFT (can't go below the level-start spawn -- correct forced-minimum
# behavior, not an artifact), and climbs 128->236 (net +108) under
# sustained RIGHT. SATURATION TEST: ceilings at 236-240 across every real
# death cycle observed (3 independent lives under a plain-hold probe and
# 3 more under a B-attack probe, ~3600-12000 frames total) and was never
# seen to exceed it. Whether this is a hard camera/scroll-window clamp
# (the Kirby lesson) or simply "scripted play always dies there" is
# UNRESOLVED at bootstrap scale: current_floor ($0058, the natural
# room/screen counter for a multi-screen floor) never advanced in any
# probe to pair with it or prove a re-basing transition. level_key stays
# an empty coverage baseline; the archive/solve run below is the actual
# instrument that answers whether search can push the frontier past 240.
solve:
  rom: "roms/Kung Fu (Japan, USA).nes"
  # ODOMETER-ERA progress (2026-08-03..08-06), STILL ACTIVE below despite
  # being known-bad. $0094 is this profile's own-rollout "position" byte
  # (see the long comment above this block for its full saturation history:
  # clamps 128->236-240 and never confirmed to correlate with a real
  # scroll/room transition). The 2026-08-24 odometer gate (docs/research/
  # CAPABILITY_REPORT_2026-08-24.md, "Kung Fu | UNUSABLE, cause unknown |
  # camera static, agent ACTIVE (OAM churn 540) = SKILL wall") independently
  # classified Kung Fu CAMERA_STATIC_AGENT_ACTIVE -- the fixed-screen
  # fight-gate class, same as Punch-Out -- meaning $0094 was never a
  # scroll-position signal to begin with; it is the wrong progress surface
  # for this game class. A 2026-08-25 attempt to supersede it with the
  # fight-gate mechanism (see the commented-out block below) was tried and
  # its own follow-up validation probe CONFIRMED the candidate byte
  # implausible (an autonomous enemy spawn/despawn timer, not combat
  # damage) -- so that replacement is disabled, not promoted, and $0094
  # is restored as the active (if still unhelpful) value rather than
  # leaving a confirmed-wrong source live. `progress:` is a required key
  # (go_explore_solve.py's GenericGame reads `s["progress"]` unconditionally)
  # so this profile cannot simply go without one.
  progress: {lo: 0x0094}

  # --- Fight-gate progress (2026-08-25) -------------------------------------
  # docs/proposals/FIGHTGATE_MECHANISM_2026-08-25.md's generic, non-game-
  # specific mechanism for the CAMERA_STATIC_AGENT_ACTIVE class: randomized
  # attack-mash/approach-retreat probes (scripts/discover_observables.py
  # --fight-gate) plus a decrement-consensus self/foe HP discriminator, no
  # game knowledge or RAM map consulted going in. Blind discovery on this
  # exact ROM/start-state (runs/fight_gate/discover_kungfu.json) nominated
  # addr 177 (=0x00B1) -- start=135 (0x87), attack_agree 5/5, defense_agree
  # 0/5, tally_corroborated -- as its ranked #1 foe_hp_candidate.
  #
  # THREE honest qualifications, more serious than Punch-Out's (named as
  # follow-up, not fixed here -- see the live smoke result recorded below
  # before trusting this address):
  #   1. PLAUSIBILITY FLAG on the #1 pick itself. 0x00B1 and its two mirror
  #      siblings (0x00B2, 0x00B3) plus a fourth candidate (0x0269) show
  #      EXACTLY IDENTICAL net deltas across all 5 independently-seeded
  #      attack reps (-1,-1,-1,-1,-1 / -70,-70,-70,-70,-70) -- zero cross-
  #      rep variance regardless of which random actions each rep took.
  #      scripts/discover_observables.py's own ranking docstring
  #      (~line 1894-1906) names this exact signature as "driven by ELAPSED
  #      STEP COUNT alone (a background/attract timer), not by how many
  #      punches actually landed" and says it should be down-ranked -- but
  #      that tiebreak sits AFTER the mirror-sibling bonus in the sort key,
  #      so 0x00B1 wins #1 via its two identical neighbors despite the zero-
  #      spread pattern the same docstring calls suspicious. addr=0x066C
  #      (start=159) shows genuine cross-rep variance (-12,-17,-16,-12,-12,
  #      the shape a hits-landed counter should have) but ranks lower here
  #      (no mirror siblings, one small leak under defense, 1/5).
  #   2. NO independent cross-check exists the way Punch-Out had one.
  #      ram_mapping above has no regular-enemy HP byte at all -- only
  #      boss_energy (0x04A5, itself only CROSS-SOURCED, never independently
  #      verified live, idled at 0x30 in every probe). None of the six
  #      foe_hp_candidates sits at or near 0x04A5, so this run neither
  #      confirms nor refutes that existing field.
  #   3. find_round_gate returned no_round_signal (46 bouts crossed over
  #      24,000 attack_mash/approach_retreat steps -- a real BEHAVIOUR
  #      finding, not VOID/insufficient_probe like Punch-Out) -- no byte was
  #      both stable-within-a-bout and monotone-across-boundaries. `round:`
  #      is omitted below; a bout boundary falls back to the mass-RAM-reset
  #      detector the Solver already applies for deaths/reloads.
  #
  # VERDICT (2026-08-25, post-wiring validation): the plausibility flag
  # above is CONFIRMED, not just suspected. A direct isolated-input probe
  # (pure NOOP, zero buttons pressed for 1200 frame_skip=4 steps) shows
  # 0x00B1 cycling 0 -> 135 -> 0 repeatedly on its own, including one
  # ramp (134->135->136->141->150->163->179->195->211->219) with NO player
  # input at all -- the game's own enemy spawn/walk-in/despawn cycle, not
  # combat outcome. This is exactly the FH1/FH2-pattern false positive the
  # design doc's decrement-consensus gate cannot see (attacking coincides
  # with the same autonomous cycle, producing a fake "decrements under
  # offense" signal). A go_explore_solve smoke on this exact wired file
  # (30s/4 workers) ran clean (16 cells, 12 improvements, 0 crashes) and
  # max_gx_in_max_area rose 0->255 -- but per the probe above that rise is
  # not evidence of learned combat; it is the same autonomous cycle. DO
  # NOT treat this as a validated fight-gate signal. League classification
  # stays CAMERA_STATIC_AGENT_ACTIVE, qualified/plausibility-flagged --
  # NOT promoted to SOUND_ADVANCING. Left wired (rather than reverted) so
  # the failed-validation receipt is reproducible; the recommended next
  # step is either re-probing addr 0x066C (start=159, the candidate with
  # genuine cross-rep variance) or building a fight-gate discriminator
  # that vetoes a candidate showing any NOOP-only oscillation before it
  # can rank #1. DISABLED (not deleted): $0094 above is the active value
  # again, so a future `go_explore_solve.py --profile configs/kungfu.yaml`
  # run cannot silently pick up this confirmed-implausible signal just
  # because it reads as syntactically valid YAML.
  # progress: {source: fight_gate, foe_hp: 0x00B1, foe_hp_start: 0x87}
  # Player pose byte (own-rollout isolated-input probe): 0 = stand/walk,
  # 4 = duck (DOWN held), 128 = airborne (A held); rock-flat under NOOP,
  # returns to 0 the instant the button releases. A discrete pose flag
  # rather than a continuous height -- Kung Fu's jump-kick has no simulated
  # parabolic arc in RAM -- but it cleanly separates grounded/ducking/
  # airborne cells, which is what the archive needs. Required by
  # GenericGame regardless of progress source; unaffected by the fight-gate
  # switch above (foe_hp/foe_hp_start replace lo/hi internally, not y).
  y: 0x0014
  level_key: []
  # NOT wired (2026-08-06): considered clear: {mode: confluence} (the
  # generic detector used for Contra) but did not ship it here. Direct
  # replay testing of the SAME wiring on 3 other secondary games (Gradius,
  # Double Dragon, Kirby) found it CONFIRMED UNSAFE in each case — fires on
  # a real death (Gradius), a combat RAM blip (Double Dragon), or an
  # ordinary room transition (Kirby) — before a single false-positive-free
  # case was found. A short smoke run here didn't happen to trigger it,
  # but "didn't fire yet" isn't evidence of safety given that pattern,
  # and Kung Fu is exactly the combat-heavy shape (frequent knockdowns)
  # that misfired on Double Dragon. Revisit once the detector has a
  # lives-drop veto or a per-game validated config, not before.
  # VERIFIED-LIVE (matches ram_mapping): decrements 3->2->1->0 on every
  # death cycle observed in our own probes; clean death signal alone.
  lives: 0x005C