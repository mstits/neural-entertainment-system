name: "Metroid"
# Live start-room gameplay state (scripts/capture_start_state.py).
# Without it the emulator cold-boots to the title-screen demo, which
# ignores input — training there gives zero learning signal.
start_state_path: "roms/Metroid (USA)_start.state.bin"
rom_hashes:
  - ""

description: >
  Training profile for Metroid (NES, 1986). Non-linear Metroidvania — hard
  exploration problem. Reward strongly favors reaching new rooms + picking
  up powerups (missiles, energy tanks, suit upgrades) + boss kills.

ram_mapping:
  samus_x:         0x030D
  samus_y:         0x030C
  samus_health:    0x0106   # 3-digit BCD (0..99)
  samus_health_tens: 0x0107
  missiles:        0x0109
  room_number:     0x0050
  area_number:     0x0074
  # Item flags (equipment bits)
  item_flags:      0x0878

reward_weights:
  exploration_bonus: 8.0    # new (area, room) — Metroid *lives* on exploration
  missile_collected: 3.0
  energy_tank:       20.0
  new_item:          30.0   # per newly-set item bit
  boss_damage:        2.0
  boss_killed:       60.0
  health_delta:      -1.0
  death_penalty:    -25.0
  time_penalty:      -0.002

action_space:
  - []
  - ["right"]
  - ["left"]
  - ["A"]              # jump
  - ["B"]              # fire / missile
  - ["right", "B"]
  - ["left", "B"]
  - ["right", "A"]
  - ["up"]             # aim up / door
  - ["up", "B"]
  - ["down"]           # morph ball
  # select (weapon toggle) unlocked later once agent has a missile.

curriculum:
  stage_1: ["*"]
  stage_2: ["*"]
  stage_3: ["*"]

reinforce:
  enabled: true
  entropy_coef: 0.02     # Metroid is exploration-heavy — keep entropy up
  ppo_clip_eps: 0.2
