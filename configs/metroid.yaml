name: "Metroid"
reward_id: metroid
# Live start-room gameplay state (Brinstar, 30 energy). Verified: loads
# via NCST instant-load, input moves Samus (x-on-map 0x0050 advances,
# health 0x0106/0x0107 reads 30), i.e. real gameplay, NOT the title-screen
# demo. Without it the emulator cold-boots to the demo, which ignores
# input — zero learning signal.
start_state_path: "roms/Metroid (USA)_start.state.bin"
rom_hashes:
  - ""

# Action-platformer — needs responsive control, so frame_skip 4 (the
# trainer default is 16, far too coarse to jump/dodge/aim). Exploration
# game → long episodes.
frame_skip: 4
max_episode_steps: 3000

description: >
  Training profile for Metroid (NES, 1986). Non-linear Metroidvania — a
  hard-exploration problem. The ONLY reward channels wired to reachable
  RAM today are exploration (new map cells) + health/death/time. Item,
  missile, energy-tank, and boss channels are DISARMED (weight 0.0) on
  two independent grounds: they read cartridge PRG-RAM that nes_core
  does not expose, AND the only addresses ever written down for them
  came from an external RAM map rather than our own measurement. Those
  addresses are quarantined at the bottom of the RAM section and are
  not usable — see the note on reward_weights and the
  `quarantined_external_knowledge` block.

# =====================================================================
# RAM mapping — every key below stands on its OWN empirical differential
# receipt: the bracketed [VERIFIED: ...] tag records the input we drove
# and the movement we watched on THIS ROM. The external RAM-map material
# that used to share this block (the cartridge item/missile bytes and
# their claimed bitfield semantics) has been moved to
# `quarantined_external_knowledge` below and may not be read back in
# without re-derivation — that section carries the rule.
#
# nes_core.get_ram()/the reward snapshot only expose the 2 KB system RAM
# ($0000-$07FF, mirrored); addresses in cartridge PRG-RAM ($6000-$7FFF)
# are UNREACHABLE (get_ram masks to $07FF).
#
# NOTE: MetroidReward in rewards.rs uses HARDCODED address constants;
# this ram_mapping block is documentation only (the Rust reward does
# not read it). Kept accurate so a future reward rewrite has ground
# truth.
# =====================================================================
ram_mapping:
  samus_x_screen:  0x0051   # X on screen (0-255)         [VERIFIED: 0->220 moving right]
  samus_x_map:     0x0050   # X on map (coarse column)    [VERIFIED: 3->5 moving right]
  samus_y_screen:  0x0052   # Y on screen                 [VERIFIED]
  samus_y_map:     0x004F   # Y on map                    [VERIFIED]
  samus_health:    0x0106   # BCD low: tenths | ones      [VERIFIED: reads 30 at start, 30->20 on damage]
  samus_health_hi: 0x0107   # energy TENS digit           [VERIFIED: start 3 = 30 energy; decrements 3->0 under enemy damage]
  #                         # (the "upper nibble = filled energy-tank count"
  #                         #  reading of this same byte is EXTERNAL and was
  #                         #  never observed by us — quarantined below. Only
  #                         #  the verified tens-digit behaviour is relied on.)
  area_number:     0x0074   # region index                [MEASURED: constant 0 across every scripted probe and the 4-min solve; the "region index" LABEL is not yet re-derived]
  # --- UNREACHABLE cartridge PRG-RAM ($6000-$7FFF; get_ram cannot read) ---
  # The item / missile / energy-tank addresses and their claimed equipment
  # bitfield that used to be listed here as comments were external RAM-map
  # material, not our measurement. They now live in
  # `quarantined_external_knowledge` below, barred from every consuming
  # path until re-derived by our own differential protocol.

# =====================================================================
# QUARANTINE — external RAM-map knowledge. This is NOT part of the
# working profile: no loader, trainer, reward, solver or discovery tool
# reads this key, and nothing in it may be promoted into one that does.
# It exists so the contamination is recorded in the open instead of
# sitting unlabelled inside ram_mapping, where it looked like our own
# measurement.
#
# Why it is here: the purity line bans knowledge we did not derive
# ourselves — external RAM maps, disassembly, route lore — from any
# path that solves or scores the game. These bytes and semantics came
# from a third-party community RAM map and were never re-derived on
# this ROM, so they are dead weight until they are.
# =====================================================================
quarantined_external_knowledge:
  # The ROM this contamination record is about. Address numbering is
  # per-ROM: 0x0010 means nothing in common between this game and
  # Arkanoid, so tests/test_purity_quarantine_sweep.py scopes every
  # check to profiles running THIS rom. A block that omits this key
  # is treated as applying to every profile (fail-closed).
  applies_to_rom: "roms/Metroid (USA).nes"
  provenance: >
    Third-party community RAM map (datacrystal-class), copied into this
    profile before the purity line was enforced here. Never re-derived
    on this ROM by our own differential protocol.
  status: >
    UNVERIFIED_EXTERNAL — barred from solve:, reward_weights,
    ram_mapping, and every other consuming path.
  rediscovery_rule: >
    Any byte named in this section is DEAD until it is re-derived from
    scratch by our own differential protocol on this ROM: drive the
    input from the verified start state, watch the byte move, and record
    the wrap / reversibility / saturation-and-persistence evidence in a
    receipt. A byte that passes enters the profile as a NEW entry under
    ram_mapping or solve: carrying its own [VERIFIED: ...] tag and its
    receipt path. The entry here is never promoted in place, never
    edited into a working block, and never cited as the reason a byte
    was chosen. Copying an address out of this section into a solve:
    block is exactly the contamination the quarantine exists to stop.
  # Values below are deliberately STRINGS, not ints. Any tool that tries
  # to fold this section into a name->address map (the way
  # scripts/observatory.py does `int(a)` over ram_mapping) fails loudly
  # instead of silently consuming banned knowledge.
  q_unverified_prg_ram_bytes:
    q_missiles:     "0x6879 UNVERIFIED-EXTERNAL — claimed live missile count"
    q_missile_cap:  "0x687A UNVERIFIED-EXTERNAL — claimed missile-tank count"
    q_energy_tanks: "0x6877 UNVERIFIED-EXTERNAL — claimed energy-tank count"
    q_item_flags:   "0x6878 UNVERIFIED-EXTERNAL — claimed equipment bitfield"
  q_unverified_semantics:
    q_item_flags_bits: >
      Claimed bit assignment of the 0x6878 equipment bitfield (morph
      ball / bombs / high jump / long beam / screw attack / varia /
      wave / ice). Never observed by us, and the byte is unreachable
      through get_ram anyway.
    q_health_hi_tank_nibble: >
      Claimed "upper nibble of 0x0107 = filled energy-tank count".
      0x0107 IS reachable and its TENS-DIGIT behaviour is independently
      verified (start 3 = 30 energy, decrements under damage) — that
      verified part alone is what solve.lives rests on. The tank-nibble
      reading is external and unverified; no reward or solver rule may
      depend on it.

# =====================================================================
# Reward weights.
#   WORKING (reachable RAM):  exploration_bonus, health_delta,
#                             death_penalty, time_penalty.
#   DISARMED (weight 0.0):    missile_collected, energy_tank, new_item,
#                             boss_damage, boss_killed.
# The disarmed channels are read by build_reward() and, at their old
# non-zero weights, fired on the WRONG byte (ram[0x006A]) — an empirical
# run awarded +270 phantom "new_item" reward over one episode while
# Samus collected ZERO items, drowning the real +16 exploration signal
# 17:1. They MUST stay 0.0 until BOTH of the following land: nes_core
# exposes cartridge PRG-RAM, AND the item/missile bytes have been
# re-derived by our own differential protocol. The external addresses
# are quarantined above and may NOT be pasted in as the repoint target
# — MetroidReward gets repointed at re-derived, receipted bytes or not
# at all. Restore the values in the trailing comments only after that.
# =====================================================================
reward_weights:
  exploration_bonus: 8.0    # new (area, map-column) cell — the spine of the reward
  health_delta:      -1.0   # per unit of energy lost
  death_penalty:    -25.0
  time_penalty:      -0.002
  # --- DISARMED until PRG-RAM is exposed (was: 3.0 / 20.0 / 30.0 / 2.0 / 60.0) ---
  missile_collected:  0.0
  energy_tank:        0.0
  new_item:           0.0
  boss_damage:        0.0
  boss_killed:        0.0

action_space:
  - []                 # NOOP
  - ["right"]
  - ["left"]
  - ["A"]              # jump
  - ["B"]              # fire / missile
  - ["right", "B"]
  - ["left", "B"]
  - ["right", "A"]     # run-jump right
  - ["left", "A"]      # run-jump left
  - ["up"]             # aim up / take door up
  - ["up", "B"]        # shoot up
  - ["down"]           # down (crouch / morph, wherever the game allows it)

curriculum:
  # Metroid has no SMB-style area-byte save-state curriculum; the
  # trainer gates that machinery to Mario only. Single-stage from the
  # start state.
  stage_1: ["*"]

reinforce:
  enabled: true
  # === UNIFIED vanilla_ppo + universal pixel CNN ===
  # Metroid has no RAM tile decoder, so it uses the pixel path:
  # 4-stacked 84x84 grayscale frames -> Nature-DQN encoder -> actor/critic.
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  # Skip-per-pixel batched PPU via clean-scanline history (headless-only;
  # a live frame sink keeps exact rendering). Training-quality accepted:
  # rare 1-frame-stale rows are invisible to the 4-frame-stacked policy.
  batched_render: replace
  # Production fast path: drop the per-worker-step catch_unwind wrap.
  panic_isolation: false
  device: mps

  # === ROLLOUT ===
  rollout_steps: 1024
  steps: 10                # K PPO epochs / iter
  ppo_minibatch_size: 256

  # === PPO HYPERPARAMETERS ===
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.03       # exploration-heavy game — keep entropy high
  grad_clip: 0.5
  value_loss: huber

  # === RND INTRINSIC EXPLORATION ===
  # Metroid is the canonical hard-exploration regime RND targets. With
  # the extrinsic item/boss channels disarmed, RND intrinsic reward is
  # the main driver of "go somewhere new". Set to 0.0 for a pure baseline.
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0

# =====================================================================
# Go-Explore solver adapter (coverage bootstrap). Metroid is a
# non-linear Metroidvania — a hard-exploration problem with NO single
# monotone axis and NO reachable clear byte (items/missiles/energy-tanks
# and boss flags live in cartridge PRG-RAM $6000-$7FFF, which get_ram
# masks off). So this is a COVERAGE baseline over (area, x, y): the
# archive banks distinct map positions and returns to them, and the
# search out-travels random by pushing the position frontier past the
# start room's exit — the maneuvers dumb holds never complete.
#
# PURITY: every address in this solve: block was discovered by
# differential analysis of our OWN scripted rollouts from the verified
# start state, cross-checked only against the empirically-receipted
# ([VERIFIED: ...]) subset of ram_mapping above — never against the
# quarantined external material. Nothing under
# `quarantined_external_knowledge` may be consumed here.
# Receipt: runs/metroid/metroid_receipt.json. That receipt predates this
# quarantine and still carries one external-provenance phrase of its
# own; it is left byte-intact as a historical record and is logged, not
# cited as authority, in
# docs/receipts/games/metroid_purity_quarantine_2026-08-10.md.
# ---------------------------------------------------------------------
# ODOMETER-ERA ONBOARDING 2026-08-24 (League wave 1). Receipts:
#   runs/onboard_wave1/gate_metroid.json        — odometer gate, right:
#     PASS "SIGNAL SOUND — game stops" (87 distinct, 0..508 px).
#   runs/onboard_wave1/gate_metroid_left.json   — left: FAIL (blocked
#     alcove, 106 px) — right is the forward axis.
#   runs/onboard_wave1/smoke_metroid/           — 6-min 3-worker smoke,
#     RAM area 0x0074 (inert): 272 cells, max_gx 1045, frontier flat
#     for the last 3 min.
#   runs/onboard_wave1/diag_metroid_deepcell.json — deepest-cell
#     diagnostic: hold-right from the 1045 cell advances the odometer
#     1049->1446 and steps the scene counter 8->9 (door transition),
#     lives steady — NOT a wall, the smoke just hadn't banked it; and
#     the scene counter demonstrably sees Metroid's doors.
#   runs/onboard_wave1/smoke_metroid_scene/     — 6-min re-smoke with
#     area: 0x803 scene keys: 2596 cells, best lineage 16 room
#     transits + gx 1274 px (past the old freeze), steady growth.
# RUN-FLAG NOTE for long runs: max_sect hit the default --sect-cap 16
# inside the first minute (Metroid door transits churn far faster than
# SMB's ~5 rooms the default was sized for). Raise --sect-cap (e.g. 64+)
# on anything longer than a smoke or the transit axis saturates.
# SCENE-ORDINAL CAVEAT (honest limitation, not a defect): 0x803 is a
# scene-cut COUNTER, not a room identity — re-crossing one door steps
# it again, so a backtracking lineage inflates area (max_area 57 in the
# scene smoke). Bounded by the sect cap and by x-dominant scoring, but
# do not read max_area as "distinct rooms reached".
# ---------------------------------------------------------------------
solve:
  rom: "roms/Metroid (USA).nes"
  # progress = fine on-screen X (0x0051, 0-255) | coarse scroll-column
  # (0x0050) << 8 = a forward-travel spine. 0.99 monotone non-decreasing
  # under hold-right (768->1500). x_screen ALONE camera-clamps at 220
  # (rejected as sole progress by the saturation test); x_map is the
  # non-saturating scroll-column counter (steps 3->4->5 per screen of
  # rightward travel) and leads the pair as hi. That pairing rests on
  # our own two-gate measurement above — the fine byte clamps, the
  # coarse byte keeps stepping — and on nothing external. (The wording
  # that stood here appealed to an outside prescription for pairing a
  # camera byte with a screen counter; the purity quarantine struck it.
  # The measurement it decorated is unchanged and stands on its own.)
  # The 1500 ceiling under all scripted holds is the start ROOM boundary
  # (dumb holds cannot reach the exit), not a camera clamp on the
  # combined signal — breaking past it is exactly what the search does.
  # Rejected alternative (own saturation/persistence probe, receipt step2):
  # the higher-range pair 0x0008|0x0065 reaches 6408, but 0x0065 is a
  # NON-DURABLE scroll/elevator accumulator — it ramps 0->25 by +2/frame
  # during a scroll animation then COLLAPSES back to 0 (7 downward resets in
  # a 1500f drive), so its "keeps climbing" is transient, not world position.
  # It fails the persistence half of the saturation test; the verified
  # player-X pair above is the honest durable spine.
  #
  # 2026-08-24 ODOMETER-ERA SWITCH: progress moved from the RAM pair
  # {lo: 0x0051, hi: 0x0050} (measurement above stands, kept as the
  # historical record) to the PPU scroll odometer — the hardware-surface
  # signal, same purity class as pixels/OAM. Gate receipts:
  #   runs/onboard_wave1/gate_metroid.json       — --odometer --forward
  #     right: PASS "SIGNAL SOUND — game stops"; 1200 steps, 87 distinct,
  #     range 0..508 px, flat last quarter = the start-room boundary
  #     (dumb holds cannot open/exit the door; breaking past it is the
  #     search's job — same reading as the RAM-pair 1500 ceiling above).
  #   runs/onboard_wave1/gate_metroid_left.json  — --forward left: FAIL
  #     (20 distinct, 106 px) — left of spawn is a short blocked alcove;
  #     rightward is the sound forward axis.
  progress: {source: odometer, axis: x}
  # y = on-screen Y (0x0052): spans 5 distinct 32-px bands (0,3,4,5,6)
  # across varied movement — a usable fine vertical coverage axis.
  # y_map (0x004F) stays constant (14) in the reachable region — too
  # static/coarse for a cell axis, so the fine screen-Y is used.
  y: 0x0052
  # area = odometer SCENE ordinal (pseudo-address 0x803, appended past
  # the 2KB snapshot by Solver._xram — hardware surface, not a RAM
  # byte). 2026-08-24: replaces 0x0074, which we only ever measured as
  # INERT (constant 0 through every scripted probe and the 4-min solve
  # — it partitioned nothing). The deepest-cell diagnostic
  # (runs/onboard_wave1/diag_metroid_deepcell.json) shows the scene
  # counter STEPS on Metroid's door transitions (8->9 while holding
  # right through a door), so (scene, x) cells make rooms — including
  # vertical shafts where the x integral freezes — distinct frontier
  # territory. 0x0074's historical caveat stands: its "region index"
  # label was never re-derived.
  area: 0x803
  # No reachable per-level clear byte (item/boss state is unreachable
  # PRG-RAM): coverage baseline, level_key empty.
  level_key: []
  # NOT wired (2026-08-06): considered clear: {mode: confluence} (the
  # generic detector used for Contra) but did not ship it here. Direct
  # replay testing of the SAME wiring on 3 other secondary games (Gradius,
  # Double Dragon, Kirby) found it CONFIRMED UNSAFE in each case — fires on
  # a real death (Gradius), a combat RAM blip (Double Dragon), or an
  # ordinary room transition (Kirby) — before a single false-positive-free
  # case was found. A short smoke run here didn't happen to trigger it,
  # but "didn't fire yet" isn't evidence of safety given that pattern.
  # Metroid also has no discrete per-level clear at all (one connected
  # map; the real win is Mother Brain/escape, far beyond this bootstrap's
  # reach), so there may be no honest use for this hook here regardless.
  # Revisit only alongside a lives-drop veto or per-game validated config.
  # HP-decrease death proxy: 0x0107 = energy tens digit + filled-tank
  # nibble (verified ram_mapping; start 3 = 30 energy). A DECREASE means
  # Samus lost >=10 energy (or a tank) = took a real hit; the lineage is
  # terminated. Coarse by design (chip damage below a tens boundary does
  # not reset), so exploration is not starved by minor hits. Metroid has
  # no system-RAM lives counter and no clean death-state byte, so this is
  # the honest death signal.
  lives: 0x0107
  clear:
    # scene_cut DECLINED 2026-08-27, superseding the 2026-08-26 arming
    # (4dd15ea). Re-adjudicated by measurement, not judgement:
    # scripts/scene_cut_arming.py.
    # No fires at the armed gate over 4x6000 steps, but the veto-independent
    # null is (max d_scene=4, max d_blank=16) and nothing establishes that a
    # real transition on this profile would clear it.
    # THE GENERAL REASON, which applies to every profile in this cohort and not
    # only this one: the audit probe CLEARS NOTHING, so its entire observed
    # (d_scene, d_blank) distribution is null. A gate at or below that null
    # fires on ordinary play; a gate above it has no evidence it can ever fire.
    # An ARM needs a WITNESSED positive -- one blank run known to be a level
    # transition -- and no profile here has one. Same refusal, same reason, as
    # docs/receipts/rygar/clear_predicate_REFUTED.md.
    # The instrument is NOT the problem: odo_blank moves for 20 of the 25
    # cohort profiles and reads 55/55 transitions on Rygar's banked tape.
    # Re-arm by witnessing one transition on this profile, registering it in
    # scene_cut_arming.WITNESSED_TRANSITIONS, and re-running the audit.
    # Reproduce: .venv/bin/python scripts/scene_cut_arming.py --profile configs/metroid.yaml
    # Receipt:   docs/receipts/clear_control/scene_cut_arming_2026-08-27.json
    signals:
      scene_cut:
        enabled: false
        reason: >-
          DECLINED 2026-08-27 by scripts/scene_cut_arming.py. No fires at the
          armed gate over 4x6000 steps, but the veto-independent null is (max
          d_scene=4, max d_blank=16) and nothing establishes that a real
          transition on this profile would clear it. An ARM requires a
          witnessed level transition to place a length floor against; this
          profile has none.

  # progress_cap history: 16384 guarded the OLD {0x0051|0x0050<<8} pair
  # against mid-load garbage spikes in the <<8 term. The odometer is a
  # clamped in-core integral with no torn/garbage-read mode, and long
  # searches can legitimately travel past 16384 px, so the tuned cap is
  # retired with the pair; the solver default (30000) applies.
