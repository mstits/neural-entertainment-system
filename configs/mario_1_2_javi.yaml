# Mario 1-2 JAVI — the research-corrected recipe (2026-07-22).
#
# The v2 recurrent+wavefront+DARS run FAILED in a diagnostic way (confirmed by
# the 3-mode probe): the dense shaping was FARMABLE, so the *sampled* return
# climbed (826->1692) while the *greedy* policy — the only mode the honest gate
# runs — collapsed to a ~6%-depth early death, and the goal was never reached in
# 766 iters. The researcher's corrected recipe fixes each failure mode:
#
#   1. NON-FARMABLE wavefront PBRS (was farmable). Positive-shifted
#      Phi(s) = 100*(1 - D(s)/D_start) in [0,100], Phi(terminal)=0 on any
#      non-clear terminal => F = -Phi(prev) on death/timeout, so progress-then-die
#      telescopes to <= 0 and CANNOT be banked. Only completing yields net-positive
#      shaping. (src/utils/wavefront_reward.py + trainer terminal branch.)
#   2. GREEDY is the training target (was: sampled). demo_anchor_margin adds the
#      DQfD large-margin term (Hester 2018 eq.4): the expert action's logit is
#      forced >= margin above all others => the ARGMAX/greedy mode is bound to the
#      expert, not just the sampled distribution.
#   3. REACH the goal (v2 never did from the entrance). go_explore inline restarts
#      (Ecoffet 2021 first-return-then-explore) restart dead envs from archive
#      frontier cells; with the forward-solution demos anchoring the argmax, the
#      sampled rollouts reach the flag early and populate the archive to the goal,
#      then the backward curriculum welds every segment.
#   4. FEEDFORWARD, not recurrent (v2's GRU added nothing: 3-mode probe A~=B). A
#      128/32 tile MLP.
#
# Demo anchor = expert FORWARD solutions (bind greedy to the completing path) +
# DARS recoveries (return-to-path robustness). All search-provenance, allowlisted.
# GATE: cold GREEDY + sticky-0.25 + jitter-16 from the 1-2 entrance >= 60%.

name: Mario 1-2 JAVI (non-farmable wavefront + margin-bound greedy + restarts)
reward_id: mario
rom_path: "roms/Super Mario Bros. (World).nes"
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
frame_skip: 4
start_state_path: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_03.state"
description: >
  Mario 1-2 learned clear via the research-corrected recipe: non-farmable
  positive-shifted wavefront PBRS, DQfD large-margin demo anchor on the expert
  forward solutions + DARS recoveries (binds the GREEDY mode), Go-Explore
  backward-curriculum restarts, feedforward tile MLP, sticky-0.25. Honest gate:
  cold greedy sticky+jitter 1-2 clear from the entrance.

ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29

reward_weights:
  forward_progress: 1.0
  time_penalty: -0.01
  death_penalty: -15.0
  completion_bonus: 50.0
  score_delta: 0.0
  air_bonus: 0.0
  survival_bonus: 0.0
  jump_clear_bonus: 0.0
  checkpoint_scale: 0.0

action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles_pos
  recurrent: false             # feedforward MLP (v2's GRU added nothing)
  tile_hidden_dim: 128
  tile_trunk_dim: 32
  preserve_elite_diversity: true
  freeze_pre_ppo_elite: true
  episodes_per_genome: 2
  symlog_rewards: true
  value_loss: huber
  value_coef: 0.25
  gae_lambda: 0.95
  gamma: 0.99
  bc_epochs: 0
  warmup_gens_ga_only: 10
  steps: 10
  lr: 0.0003
  ppo_clip_eps: 0.2
  async_pipeline: false
  device: cpu
  panic_isolation: false
  entropy_coef: 0.005
  entropy_floor: 0.1
  entropy_coef_max: 0.05
  # Wavefront supplies the dense long-horizon signal; RND OFF (its intrinsic
  # bonus is itself semi-farmable and would compete with the PBRS gradient).
  rnd_intrinsic_coef: 0.0
  rnd_loss_coef: 0.0
  sticky_action_prob: 0.25
  # NON-FARMABLE dense distance-to-goal shaping (positive-shifted PBRS,
  # search-derived from the Go-Explore solution traces — no game internals).
  wavefront_reward:
    enabled: true
    dmap: "checkpoints/wavefront/mario_1_2_dmap.pkl"
    phi_target: 100.0
    gamma: 0.99
  # JAVI L_BC: expert FORWARD solutions (bind the greedy/argmax mode to the
  # completing path) + DARS recoveries (return-to-path robustness). Large margin
  # forces the argmax onto the expert action, decayed 1.0 -> 0.02 so the policy
  # weans onto its own robust play for the honest greedy eval.
  demo_anchor_enabled: true
  demo_anchor_paths:
  - "runs/ge_1_2_solve/demos/demo_000.npz"
  - "runs/ge_1_2_solve/demos/demo_001.npz"
  - "runs/ge_1_2_solve/demos/demo_002.npz"
  - "runs/ge_1_2_solve/demos/demo_003.npz"
  - "runs/dars_1_2/recovery_demos.npz"
  # Wall-window stall recoveries (D 400-560, stall-frames 8): covers the
  # stalled-at-obstacle states an arriving policy actually occupies — the
  # running-only sets above have zero coverage there and the greedy argmax
  # stalled at exactly that window (median minD 487-490 across every probe).
  - "runs/dars_1_2/wall_recovery_demos.npz"
  demo_anchor_coef: 1.0
  demo_anchor_coef_final: 0.02
  demo_anchor_margin: 0.5      # DQfD large-margin -> binds the GREEDY mode
  demo_anchor_decay_start: 100
  demo_anchor_decay_iters: 600
  demo_anchor_minibatch: 256
  bc_replay_enabled: false
  preprocess_f16: false
  smb_curriculum: false
  # Backward-curriculum restarts: dead envs restart from archive frontier cells
  # (Go-Explore first-return-then-explore, Ecoffet 2021) so every segment is
  # practiced instead of needing ~800 correct steps from the entrance. gx-phase
  # cells match Mario's progress coordinate. Archive at <ckpt>/go_explore/archive.pkl.
  go_explore:
    enabled: true
    inline_return_prob: 0.6
    cell:
      type: smb_gx_phase
      gx_bucket: 16
      y_bucket: 32
    score: max_x
    save_every: 20
  num_envs: 60

ga_params:
  mutation_rate: 0.8
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  stale_gens_before_restart: 50
  restart_fraction: 0.5

max_episode_steps: 2400
