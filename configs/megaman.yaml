name: "Mega Man"
reward_id: mega_man
# NOTE: the reward fn + RAM map are calibrated for Mega Man 2 and
# verified against datacrystal.tcrf.net/wiki/Mega_Man_2/RAM_map:
#   $0460 X (screen-relative, wraps per screen), $04A0 Y, $06C0 HP
#   (full=0x1C=28), $00A8 lives (boots to 3). DEFAULT_ROMS points at the
#   MM2 ROM. The boss-HP entry that used to sit here was retracted
#   2026-08-27 — no boss room has ever been reached on this profile, so
#   "idles 0 until the boss room" described behaviour nobody here saw.
#   See `quarantined_external_knowledge` below.
# The start state below drops into Metal Man's stage (the easiest
# first-win target). It was captured with a game-specific sequence
# (the generic capture_start_state masher cannot navigate MM2's
# title -> START GAME -> NORMAL difficulty -> stage-select flow, and
# must move the cursor off the locked center before confirming); see
# the megaman branch documented for scripts/capture_start_state.py.
start_state_path: "roms/Mega Man 2 (USA)_start.state.bin"
rom_hashes:
  - "8e4bc5b03ffbd4ef91400e92e50dd294"  # Mega Man 2 (USA), No-Intro

# Action platformer — needs responsive control (frame_skip 4, not the
# trainer's default 16). The start state drops into a robot-master stage.
frame_skip: 4
max_episode_steps: 2000

description: >
  Training profile for Mega Man 2 (NES, 1988). Non-linear level selection,
  boss-gated progression. Reward favors boss kills + health preservation +
  sub-weapon pickups. Assumes the player starts on the stage-select screen
  with a start state that drops them into a specific stage.

ram_mapping:
  # Mega Man position
  player_x:        0x0460   # page byte
  player_x_sub:    0x0480   # within-page offset
  player_y:        0x04A0
  player_health:   0x06C0   # 0x00..0x1C (28 units)
  # Weapon / score
  weapon_energy:   0x09C0
  lives:           0x00A8


# --------------------------------------------------------------------------
# Retracted 2026-08-27 — see docs/research/UNWITNESSED_SEMANTICS_2026-08-27.md
# String value on purpose: `int(v)` must raise, so no consumer can fold this
# address back into a set (the exclusion-fold inversion closed for Zelda in
# 222ae25). tests/test_purity_quarantine_sweep.py enforces that no profile on
# this ROM re-adopts it into a live `ram_mapping`.
quarantined_external_knowledge:
  applies_to_rom: "roms/Mega Man 2 (USA).nes"
  provenance: >-
    datacrystal.tcrf.net/wiki/Mega_Man_2/RAM_map, named by this file's own
    header, which described the whole block as "verified against"
    that page.
  status: UNVERIFIED_EXTERNAL
  rediscovery_rule: >
    Dead until a boss room is actually reached on this profile and the
    byte is logged across a boss fight. Nothing here has come close:
    runs/megaman/mm2_bootstrap and mm2_bootstrap2 solutions/ are both
    empty, runs/clear_detection/megaman/s6_instrument/solutions is empty,
    is_clear is structurally unfireable (level_key is []), and the
    empirical odometer plateau is gx 4864. A byte that passes enters a
    NEW ram_mapping entry carrying its own receipt.
  q_boss_health:  "0x06C1"  # claimed: boss HP, idling 0 until the boss room.
                            # The idling-at-0 half is consistent with what we
                            # see, but a byte that reads 0 under every policy
                            # is consistent with being any unreached
                            # observable; the boss-HP identity is the external
                            # part and has no witness here.
                            # STILL LIVE IN THE ENGINE: nes_core/src/rewards.rs
                            # hardcodes RAM_BOSS_HEALTH = 0x06C1. Quarantining
                            # this entry retracts the documentation claim; it
                            # does NOT disarm the Rust constant.

reward_weights:
  forward_progress: 0.1
  health_delta:    -2.0     # lose 1 health unit = -2 reward
  boss_damage:      5.0     # per unit of boss health lost
  boss_killed:     75.0
  death_penalty:  -30.0
  time_penalty:    -0.002

action_space:
  - []
  - ["right"]
  - ["left"]
  - ["A"]            # jump
  - ["B"]            # fire
  - ["right", "B"]
  - ["left", "B"]
  - ["right", "A"]
  - ["right", "A", "B"]
  - ["down"]         # slide (MM3+ only; safe to include)
  - ["up"]           # ladders
  # select removed early: sub-weapon cycle only matters once the agent
  # has defeated a boss and acquired a second weapon. Add it back via
  # a curriculum-aware action space at that point.

curriculum:
  stage_1: ["*"]
  stage_2: ["*"]
  stage_3: ["*"]

reinforce:
  enabled: true
  # === UNIFIED vanilla_ppo (Phase 2 — pixel-CNN path, same as Contra) ===
  # No RAM tile decoder for Mega Man, so the universal pixel encoder:
  # 4-stacked 84x84 grayscale -> Nature DQN CNN -> actor/critic. SMB
  # area-byte curriculum is gated off (non-Mario); single-stage PPO
  # from the start state (a robot-master stage). RND drives exploration.
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps            # CNN ~4.7x faster on MPS than CPU (benched)
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.015
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0

# Solver adapter (Observatory v2 bootstrap, 2026-08-01). Addresses discovered
# by differential analysis of OUR OWN scripted rollouts from the start state
# (no external RAM map). Full evidence: runs/megaman/mm2_observables_receipt.json.
# NOTE: the ram_mapping block above is the datacrystal-derived TRAINING map and
# is deliberately NOT reused here -- these solve addresses are independently
# receipted. y and lives happen to agree with the receipted partials; progress
# is the newly-confirmed player-absolute-X odometer.
solve:
  no_clear_predicate: "no witnessed clear exists for this game, so no predicate can be validated; deliberately unminted per the 4-CONFIRMED/41-VOID roster adjudication (docs/research/CLEAR_GAP_CLOSURE_2026-08-26.md). `solutions: 0` here is a compile-time constant, never a search result."
  rom: "roms/Mega Man 2 (USA).nes"
  # 2026-08-24 odometer-era onboarding: progress = PPU scroll odometer,
  # x axis. Both candidate signals passed scripts/progress_signal_gate.py
  # from this start state (Metal Man stage strip, right-hold, 1200 steps):
  #   odometer:  SOUND, 91 distinct over 0..808 px, oam_churn 497/1199
  #              (runs/onboard_wave1/gate_megaman2.json)
  #   RAM pair {lo:0x0460, hi:0x0440} (player absolute X, receipted
  #              runs/megaman/mm2_observables_receipt.json): SOUND,
  #              47 distinct over 0..312
  #              (runs/onboard_wave1/gate_megaman2_rampair.json)
  # The odometer resolved ~2.6x further under the identical driver and is
  # the certified hardware surface (scripts/odometer_cert.py 5/5), so it
  # drives the search; the RAM pair is kept on record above as the
  # cross-check. lives@start = 3, so deaths are detectable.
  #
  # Smoke (2026-08-24, go_explore_solve, 3 workers, 6 min, seed 0):
  # SOUND_ADVANCING — done: 1128 cells, frontier 890, best_score 2981,
  # max_gx 2981 px, max_area 0; the gx frontier moved in EVERY 60s
  # window (824 -> 832 -> 1420 -> 2304 -> 2873 -> 2981) with no freeze,
  # so no deepest-cell diagnostic was warranted.
  # Receipt: runs/onboard_wave1/smoke_megaman2/progress.jsonl.
  # If a longer run ever walls at a boss door or a vertical screen
  # transition, the first lever is the odometer scene ordinal
  # (`area: 0x803`, the Ninja Gaiden recipe) — NOT wired now because
  # nothing in the smoke justified it.
  progress: {source: odometer, axis: x}
  # 0x002E = MegaMan Y (ballistic): 164 grounded, 114 at jump apex.
  y: 0x002E
  # level_key EMPTY = coverage baseline. No stage/room advance byte is receipted
  # yet (the start-state strip is a single robot-master stage; a room counter
  # would be discovered from deep arrival states before chaining).
  level_key: []
  # NOT wired (2026-08-06): considered clear: {mode: confluence} (the
  # generic detector used for Contra) but did not ship it here. Direct
  # replay testing of the SAME wiring on 3 other secondary games (Gradius,
  # Double Dragon, Kirby) found it CONFIRMED UNSAFE in each case — fires on
  # a real death (Gradius), a combat RAM blip (Double Dragon), or an
  # ordinary room transition (Kirby) — before a single false-positive-free
  # case was found. A short smoke run here didn't happen to trigger it,
  # but "didn't fire yet" isn't evidence of safety given that pattern.
  # Revisit once the detector has a lives-drop veto or a per-game
  # validated config, not before.
  # 0x00A8 = lives (3 at start, decrements 3->2->1->0 at deaths). Death signal.
  lives: 0x00A8
  clear:
    # scene_cut DECLINED 2026-08-27, superseding the 2026-08-26 arming
    # (27902e1). Re-adjudicated by measurement, not judgement:
    # scripts/scene_cut_arming.py.
    # No fires at the armed gate over 4x6000 steps, but the veto-independent
    # null is (max d_scene=2, max d_blank=18) and nothing establishes that a
    # real transition on this profile would clear it.
    # THE GENERAL REASON, which applies to every profile in this cohort and not
    # only this one: the audit probe CLEARS NOTHING, so its entire observed
    # (d_scene, d_blank) distribution is null. A gate at or below that null
    # fires on ordinary play; a gate above it has no evidence it can ever fire.
    # An ARM needs a WITNESSED positive -- one blank run known to be a level
    # transition -- and no profile here has one. Same refusal, same reason, as
    # docs/receipts/rygar/clear_predicate_REFUTED.md.
    # The instrument is NOT the problem: odo_blank moves for 20 of the 25
    # cohort profiles and reads 55/55 transitions on Rygar's banked tape.
    # Re-arm by witnessing one transition on this profile, registering it in
    # scene_cut_arming.WITNESSED_TRANSITIONS, and re-running the audit.
    # Reproduce: .venv/bin/python scripts/scene_cut_arming.py --profile configs/megaman.yaml
    # Receipt:   docs/receipts/clear_control/scene_cut_arming_2026-08-27.json
    signals:
      scene_cut:
        enabled: false
        reason: >-
          DECLINED 2026-08-27 by scripts/scene_cut_arming.py. No fires at the
          armed gate over 4x6000 steps, but the veto-independent null is (max
          d_scene=2, max d_blank=18) and nothing establishes that a real
          transition on this profile would clear it. An ARM requires a
          witnessed level transition to place a length floor against; this
          profile has none.
  # player_state/death_states OMITTED: no clean death byte confirmed. 0x0020
  # (alive flag) is also 0 at spawn; 0x002A (5 live / 6 death) covers only ~72%
  # of death frames -- both risk false is_dead at episode start. The lives
  # decrement is the unambiguous death detector.
