name: "Castlevania"
# Live stage-01 gameplay state (scripts/capture_start_state.py). Without
# it the emulator cold-boots to the title-screen demo, which ignores
# input — training there gives zero learning signal.
start_state_path: "roms/Castlevania (USA)_start.state.bin"
rom_hashes:
  - ""

# Action platformer — needs responsive control (frame_skip 4, not the
# trainer's default 16). Start state drops into Stage 01 gameplay.
frame_skip: 4
max_episode_steps: 2000

description: >
  Training profile for Castlevania (NES, 1986). Linear side-scroller,
  whip-based combat, slow jumps. Reward favors forward progress + defeating
  sub-bosses + collecting hearts (sub-weapon ammo).

# Corrected 2026-07-27 by the change-rate protocol (scripts/verify_ram_map.py,
# receipt: docs/receipts/ram_verify/castlevania.json). The original
# player_x_screen (0x3F) failed wrap-coupling (0/9) and player_y (0x3E)
# showed zero jump swing; the verified pair/arc bytes replace them.
ram_mapping:
  player_x:        0x0040   # level-x low byte: hold-right net +2412, mono 0.91
  player_x_hi:     0x0041   # page byte: 8/9 wraps coupled, 10 changes/900 steps
  player_y:        0x003F   # ABSOLUTE screen-y: jump arc ptp 53, stair-climb
                            # mono 0.85 (hold-up sweep), floor ~176. The
                            # 0x488 byte is only a jump OFFSET (blind to
                            # stairs/terrain) — cost block 2 its frontier.
  jump_offset:     0x0488   # informational; do not key cells on it
  player_health:   0x0044
  stage_number:    0x0028   # stable under random play (0.08 changes/1k)
  lives:           0x002A   # 4 decrements observed over 12k random steps
  hearts:          0x0045   # sub-weapon ammo
  # Boss health during boss fights
  boss_health:     0x04A0

# Solver contract (go_explore_solve) — every byte observationally verified
# from our own rollouts; see the receipt above. `level_key` bytes identify
# the current stage/block (clear = any change); progress is the 16-bit
# little-endian pair; death = lives decrement.
solve:
  rom: "roms/Castlevania (USA).nes"
  progress: {lo: 0x0040, hi: 0x0041}
  y: 0x003F
  level_key: [0x0028]
  lives: 0x002A
  # Sustained-hold macros: stair mounts need many consecutive up-holds,
  # which stochastic sampling almost never emits (block-2 frontier pinned
  # at the first staircase wall, 34 cells, gx 264 — diagnosed by rendering
  # the frontier 2026-07-27). Same generic mechanism as SMB 8-4's
  # pipe-entry macro; recorded verbatim in traces.
  hold_macros:
    - {buttons: ["up"], steps: 24, p: 0.02}
    - {buttons: ["down"], steps: 24, p: 0.01}
  # On-stairs mode bit (block-3 diagnosis 2026-07-29): player mode byte
  # $0004 reads 8 exactly while in the stair state-machine (auto-walk +
  # climb), found by differential analysis of scripted climbs vs jumps/
  # walks/stands. Without it, stair-climb states alias with jump apexes
  # at the same (gx, y-band) and lose the fewer-steps tie-break — the
  # staircase stays structurally invisible to the archive (4.2M steps,
  # zero climbs survived). One bit, cardinality 2.
  state_sig:
    - {addr: 0x0004, match: [8]}
  # Active-entity slot flags (0x450..0x457, observed 0/1 spawn/despawn in
  # block-3 differential probes 2026-07-29/30): --kill-key counts 1->0
  # transitions as kills for the prerequisite-gate search dimension.
  entity_slots: {lo: 0x0450, hi: 0x0458}

reward_weights:
  forward_progress: 0.5
  health_delta:    -1.5
  heart_collected:  0.5     # sub-weapon ammo is useful later
  boss_damage:      3.0
  boss_killed:     50.0
  stage_cleared:   100.0
  death_penalty:  -25.0
  time_penalty:    -0.005

action_space:
  - []
  - ["right"]
  - ["left"]
  - ["A"]
  - ["B"]              # whip
  - ["right", "B"]
  - ["up", "B"]        # sub-weapon
  - ["right", "A"]
  - ["down"]           # crouch
  - ["down", "B"]      # crouch-whip
  # Full d-pad coverage (2026-07-27): the original combat-oriented set had
  # no plain "up" and no diagonal holds, leaving parts of the controller
  # unreachable to search. Generic completeness, no route knowledge.
  - ["up"]
  - ["up", "right"]
  - ["up", "left"]
  - ["down", "right"]
  - ["down", "left"]
  - ["left", "A"]

curriculum:
  stage_1: ["*"]
  stage_2: ["*"]
  stage_3: ["*"]

reinforce:
  enabled: true
  # === UNIFIED vanilla_ppo (Phase 2 — pixel-CNN path, same as Contra) ===
  # No RAM tile decoder, so the universal pixel encoder: 4-stacked
  # 84x84 grayscale -> Nature DQN CNN -> actor/critic. SMB area-byte
  # curriculum gated off (non-Mario); single-stage PPO from the Stage 01
  # start state. RND drives exploration.
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps            # CNN ~4.7x faster on MPS than CPU (benched)
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.015
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0
