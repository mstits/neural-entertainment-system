name: "Castlevania"
reward_id: castlevania
# Live stage-01 gameplay state (scripts/capture_start_state.py). Without
# it the emulator cold-boots to the title-screen demo, which ignores
# input — training there gives zero learning signal.
start_state_path: "roms/Castlevania (USA)_start.state.bin"
rom_hashes:
  - ""

# Action platformer — needs responsive control (frame_skip 4, not the
# trainer's default 16). Start state drops into Stage 01 gameplay.
frame_skip: 4
max_episode_steps: 2000

description: >
  Training profile for Castlevania (NES, 1986). Linear side-scroller,
  whip-based combat, slow jumps. Reward favors forward progress + defeating
  sub-bosses + collecting hearts (sub-weapon ammo).

# Corrected 2026-07-27 by the change-rate protocol (scripts/verify_ram_map.py,
# receipt: docs/receipts/ram_verify/castlevania.json). The original
# player_x_screen (0x3F) failed wrap-coupling (0/9) and player_y (0x3E)
# showed zero jump swing; the verified pair/arc bytes replace them.
ram_mapping:
  player_x:        0x0040   # level-x low byte: hold-right net +2412, mono 0.91
  player_x_hi:     0x0041   # page byte: 8/9 wraps coupled, 10 changes/900 steps
  player_y:        0x003F   # ABSOLUTE screen-y: jump arc ptp 53, stair-climb
                            # mono 0.85 (hold-up sweep), floor ~176. The
                            # 0x488 byte is only a jump OFFSET (blind to
                            # stairs/terrain) — cost block 2 its frontier.
  jump_offset:     0x0488   # informational; do not key cells on it
  player_health:   0x0044
  stage_number:    0x0028   # stable under random play (0.08 changes/1k)
  lives:           0x002A   # 4 decrements observed over 12k random steps
  hearts:          0x0045   # CONTESTED — two in-repo measurements disagree
                            # and neither has been re-run. This entry says
                            # sub-weapon ammo; nes_core/src/rewards.rs says
                            # 0x0045 "is actually Simon's real HP" and moved
                            # its own heart term to 0x0071. But that same Rust
                            # impl block declares RAM_PLAYER_HEALTH = 0x0044
                            # three lines above (matching player_health here),
                            # so both readings of 0x0045 cannot hold, and
                            # 0x0071 has no receipt anywhere under docs/ or
                            # runs/. What IS receipted:
                            # docs/receipts/ram_verify/castlevania.json grades
                            # 0x45 "churn 2.9/1k (informational)" — no
                            # heart-pickup differential was ever run. Treat the
                            # label as unresolved until one is.


# --------------------------------------------------------------------------
# Retracted 2026-08-27 — see docs/research/UNWITNESSED_SEMANTICS_2026-08-27.md
# String value on purpose: `int(v)` must raise, so no consumer can fold this
# address back into a set (the exclusion-fold inversion closed for Zelda in
# 222ae25). tests/test_purity_quarantine_sweep.py enforces that no profile on
# this ROM re-adopts it into a live `ram_mapping`.
quarantined_external_knowledge:
  applies_to_rom: "roms/Castlevania (USA).nes"
  provenance: >-
    Unattributed: the entry is unchanged from this repo's bulk initial
    commit and was never receipted at introduction. It survived the
    2026-07-27 change-rate-protocol pass that corrected player_x/player_y
    on this same profile.
  status: UNVERIFIED_EXTERNAL
  rediscovery_rule: >
    Dead until a Castlevania boss fight is actually reached here and the
    byte is logged across it. Castlevania IS a confirmed-clear profile —
    level_key 0x0028 advances 0->1->2->3 replay-verified across five
    independent run trees — but no boss fight has ever been witnessed on
    it, and this byte specifically was never observed firing:
    docs/receipts/ram_verify/castlevania.json grades 0x4A0 "churn 0.0/1k
    (informational)" and commit 367676e (2026-07-29) records "the
    receipted 0x4A0 boss_health byte read 0 through live fights ... left
    unconfigured until observed moving". A byte that passes enters a NEW
    ram_mapping entry carrying its own receipt.
  q_boss_health:  "0x04A0"  # claimed: boss health during boss fights. Flat 0
                            # in every measurement taken; nes_core/src/rewards.rs
                            # later calls it "emulator-verified DEAD (reads 0
                            # constantly)". NOTE the replacement that impl block
                            # moved to, 0x01A9, is itself sourced to "Data
                            # Crystal + tasvideos ... not yet
                            # Dracula-fight-verified" — an external,
                            # still-unwitnessed claim living in the engine
                            # rather than here. See the follow-up named in
                            # docs/research/UNWITNESSED_SEMANTICS_2026-08-27.md.

# Solver contract (go_explore_solve) — every byte observationally verified
# from our own rollouts; see the receipt above. `level_key` bytes identify
# the current stage/block (clear = any change); progress is the 16-bit
# little-endian pair; death = lives decrement.
solve:
  rom: "roms/Castlevania (USA).nes"
  # Odometer-era League onboarding 2026-08-24: hardware-surface cross-check
  # PASSED — PPU scroll odometer gate (progress_signal_gate.py --odometer,
  # hold-right 1200 steps) reads SOUND/still-advancing: 905 distinct over
  # 0..3055 px, tail still moving, OAM churn 1185/1199, lives@start=4
  # (runs/onboard_wave1/gate_castlevania.json). The receipted RAM pair
  # below stays primary because the whole solve contract (state_sig,
  # hold_macros, entity_slots) is keyed to player-x, which the camera
  # odometer only approximates; {source: odometer, axis: x} is a certified
  # drop-in fallback if the pair ever fails a gate.
  # Solver smoke (go_explore_solve --workers 3 --minutes 6 --seed 0,
  # runs/onboard_wave1/smoke_castlevania): SOUND_ADVANCING — 3 replay-
  # verified block clears (0,)->(1,) inside the first minute (best 559
  # actions), 265 cells, max_gx 751 in block 0 = the block's extent at
  # the clear transition, not a frozen frontier.
  progress: {lo: 0x0040, hi: 0x0041}
  y: 0x003F
  level_key: [0x0028]
  lives: 0x002A
  # Sustained-hold macros: stair mounts need many consecutive up-holds,
  # which stochastic sampling almost never emits (block-2 frontier pinned
  # at the first staircase wall, 34 cells, gx 264 — diagnosed by rendering
  # the frontier 2026-07-27). Same generic mechanism as SMB 8-4's
  # pipe-entry macro; recorded verbatim in traces.
  hold_macros:
    - {buttons: ["up"], steps: 24, p: 0.02}
    - {buttons: ["down"], steps: 24, p: 0.01}
  # On-stairs mode bit (block-3 diagnosis 2026-07-29): player mode byte
  # $0004 reads 8 exactly while in the stair state-machine (auto-walk +
  # climb), found by differential analysis of scripted climbs vs jumps/
  # walks/stands. Without it, stair-climb states alias with jump apexes
  # at the same (gx, y-band) and lose the fewer-steps tie-break — the
  # staircase stays structurally invisible to the archive (4.2M steps,
  # zero climbs survived). One bit, cardinality 2.
  state_sig:
    - {addr: 0x0004, match: [8]}
  # Active-entity OCCUPANCY flags, 0x450..0x457.
  #
  # RECEIPTED 2026-08-10 (scripts/probe_entity_slots.py; receipts:
  # docs/receipts/probes/cv_entity_slots_2026-08-10.json, _site2_,
  # _attribution_). Until then the only provenance for this range was
  # this comment, which cited "block-3 differential probes 2026-07-29/30"
  # — no such artifact existed. It is the one solve byte-range that ever
  # entered the profile unreceipted; the probe closes that and corrects
  # what the comment claimed.
  #
  # CONFIRMED by the probe: the bounds are a measured structure, not an
  # assumption. Sweeping the whole page 0x0400-0x04FF, the longest
  # contiguous run of binary-{0,1} bytes is exactly 0x0450-0x0458
  # (length 8; runner-up length 3). Slots spawn and despawn under our
  # own inputs — 0.00 despawns/1k under NOOP vs 24.00/1k under the best
  # arm at the block-3 hall root.
  #
  # REFUTED by the same probe: the old comment said "--kill-key counts
  # 1->0 transitions as kills". It does not. Every action arm above the
  # NOOP baseline at both probe sites contains `right`; both attack
  # actions (B, down+B) sit exactly at baseline; holding locomotion
  # constant, right+B vs right moves the pooled rate +2.0/1k and
  # +0.0/1k, matching the non-attack control right+A vs right. The 1->0
  # edge tracks the CAMERA SCROLLING PAST an entity, so a cumulative
  # count over it is a monotone function of distance — a positional
  # alias. It is also farmable: 317 edges over 8 slots at each site
  # (~40x respawn).
  #
  # CONSEQUENCE: do NOT enable --kill-key on this profile expecting a
  # combat axis; it would key cells on distance travelled. A real
  # interaction axis needs a contact-conditioned differential first
  # (docs/proposals/gate_opener_arm_2026-08-11.md §3.1(a2) P1-P4).
  # The range stays declared because the occupancy reading is sound and
  # it is the substrate that probe will work from.
  #
  # Residual defects, recorded not smoothed: at the hall root 0x0451 and
  # 0x0452 are byte-identical columns over 32k steps and 0x0453 showed
  # zero spawns, so the reachable mask alphabet is well under 2^8.
  entity_slots: {lo: 0x0450, hi: 0x0458}

reward_weights:
  forward_progress: 0.5
  health_delta:    -1.5
  heart_collected:  0.5     # sub-weapon ammo is useful later
  boss_damage:      3.0
  boss_killed:     50.0
  stage_cleared:   100.0
  death_penalty:  -25.0
  time_penalty:    -0.005

action_space:
  - []
  - ["right"]
  - ["left"]
  - ["A"]
  - ["B"]              # whip
  - ["right", "B"]
  - ["up", "B"]        # sub-weapon
  - ["right", "A"]
  - ["down"]           # crouch
  - ["down", "B"]      # crouch-whip
  # Full d-pad coverage (2026-07-27): the original combat-oriented set had
  # no plain "up" and no diagonal holds, leaving parts of the controller
  # unreachable to search. Generic completeness, no route knowledge.
  - ["up"]
  - ["up", "right"]
  - ["up", "left"]
  - ["down", "right"]
  - ["down", "left"]
  - ["left", "A"]

curriculum:
  stage_1: ["*"]
  stage_2: ["*"]
  stage_3: ["*"]

reinforce:
  enabled: true
  # === UNIFIED vanilla_ppo (Phase 2 — pixel-CNN path, same as Contra) ===
  # No RAM tile decoder, so the universal pixel encoder: 4-stacked
  # 84x84 grayscale -> Nature DQN CNN -> actor/critic. SMB area-byte
  # curriculum gated off (non-Mario); single-stage PPO from the Stage 01
  # start state. RND drives exploration.
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps            # CNN ~4.7x faster on MPS than CPU (benched)
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.015
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0
