# Mario 1-1 backward — RECURRENT BOTTLENECK arm (v25 falsifier).
#
# Pre-registered A/B: docs/proposals/RECURRENT_BOTTLENECK_AB_2026-08-23.md
# SINGLE VARIABLE vs configs/mario_1_1_backward.yaml = policy class at
# matched parameter budget:
#     control    TilePolicyNetwork          64/32   48,135 params (banked;
#                the encoder is smb_tiles_pos with frame_stack 4 =>
#                feature_dim 712, so the historical "14k" label is stale)
#     treatment  TileRecurrentPolicyNetwork 56/32   48,975 params (+1.7%)
# Everything else is byte-identical to the banked recipe. The banked
# control comparator is best-of-N honest 0.76
# (checkpoints/_preserved/backward_1_1_seed3_iter140.pt); we do NOT
# re-run the control arm — its seed distribution (0.03-0.775) is banked.
#
# v25's mechanism prediction (what this run tests): p=0.25 sticky makes
# the env a POMDP; a feedforward net cannot detect that its action
# stuck; a minimal recurrent state restores closed-loop interruption
# and NARROWS the deterministic<->sticky gap. FAIL = gap unchanged.
#
# Known, accepted quirk: bc_epochs/bc_replay drive the GRU through its
# stateless fallback (zero hidden, warned once) — BC seeds behaviors,
# PPO trains the recurrence. Same fallback both would-be arms, so it
# cannot explain a between-arm difference.
#
name: Mario 1-1 backward GRU
reward_id: mario
rom_path: "roms/Super Mario Bros. (World).nes"
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
frame_skip: 4
# The tape's own root (see START STATE above). Eval with the SAME blob.
start_state_path: "runs/live_show/smb_4_4_micro/entrance_start.state"
description: >
  Reverse start-state curriculum on SMB 1-1 over the banked solver tape,
  Phase-A PPO recipe unchanged. Control experiment for the 1-2 run: the
  machinery must reproduce Phase-A's honest 1-1 number before its 1-2
  result means anything. Honest gate: cold greedy sticky-0.25 + jitter-16
  from the tape's entrance, 30 episodes, 2 seeds.

ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29

# Phase-A reward weights, verbatim (generic: progress + time + death +
# completion; no per-level checkpoint ladder, no air/jump/survival carrots).
reward_weights:
  forward_progress: 1.0
  time_penalty: -0.01
  death_penalty: -15.0
  completion_bonus: 50.0
  score_delta: 0.0
  air_bonus: 0.0
  survival_bonus: 0.0
  jump_clear_bonus: 0.0
  checkpoint_scale: 0.0

action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A

reinforce:
  # ---- Phase-A recipe, verbatim (mario_1_1_tile_gate_v2/profile.yaml) ----
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles_pos
  # ---- THE VARIABLE: policy class at matched budget ----
  recurrent: true
  tile_hidden_dim: 56
  tile_trunk_dim: 32
  preserve_elite_diversity: true
  freeze_pre_ppo_elite: true
  episodes_per_genome: 2
  symlog_rewards: true
  value_loss: huber
  value_coef: 0.25
  bc_epochs: 30
  warmup_gens_ga_only: 10
  steps: 10
  # THE ONE DEVIATION FROM PHASE-A (which took the 512 default). The iter
  # boundary calls reset_all, so every episode still running is truncated
  # and scores nothing. An attempt from rung tau therefore only resolves
  # if the tape's remaining tail — up to 903 steps at tau 0 — fits inside
  # one rollout. At 512 the cursor would stall around tau 391 with the
  # `[backward] REACHABILITY` warning in the log; 1024 covers the whole
  # tape. Costs ~2x samples/iter vs Phase-A.
  rollout_steps: 1024
  lr: 0.0003
  async_pipeline: false      # 1-step obs lag destroys frame-perfect SMB
  device: cpu
  panic_isolation: false
  entropy_coef: 0.005        # the consolidation fix: floor OFF, coef 0.005
  entropy_floor: 0.0
  entropy_coef_max: 0.05
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  sticky_action_prob: 0.25   # train under the protocol the gate measures
  # REQUIRED whenever sticky > 0 AND the backward block is on. Every rung
  # restart is an episode boundary, and this curriculum manufactures
  # hundreds of them per rollout. Without this the sticky roll on the
  # first step of a fresh attempt replays the action the previous life
  # died holding (~25% of restarts) — a stale held right+A+B at a mid-air
  # rung start kills the attempt before the policy acts, and that lands
  # directly in the success rate the advance gate consumes. The honest
  # eval harness gates its roll on step > 0 per episode
  # (scripts/eval_game.py); this is the knob that makes training agree.
  sticky_episode_boundary_reset: true
  bc_replay_enabled: true
  bc_replay_every_gens: 20
  bc_replay_epochs: 5
  bc_replay_max_buffer: 16
  bc_replay_train_window: 1
  preprocess_f16: false
  smb_curriculum: false      # required: the stage-0 inline restart path
  num_envs: 60

  # ---- the only new machinery ----
  # Reverse curriculum over checkpoints/backward_states/1-1 (903 states, one
  # per action step). tau starts at the last state (-1, right before the
  # flag) and walks back 40 tape steps whenever the trailing window at the
  # current rung holds >= 30 attempts at >= 20% success. Each episode draws
  # its restart uniformly from the 160-frame window ending at tau, with the
  # true entrance carrying one entry's worth of mass — so ~2% of episodes
  # start honestly all run long (that is the `entrance` column in the
  # `[backward]` log, and the early read on the gate), and at tau 0 the draw
  # IS the honest start distribution with no hand-off step.
  backward_curriculum:
    states_dir: "checkpoints/backward_states/1-1"
    tau_init: -1
    window_frames: 160
    advance_threshold: 0.2
    advance_actions: 40
    min_attempts: 30
    entrance_weight: 1.0
    # Truncated (boundary-cut) attempts are censored data — neither a
    # clear nor a death. Dropped by default, which keeps the rung rate an
    # honest "of the attempts that RESOLVED, how many cleared"; the
    # `truncated N` column in the log says how much is being censored.
    # Flip to true for the Salimans & Chen timeout convention.
    truncation_is_failure: false
    # pin_entrance: true freezes every restart at start_state_path and is
    # the zero-diff guard (with sticky 0 it draws no extra RNG, so a run
    # reproduces one without this block bit-for-bit). Never for a real run.
    pin_entrance: false

ga_params:
  mutation_rate: 0.8
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  stale_gens_before_restart: 50
  restart_fraction: 0.5

max_episode_steps: 2400
