name: "DuckTales (USA)"
# Live gameplay start-state (scripts/capture_start_state.py). The masher lands
# in THE AMAZON (level 0 — the default LAND SELECT cursor and the canonical
# speedrun opener). Verified: reaches Amazon gameplay (~frame 105); HUD shows
# $/TOTAL/HP-hearts/TIME and Scrooge is controllable.
#   python scripts/capture_start_state.py --game ducktales \
#       --rom "roms/DuckTales (USA).nes"
start_state_path: "roms/DuckTales (USA)_start.state.bin"
rom_hashes:
  - "34fd4014afd15b562d7100f641f900ab"  # DuckTales (USA), No-Intro

# Cartridge (iNES header): mapper 2 (UNROM), CHR-RAM, 128 KB PRG. Boots on the
# full-library-compat core and has a parity tape (tests/parity/mesen_tapes/),
# so emulation fidelity is not a concern.

# Action platformer with pogo-cane traversal — frame_skip 4 (NOT the trainer
# default 16, too coarse for pogo timing).
frame_skip: 4
max_episode_steps: 2000

description: >
  Training profile for DuckTales (NES, 1989, Capcom). Non-linear platformer:
  5 selectable levels (Amazon, Transylvania, African Mines, Himalayas, Moon)
  plus a final confrontation; pogo-cane movement; treasure/money collection is
  the objective. Trains single-stage from a THE AMAZON start state with the
  hand-authored DuckTalesReward in nes_core/src/rewards.rs. Reward = forward
  progress (screen-X nudge) + treasure/money (HUD digit field, capped) +
  damage/death penalty (HP hearts) + a DOMINANT level-clear bonus. The clear
  is detected as a single-step money jump >= win_treasure_value: each level
  boss guards a $1,000,000 main treasure claimed in one atomic pickup, while
  the largest gem is a $50,000 red diamond, so a jump this large can ONLY be a
  boss's main treasure = that level cleared; being per-step, gem farming can
  never fake it. episode_success is therefore a REAL level clear.

# Addresses verified empirically against THIS core (import nes_core; load the
# Amazon start state; drive; diff RAM; render HUD). See DuckTalesReward for the
# authoritative map — these are the reward inputs.
ram_mapping:
  player_x_screen: 0x0008   # VERIFIED-LIVE: screen-relative X; RIGHT++ LEFT--;
                            #   wraps on scroll (NOT a global world-X).
  player_hp:       0x00DD   # VERIFIED-LIVE: hit points = the HUD hearts (3 at
                            #   the Amazon start; equals the on-screen count).
  level_index:     0x00F6   # VERIFIED-LIVE: 0=Amazon 1=Transylvania 2=African
                            #   Mines 3=Himalayas 4=Moon; persists in gameplay.
  money_field:     0x0324   # VERIFIED-LIVE: 7 HUD money digit tiles $0324-$032A
                            #   (MSB first, blank=0x24). $0 -> $2000 ATOMICALLY
                            #   on a gem pickup. Max display $9,999,999.
  # Cross-sourced (Game Genie RAM codes), NOT used by the reward:
  #   0x007D post-hit i-frame/flashing timer (007D:FA) — also fires at screen
  #     boundaries live, so it is ambiguous and left unused.
  #   0x0075 star-effect invincibility flag (0075:01).
  # Rejected: lives (P.n HUD) — 0x01F9 flickers 0-4 every frame (noise); no
  #   stable address found. Death is handled via HP reaching 0 instead.

# DuckTalesReward keys (see build_reward). The level-clear bonus dwarfs every
# shaping term so the win milestone strictly dominates.
reward_weights:
  forward_progress:   0.01      # small rightward screen-X nudge (capped,
                                #   wrap-robust; non-linear game so weak)
  treasure_weight:    0.0005    # money delta, shaped delta capped at $50k
  level_clear_bonus:  2000.0    # DOMINANT win: boss main-treasure = clear
  damage_penalty:    -5.0       # per heart lost
  death_penalty:     -25.0      # HP reaches 0
  survival_weight:    0.01
  time_penalty:      -0.001
  win_treasure_value: 500000    # single-step $ jump marking a $1,000,000 main
                                #   treasure vs the $50k red diamond
  level_goal:         1         # levels to clear for episode_success

# Platformer + pogo action set. Pogo = A (jump) then DOWN+B airborne to bounce
# on the cane (core traversal + attack); B on ground swings the cane; UP climbs.
action_space:
  - []                      # NOOP
  - ["right"]
  - ["left"]
  - ["A"]                   # jump
  - ["B"]                   # cane swing / putt
  - ["down"]                # duck / pogo setup
  - ["up"]                  # climb rope/vine
  - ["right", "A"]          # jump-right
  - ["left", "A"]           # jump-left
  - ["down", "B"]           # POGO bounce (airborne) — key traversal move
  - ["right", "down", "B"]  # moving pogo

# Non-linear (5 levels selectable from LAND SELECT). Documentation only — this
# is NOT the SMB area-byte save-state curriculum (gated off for non-Mario).
# Single-stage PPO from the Amazon start; to train another level, capture a
# per-level start state (navigate LAND SELECT via 0x00F6) and swap start_state.
curriculum:
  amazon: ["*"]
  transylvania: ["*"]
  african_mines: ["*"]
  himalayas: ["*"]
  moon: ["*"]

reinforce:
  enabled: true
  # === UNIFIED vanilla_ppo (pixel-CNN path, same as Contra/MegaMan) ===
  # 4-stacked 84x84 grayscale -> Nature DQN CNN -> actor/critic. The agent
  # reads the SCREEN, so the reward RAM addresses drive the reward only, not
  # the observation. SMB area-byte curriculum gated off (non-Mario). RND drives
  # exploration (treasure is sparse until reached).
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02     # higher — exploration/sparse-treasure regime
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0

# Go-Explore solver adapter (bootstrap 2026-08-02). Every address below was
# (re)verified live from THIS core's Amazon start state via scripted + random
# rollouts only (no external maps) — receipt:
# runs/ducktales/dt_observables_receipt.json.
#
# CENTRAL DESIGN CHOICE — progress for a NON-LINEAR game.
# The natural objective is decoded MONEY ($0324-$032A, 7 HUD digit tiles,
# strictly monotone, == the win objective). But GenericGame.progress can only
# read `ram[lo] | ram[hi]<<8`, and money needs a 7-tile decode whose blanks are
# 0x24 (36) — pointing progress at two money-digit bytes is non-monotone
# (a blank 36 outranks a real leading digit), so money is NOT consumable as-is.
# Discovery also found NO clean 2-byte world/scroll signal: screen-X $0008 WRAPS
# every 256 px (verified: multiple forward/back wraps under a single hold-right),
# and no scroll-page / camera-X byte survives the fixed-cadence + noop-stability
# rejection ($0022/$0023 jitter with no monotone travel component; $0038/$0760
# are 2-3-value coarse flags, not page counters). This matches the level's
# non-linearity (pogo verticality, backtracking) — there is no monotone spatial
# frontier to consume.
# So progress = screen-X $0008 (a verified but LOCAL/wrapping signal — a weak
# domination score), and the archive is driven as a COVERAGE baseline: count
# selection (--sel-mode count) + a rich cell = (level_index, y-band, screen-X
# bucket). MONEY remains the true objective and the $1,000,000-single-step jump
# remains the true level-clear; both are the reward's signals (see
# DuckTalesReward) and belong in a FUTURE custom progress/is_clear hook (a
# GenericGame extension that can decode the 7-tile field), not in the 2-byte
# GenericGame path. level_key is left EMPTY (coverage baseline) accordingly.
solve:
  rom: "roms/DuckTales (USA).nes"
  # progress = DECODED MONEY (the objective), 7 HUD digit tiles $0324-$032A
  # MSB-first, blank tile 0x24 skipped, scaled /100 to fit progress_cap
  # (stage totals ~$1-2M -> 0-20000). Money is monotone and the real goal;
  # screen-X ($0008) wraps and DuckTales has no monotone spatial frontier
  # (verified: Scrooge sticks on the first obstacle under pure-right), so the
  # treasure odometer IS the frontier — banking higher-$ states pulls the
  # solver along treasure-rich paths, and the $1M boss-treasure single-step
  # jump (>= the largest $50k gem) reads as a huge progress spike = the clear.
  progress: {tiles: [0x0324, 0x0325, 0x0326, 0x0327, 0x0328, 0x0329, 0x032A], blank: 0x24, scale: 100}
  progress_cap: 25000
  # player Y ($0012). VERIFIED-LIVE: settles to 148 on the ground, traces a
  # smooth ballistic arc under a jump, and oscillates 65<->148 under the pogo
  # (down+B) — the ballistic/climb signature (range 135). ($0013 is a coarser
  # secondary vertical, range 80; $0016 is a jump-VELOCITY flag = 128 while
  # ascending / 0 otherwise, NOT a position — both rejected.) Drives the cell's
  # y-band, critical for a pogo game.
  y: 0x0012
  # Cell's FIRST coordinate = level_index ($00F6). VERIFIED-LIVE: 0=Amazon..
  # 4=Moon, constant within a level. Self-labels cells per level for a future
  # multi-level run; = 0 throughout this Amazon bootstrap.
  area: 0x00F6
  # Coverage baseline: no in-level stage counter advances on a REAL clear
  # (clearing the Amazon returns to LAND SELECT, unreachable under bootstrap
  # play — untested). The true clear is the boss main-treasure single-step
  # money jump >= $1,000,000 (see DuckTalesReward.win_treasure_value).
  level_key: []
  # WIN-CONDITION: score_jump on the decoded-money progress (now available —
  # see progress: above). Threshold 5000 = $500,000 in real money (progress
  # is scaled /100): comfortably above the largest ordinary gem (~$50k = 500
  # progress units, can never false-fire) and comfortably below the actual
  # $1,000,000 boss-treasure jump (10000 progress units), so it fires
  # unambiguously on the real clear with margin either side.
  clear: {mode: score_jump, threshold: 5000}
  # Death. HP hearts ($00DD). VERIFIED-LIVE: 3 at spawn; empirically BIMODAL
  # {3,0} in play (never observed dwelling at 1-2 across 60+ rollouts) and it
  # RESETS to 3 a few frames after death — so `lives<start_lives` (HP<3) fires
  # exactly at real death, not on a survived hit. No true lives byte exists
  # (documented: $01F9 flickers 0-4). player_state corroborates:
  lives: 0x00DD
  # $000E = 4 while alive (the ONLY value across all scripted stand/jump/pogo/
  # climb + every HP=3 sample), 0 on the death frame (11/11 deaths). A clean
  # semantic death flag; fires at the same instant HP hits 0.
  player_state: 0x000E
  death_states: [0]