  #          not confirmed, for Mega Man's 0x0410 in wave 4) — if this
  #          is not literally "remaining lives" a decrement could
  #          underflow toward 255. Not confirmed as a defect here; the
  #          smoke below did not stall, so left as-is.
  y: 0x009F
  lives: 0x0051
