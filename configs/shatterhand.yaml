description: |
  Shatterhand (NES, 1989, Natsume/Jaleco), onboarding profile
  (wave 5, 2026-08-25). Generic controller + generic cell key; no game
  knowledge encoded.

  START STATE: roms/Shatterhand (USA)_start.state.bin, minted this
  wave (runs/onboard_wave5/mint_shatterhand.json) via a START/A/DOWN
  pulse mash from cold boot. Liveness verified by input-divergence
  probe (RIGHT vs LEFT vs NOOP diverge 151/179 RAM bytes from a fresh
  reload after a settle window) AND by a rendered-frame visual check
  (runs/onboard_wave5/mint_shatterhand_{noop,right90,noop90}_frame.png):
  Stage 1 factory-rooftop gameplay is visible — lives HUD ("L-" hearts),
  score HUD, ladders, background cranes — with the player sprite
  visibly displaced/turned between the RIGHT-90 and NOOP-90 renders
  from the same state. Not a title/demo/menu screen.

frame_skip: 4

# A GENERIC controller. Tuned action sets encode another game's tactics.
action_space:
  - []
  - ["right"]
  - ["left"]
  - ["up"]
  - ["down"]
  - ["A"]
  - ["B"]
  - ["right", "A"]
  - ["right", "B"]
  - ["left", "A"]
  - ["left", "B"]
  - ["right", "A", "B"]
  - ["up", "A"]
  - ["down", "B"]

solve:
  no_clear_predicate: "no witnessed clear exists for this game, so no predicate can be validated; deliberately unminted per the 4-CONFIRMED/41-VOID roster adjudication (docs/research/CLEAR_GAP_CLOSURE_2026-08-26.md). `solutions: 0` here is a compile-time constant, never a search result."
  rom: "roms/Shatterhand (USA).nes"
  # Odometer gate (runs/onboard_wave5/gate_shatterhand_right.json):
  # --forward right, 1200 steps, axis x, range 0..245, 61 distinct,
  # oam_churn 1199/1199 (agent fully active) -> PASS, SIGNAL SOUND
  # (flat tail is a behaviour finding — game stops under naive
  # constant-RIGHT, not an instrument fault).
  progress: {source: odometer, axis: x}
  # y / lives discovered by scripts/discover_observables.py's own
  # 3-probe protocol against this exact start state, 2026-08-25. No RAM
  # map, no disassembly, no walkthrough.
  # Receipt: runs/onboard_wave5/discover_shatterhand.json
  #   No RAM progress candidate isolated by the probe (odometer already
  #   gated SOUND and is the preferred hardware surface, same reasoning
  #   as ninja_gaiden_ii/ducktales_2).
  #   $009F  y candidate — jump/ballistic signature (score 94.7 top hit).
  #   $0051  lives candidate (ORIGINAL, now REPLACED) — read 0 at this
  #          exact root state (confirmed 2026-08-26); the wave-5 CAVEAT
  #          above was the correct call. This was the zero-start-byte
  #          defect in discover_observables.py's lives_from_death_drives
  #          (both reaches_empty and spends_its_stock are structurally
  #          vacuous at start==0), fixed at the tool level in commit
  #          94e52b0. Re-running the fixed tool against this same start
  #          state demotes $0051 out of the top-5 ranked candidates
  #          entirely and nominates $0199 instead.
  #   $0199  lives candidate (2026-08-26, post-fix) — root value 2
  #          (verified > 0, not an underflow trap), starts_nonzero=true,
  #          5 of 5 probe agreement, reaches empty (arrived-at, not the
  #          start sample), spends its stock, refills 5/5 runs, does not
  #          move while idle. Independently reverified here: 80-step
  #          idle hold and a 700-step constant-RIGHT hold both leave it
  #          pinned at 2 (no free-run, no idle drift).
  #          Receipt: runs/false_death_fanout/shatterhand/
  #          discover_shatterhand_fixed.json
  #   go_explore_solve smoke (--workers 2 --minutes 1, same root state):
  #     before (lives=$0051): 16 cells, 23112 steps, 385 sps, frozen —
  #       reproduces wave 5's SOUND_GAME_STOPS stall exactly.
  #     after  (lives=$0199): 232 cells (14.5x), 175 still on the open
  #       frontier (not frozen), max_gx 53 -> 1023, 16462 steps, 274 sps.
  #       SOUND_GAME_STOPS -> SOUND_ADVANCING.
  # Receipts: runs/false_death_fanout/shatterhand/{discover_shatterhand_fixed,
  # smoke_before/archive.stats.json, smoke_after/archive.stats.json}.json
  y: 0x009F
  lives: 0x0199
  clear:
    # scene_cut DECLINED 2026-08-27, superseding the 2026-08-26 arming
    # (27902e1). Re-adjudicated by measurement, not judgement:
    # scripts/scene_cut_arming.py.
    # DEMONSTRATED FALSE POSITIVE: driven at its own armed gate (scene_min=5,
    # blank_min=1, kind=['fade']) over 4x6000 steps of mixed-random play that
    # cleared nothing, this gate fired 13 times. Every one is a false positive,
    # and every one survived the death veto.
    # THE GENERAL REASON, which applies to every profile in this cohort and not
    # only this one: the audit probe CLEARS NOTHING, so its entire observed
    # (d_scene, d_blank) distribution is null. A gate at or below that null
    # fires on ordinary play; a gate above it has no evidence it can ever fire.
    # An ARM needs a WITNESSED positive -- one blank run known to be a level
    # transition -- and no profile here has one. Same refusal, same reason, as
    # docs/receipts/rygar/clear_predicate_REFUTED.md.
    # The instrument is NOT the problem: odo_blank moves for 20 of the 25
    # cohort profiles and reads 55/55 transitions on Rygar's banked tape.
    # Re-arm by witnessing one transition on this profile, registering it in
    # scene_cut_arming.WITNESSED_TRANSITIONS, and re-running the audit.
    # Reproduce: .venv/bin/python scripts/scene_cut_arming.py --profile configs/shatterhand.yaml
    # Receipt:   docs/receipts/clear_control/scene_cut_arming_2026-08-27.json
    signals:
      scene_cut:
        enabled: false
        reason: >-
          DECLINED 2026-08-27 by scripts/scene_cut_arming.py. DEMONSTRATED
          FALSE POSITIVE: driven at its own armed gate (scene_min=5,
          blank_min=1, kind=['fade']) over 4x6000 steps of mixed-random play
          that cleared nothing, this gate fired 13 times. Every one is a false
          positive, and every one survived the death veto. An ARM requires a
          witnessed level transition to place a length floor against; this
          profile has none.

  # DELIBERATELY EMPTY — no clear captured yet; guessing a stage-advance
  # byte here is the authored-semantics class the purity line forbids.
  level_key: []
