description: |
  Blaster Master (NES, 1988), minimal onboarding profile. Written from
  MEASUREMENT ONLY — start state minted 2026-08-24 by menu experiment
  (START, START, A; receipt runs/onboard_wave2/mint_blaster_master_usa.json).
  Fresh-pool verification shows side-scrolling gameplay with the camera
  tracking the vehicle. Progress is the PPU scroll odometer, a hardware
  surface in the same purity class as pixels/OAM.

  ODOMETER GATE (2026-08-24 wave2, reconfirmed 2026-08-25 wave3):
  --forward right, 1200 steps, 126 distinct, range 0..636, oam_churn
  1080/1199 -> PASS "SIGNAL SOUND — game stops" (flat for the last
  quarter). --forward left/up/A/down are all inert from this start
  state (range 0, oam_churn <=18/1199 — camera static, agent inert):
  right is the only real forward driver here.
  Receipts: runs/onboard_wave3/gate_blaster_master_{right,left,up,A,down}.json

  ROOM-COUNTER DIAGNOSTIC (2026-08-25, scripts/discover_observables.py
  3-probe protocol, --forward right; receipt
  runs/onboard_wave3/observables_blaster_master.json): the odometer's
  flat tail is explained, not a stall. $0048|$0020<<8 (fine in-room X)
  is flagged CAMERA-CLAMP SATURATOR by the probe itself — it caps at
  the scroll-window limit and rebases at room transitions, which is
  exactly the shape an odometer integral hits after enough rooms.

  D4 CORRECTION (2026-08-26, docs/research/CLEAR_GAP_CLOSURE_2026-08-26.md
  §1c row 6 / §9.3): the paragraph above used to recommend $0020 itself
  as a "non-saturating room/screen counter" and wire it as `area:`. Both
  halves of that claim are wrong, and both were reproduced live this
  pass. First, $0020 IS the high byte of the exact same $0048|$0020<<8
  pair the probe already flagged as a camera-clamp saturator one
  paragraph up — it is not an independent room identity, it is the
  same saturating position reading read alone. Second, it saturates:
  holding right from this start state runs it 32 -> 244 over ~1,480
  steps and then flat for the remaining 500+ (reproduced directly,
  2026-08-26), the same camera-clamp shape as its own pair, not a
  discrete counter that keeps advancing across rooms. The
  `observables_blaster_master.json` receipt's own room_counters entry
  even labels it `"role": "progress_page_as_screen_counter"` — a
  fallback synthesized FROM the saturating pair, not a second
  discovered signal, and the profile below never should have promoted
  it to `area:`. No independently-discovered non-saturating room
  counter exists for this game; `area:` is removed rather than
  replaced with another guess.

  SOLVER SMOKE (2026-08-25, 2 workers / 4 min / seed 0, machine under
  parallel-onboarding contention — throughput ~250-275 sps rather than
  the ~500+ sps seen on an idle core; not a game finding):
  cells 2855->4557->6745->9287 across the four 1-min windows,
  max_gx_in_max_area 478->479->735->1244, stall_flat_windows 0
  throughout, 6189 improvements / 55030 records, 0 solutions (expected;
  level_key is the empty coverage baseline — a constant, not a search
  outcome; annotated 2026-08-26).
  max_area pegged at 255 from minute 1 on — the single-byte room
  counter's ceiling, not a stall (gx inside area=255 kept climbing the
  whole run; note for future work if this game needs >255 rooms
  tracked, area would need widening). Verdict: SOUND_ADVANCING — cells
  and gx still climbing with zero flat windows at cutoff.
  Receipts: runs/onboard_wave3/smoke_blaster_master/
  (archive.stats.json, progress.jsonl).

  D4 ARCHIVE-SIZE CORRECTION (2026-08-26): the removed $0020 dimension
  inflated this archive. Loading the banked runs/onboard_wave3/
  smoke_blaster_master/archive.pkl and collapsing its cell keys' area
  component to the constant this profile now produces (no `area:` ->
  `GenericGame.area()` returns 0) leaves 1,129 distinct cells from the
  SAME rollout data that was banked as 9,287 — an 8.2x inflation, not a
  new run. $0020 spans its full byte range (256 distinct values used as
  a key dimension, 0..255) essentially in lockstep with gx (1,538
  distinct (area, gx) pairs against only 89 distinct gx buckets alone),
  which is exactly what "the same saturating position read twice"
  produces: every fine step of travel mints a new (area, gx) pair
  instead of folding many gx values into one real room. 9,287 was
  never a measure of Blaster Master's explored area; ~1,129 is what
  this rollout actually covers.

