name: "Super Mario Bros."
reward_id: mario
rom_hashes:
  - "811b027eaf99c2def7b933c5208636de"

# Canonical SMB profile — yumouwei/super-mario-bros-reinforcement-learning
# (RAM grid + Pure PPO, clears 1-1 in 10M steps) reproduced on our stack.
#
# Differences vs. mario_tiles.yaml (our experimental shaped-reward profile):
#
# * frame_stack=4 on tile features (yumouwei: stack=1 fails, stack>=2
#   succeeds — this is THE empirical fix for sparse temporal context
#   in RAM observations).
# * Canonical reward only: forward velocity + completion bonus +
#   death penalty, clipped tight. No survival bonus, no jump_clear,
#   no per-x checkpoints. Matches gym-super-mario-bros's `r = v+c+d`.
# * GA-only warmup short (so PPO takes over fast). We keep the
#   GA+PPO trainer for now — to be replaced with pure PPO in a
#   follow-up — but the reward shape and frame stacking align with
#   what yumouwei proved works.
#
# The point of this profile is to produce a known-baseline number
# that matches the literature, before we add any project-specific
# shaping. If THIS profile can't clear 1-1, we have an
# implementation bug, not a tuning problem.

description: >
  Canonical SMB-PPO recipe: tile-feature MLP, frame_stack=4,
  forward+completion+death reward. Baseline for "does our trainer
  match yumouwei's published result". Don't tune the reward
  weights; they're chosen to match the published gym-super-mario-
  bros reward exactly.

frame_skip: 4
max_episode_steps: 1200

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E

reinforce:
  encoder: smb_tiles
  # 4-frame stack on the 175-dim tile feature vector. With stack=1
  # the agent has no temporal context (vel_x is the only first-
  # derivative signal); with stack=4 the policy implicitly learns
  # action timing for jumps and enemy avoidance. yumouwei (2022)
  # empirically proves stack=1 fails to clear 1-1, stack=4 succeeds.
  tile_frame_stack: 4
  # Pure PPO — no GA mutation/crossover. All workers run the same
  # policy each generation; PPO is the only source of weight change.
  # Matches the canonical uvipen/yumouwei recipe exactly.
  #
  # `preserve_elite_diversity` and `freeze_pre_ppo_elite` are GA
  # safety nets and have no effect here: evolve() clones the
  # post-PPO elite into every slot every gen, so both the diversity
  # spread and the parked snapshot get wiped before they're ever
  # consulted. The trainer warns and disables both if they're set
  # alongside trainer_mode=pure_ppo.
  trainer_mode: pure_ppo
  # GA-only warmup: skipped in pure_ppo mode (the "GA" is a no-op
  # broadcast layer there) — PPO starts updating from gen 0.
  warmup_gens_ga_only: 0
  # BC anchor (2026-05-12). The canonical recipe finds 1-1 clears
  # ~4× faster than the shaped-reward profile, but loses them within
  # 5-10 gens to PPO drift (single clear at gen 33, then 100 gens
  # with no further clears). BC replay captures successful trajectories
  # and re-trains a fresh policy on the latest 3 — in pure_ppo mode
  # the BC-trained genome enters the sort with its train-set's mean
  # fitness; if that beats the post-PPO elite, evolve() broadcasts
  # the BC policy to the whole population. Mechanism is "lock in
  # any clear we find" rather than "let PPO drift away from it."
  bc_replay_enabled: true
  bc_replay_every_gens: 20
  bc_replay_epochs: 5
  bc_replay_max_buffer: 16
  # 1 (not 3) so BC trains on a single coherent successful trajectory.
  # Earlier reasoning was "3 recent gives a less-noisy anchor"; that
  # works if all 3 come from similar policies, but in practice the
  # window aggregates clears from different gens with different
  # action timings around the same states (e.g. one jumped at frame
  # 100, another at frame 105 over the same pit). Cross-entropy on
  # contradictory labels forces the network to split the difference
  # → uniform-ish output → BC anchor is no anchor. Single trajectory
  # gives the network exactly one set of (state, action) labels per
  # state, which it CAN actually fit.
  bc_replay_train_window: 1
  # BC demo seed: DISABLED 2026-05-12 late evening. Tested with 5
  # demos (TAS speedrun + multiple route variants), aligned state-
  # action pairing, 30 epochs of pretrain. Result was catastrophic:
  # gen 0 fitness range -15 to +11 (vs ~500-1500 from cold-random
  # init). Diagnosis: TAS demos are too frame-perfect — the BC
  # network memorized demo-specific (state, action) mappings, and
  # any timing drift at runtime (stochastic sampling + sticky off
  # = jitter) turns a learned jump into a faceplant in the first
  # pit. Multi-demo aggregation also produced state-distribution
  # mismatch (BIG/FIRE Mario states in demos vs small-Mario start
  # in training). Conclusion: BC from TAS-style demos is the wrong
  # tool for cold-start priors on this MLP. Cold random is faster
  # and more reliable. Keeping bc_replay_* knobs so any clears that
  # PPO finds organically still anchor through the buffer.

# Canonical reward — gym-super-mario-bros default `r = v + c + d`.
# All weights kept small and clipped so no single component
# dominates the value function (the most common shaping mistake).
reward_weights:
  # Forward velocity per frame. Maps to canonical `v` in gym-
  # super-mario-bros. Per-frame velocity ~3-15 NES units, so the
  # weight scales to roughly the (-15, 15) clip range yumouwei
  # uses.
  forward_progress: 1.0
  # Score-delta scaled to canonical `score/40` weighting.
  score_delta: 0.025
  # Death = canonical `d = -15`.
  death_penalty: -15.0
  # Completion = canonical `+50` (effective +5 after gym's /10
  # post-clip scaling, but we don't apply the /10).
  completion_bonus: 50.0
  # No time_penalty: yumouwei uses gym's clock delta which is
  # implicitly negative when the in-game timer ticks down. We
  # don't read the game clock, so 0 is correct (timeout is
  # already penalized via forfeited completion bonus).
  time_penalty: 0.0
  # No dense checkpoints — explicit decision. The point of the
  # canonical baseline is to prove the training stack works on a
  # plain reward; shaping is a separate dimension.
  checkpoint_scale: 0.0
  # No jump-clear or survival bonus on the canonical baseline.
  # Both are ablations to test on top of this profile, not part
  # of it.
  jump_clear_bonus: 0.0
  survival_bonus: 0.0
  air_bonus: 0.0
  pit_fall_extra: 0.0
  enemy_death_extra: 0.0

action_space:
  # SIMPLE_MOVEMENT (Kauten gym-super-mario-bros canonical 7-action
  # set). yumouwei uses this. We previously experimented with 6
  # actions (dropped left and left+A) — that's an ablation, not the
  # canonical. Format mirrors mario_tiles.yaml: each action is a
  # list of button names (or empty list for NOOP).
  - []                      # NOOP
  - ["right"]
  - ["right", "A"]
  - ["right", "B"]
  - ["right", "A", "B"]
  - ["A"]
  - ["left"]

curriculum:
  stages:
    - name: stage_1
      levels: ["1-1"]
      advance_threshold: 0.5
      min_episodes: 200
