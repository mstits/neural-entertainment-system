# DIAGNOSTIC: is 1-2 (underground) solvable SOLO by the proven Phase-A recipe?
#
# Across 4 multi-level runs, 1-2 NEVER cleared cold (0.0 every probe) despite
# ~50% of samples / ~750 iters-equivalent — while Phase-A solved 1-1 solo in
# ~130 iters with this exact recipe+net. This isolates whether 1-2 is an
# INTERFERENCE victim (clears solo, breaks when combined) or simply an
# UNSOLVED level (doesn't clear even solo) — which determines the whole next
# strategy (combine-after-solo vs exploration-help vs reconsider approach).
#
# Setup = the EXACT Phase-A #2 recipe (default small net 64/32, floor 0.0)
# pointed at the 1-2 entrance. Single-level via the PLR path: 1-2 is the
# cold-boot level (state: null) and start_state_path is the 1-2 entrance, so
# reset_all + cold probe both run from 1-2's start.

name: Mario 1-2 solo diagnostic (tile)
rom_path: "roms/Super Mario Bros. (World).nes"
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
frame_skip: 4
# 1-2 entrance (x=0), verified. Cold boot + cold probe both start here.
start_state_path: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_03.state"
description: >
  Single-level diagnostic: can the proven single-level recipe clear 1-2 from
  its entrance under the honest sticky+jitter protocol? Disambiguates the
  multi-level wall (interference vs unsolved level).

ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29

reward_weights:
  forward_progress: 1.0
  time_penalty: -0.01
  death_penalty: -15.0
  completion_bonus: 50.0
  score_delta: 0.0
  air_bonus: 0.0
  survival_bonus: 0.0
  jump_clear_bonus: 0.0
  checkpoint_scale: 0.0

action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A

# Single training level = 1-2, as the cold-boot level (uses start_state_path).
plr_levels:
  - level: "1-2"
    state: null

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles_pos
  preserve_elite_diversity: true
  freeze_pre_ppo_elite: true
  episodes_per_genome: 2
  symlog_rewards: true
  value_loss: huber
  value_coef: 0.25
  bc_epochs: 0
  warmup_gens_ga_only: 10
  steps: 10
  lr: 0.0003
  async_pipeline: false
  device: cpu
  panic_isolation: false
  entropy_coef: 0.005
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  sticky_action_prob: 0.25
  bc_replay_enabled: false
  preprocess_f16: false
  smb_curriculum: false
  plr_enabled: true
  entropy_floor: 0.0
  entropy_coef_max: 0.05
  num_envs: 60

ga_params:
  mutation_rate: 0.8
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  stale_gens_before_restart: 50
  restart_fraction: 0.5

max_episode_steps: 2400
