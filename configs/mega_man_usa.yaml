name: "Mega Man (USA)"
reward_id: mega_man

rom_path: "roms/Mega Man (USA).nes"
rom_hashes:
  - "4d4ffdfe7979b5f06dec2cf3563440ad"
start_state_path: "roms/Mega Man (USA)_start.state.bin"

description: |
  Mega Man (NES, 1987), onboarding profile (wave 4, 2026-08-25). This is
  the ORIGINAL Mega Man 1 ROM (distinct from configs/megaman.yaml, which
  is Mega Man 2 — DEFAULT_ROMS maps the bare "megaman"/"mega_man" game
  key to MM2, so this profile carries its own explicit rom_path/name).
  Structure copied from configs/paperboy.yaml; no game knowledge encoded
  — generic controller, odometer progress source.

  Start state: roms/Mega Man (USA)_start.state.bin, minted this session
  by scripts/capture_start_state.py's generic title/menu masher (no
  game-specific navigation script needed — MM1's title -> stage-select
  -> A confirms a highlighted stage flow falls out of the masher's
  START/START/A/START pulse cycle). Gameplay confirmed at frame 735
  (+40 settle). Liveness verified by input-divergence probe from a
  fresh pool: right_vs_left_120f=169, right_vs_noop_120f=162,
  left_vs_noop_120f=85 RAM bytes (2KB range) — directional input moves
  the player and RIGHT/LEFT diverge from each other, so this is live
  gameplay, not a demo/menu. Receipt:
  runs/onboard_wave4/mint_mega_man_usa.json.

frame_skip: 4

# A GENERIC controller. Tuned action sets encode another game's tactics.
action_space:
  - []
  - ["right"]
  - ["left"]
  - ["up"]
  - ["down"]
  - ["A"]
  - ["B"]
  - ["right", "A"]
  - ["right", "B"]
  - ["left", "A"]
  - ["left", "B"]
  - ["right", "A", "B"]
  - ["down", "B"]
  - ["up", "B"]

solve:
  no_clear_predicate: "no witnessed clear exists for this game, so no predicate can be validated; deliberately unminted per the 4-CONFIRMED/41-VOID roster adjudication (docs/research/CLEAR_GAP_CLOSURE_2026-08-26.md). `solutions: 0` here is a compile-time constant, never a search result."
  rom: "roms/Mega Man (USA).nes"
  # Odometer gate (runs/onboard_wave4/gate_mega_man_usa_right.json):
  # --forward right, 1200 steps, 51 distinct, range 0..72, oam_churn
  # 1080/1199 -> PASS "SIGNAL SOUND — still advancing". No RAM-derived
  # progress byte was isolated by discover_observables.py (room counter:
  # none, progress candidates: none), so the odometer is the only
  # forward-progress signal and drives the search.
  progress: {source: odometer, axis: x}
  # y / lives from scripts/discover_observables.py's 3-probe protocol
  # against this exact start state (receipt
  # runs/onboard_wave4/discover_mega_man_usa.json). No RAM map, no
  # disassembly, no walkthrough.
  #   $00F4  y candidate (jump/ballistic signature), sole candidate found.
  #
  # SUPERSEDED (2026-08-25, same-day follow-up): $0410 was the original
  # lives candidate (5/5 probe agreement) but read 0 at this exact root
  # state — confirmed independently by a raw RAM peek of the minted
  # state file, not just the tool's own recorded value. Traced live: the
  # byte flips 0 -> 255 within the first ~15-40 steps of ANY rollout
  # (tied to movement starting, not a death — RAM churn at the
  # transition is far below the level-reload threshold), and
  # GenericGame.is_dead()'s wrap-aware check reads that 0->255 flip as a
  # death (delta=1, inside the 1..8 band). This false-death fired within
  # the first couple dozen frames of nearly every rollout, which fully
  # explains onboarding wave 4's frozen ~10-cell frontier
  # (runs/onboard_wave4/summary_mega_man_usa.json) independent of any
  # other wall. Root cause traced to discover_observables.py's
  # lives_from_death_drives(): its reaches_empty check is trivially
  # satisfied whenever a candidate's own start value is already 0,
  # which let this spurious byte outrank a real candidate the SAME
  # probe pass had already seen (buried because find_hp_lives() only
  # falls back to hp_candidates when lives_candidates is empty, and it
  # wasn't empty — just wrong). Re-running the same tool with a longer
  # death-probe budget (700->2200 steps, no new mechanism, no hand-
  # authored knowledge) correctly nominates $00A6: start=2, 5/5
  # agreement, spends its stock 15 times over the longer window, steps
  # 2->1->0->255 (wraps only on the actual 4th/final death) — the safe
  # shape this class of bug is supposed to look like. A causal A/B test
  # (identical go_explore_solve smoke, only this line changed) confirmed
  # a real improvement: root-state lives read corrected 0->2, frontier
  # 1->16 cells (was 1->10), max_gx_in_max_area 24px (was 16px). This
  # does NOT fully unblock the frontier — a residual, still-unexplained
  # stall remains past 16 cells, most likely a genuine early skill/
  # action-space wall (same family as this wave's Super C finding) —
  # so do not read $00A6 as "solved," only as "the false-death
  # instrument bug is fixed." Separately flagged: lives_from_death_
  # drives' start==0 trivial-empty-credit gap is a general tool defect,
  # not fixed here (would need a dedicated pass across every other
  # onboarded profile to check for the same silent failure mode).
  y: 0x00F4
  lives: 0x00A6
  clear:
    # scene_cut DECLINED 2026-08-27, superseding the 2026-08-26 arming
    # (27902e1). Re-adjudicated by measurement, not judgement:
    # scripts/scene_cut_arming.py.
    # DEMONSTRATED FALSE POSITIVE: driven at its own armed gate (scene_min=1,
    # blank_min=1, kind=['pan', 'warp', 'fade']) over 4x6000 steps of
    # mixed-random play that cleared nothing, this gate fired 12 times. Every
    # one is a false positive, and every one survived the death veto.
    # THE GENERAL REASON, which applies to every profile in this cohort and not
    # only this one: the audit probe CLEARS NOTHING, so its entire observed
    # (d_scene, d_blank) distribution is null. A gate at or below that null
    # fires on ordinary play; a gate above it has no evidence it can ever fire.
    # An ARM needs a WITNESSED positive -- one blank run known to be a level
    # transition -- and no profile here has one. Same refusal, same reason, as
    # docs/receipts/rygar/clear_predicate_REFUTED.md.
    # The instrument is NOT the problem: odo_blank moves for 20 of the 25
    # cohort profiles and reads 55/55 transitions on Rygar's banked tape.
    # Re-arm by witnessing one transition on this profile, registering it in
    # scene_cut_arming.WITNESSED_TRANSITIONS, and re-running the audit.
    # Reproduce: .venv/bin/python scripts/scene_cut_arming.py --profile configs/mega_man_usa.yaml
    # Receipt:   docs/receipts/clear_control/scene_cut_arming_2026-08-27.json
    signals:
      scene_cut:
        enabled: false
        reason: >-
          DECLINED 2026-08-27 by scripts/scene_cut_arming.py. DEMONSTRATED
          FALSE POSITIVE: driven at its own armed gate (scene_min=1,
          blank_min=1, kind=['pan', 'warp', 'fade']) over 4x6000 steps of
          mixed-random play that cleared nothing, this gate fired 12 times.
          Every one is a false positive, and every one survived the death veto.
          An ARM requires a witnessed level transition to place a length floor
          against; this profile has none.

  level_key: []   # coverage baseline; no stage/room-advance byte captured yet
