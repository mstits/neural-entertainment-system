name: "Ghosts'n Goblins"
reward_id: ghosts
# Live Stage-1 (graveyard) gameplay state. WITHOUT it the emulator
# cold-boots to the title screen, whose attract-mode demo auto-plays and
# ignores controller input — training there gives zero learning signal
# (the start-state-demo bug). Capture recipe is at the bottom of this file.
start_state_path: "roms/Ghosts'n Goblins (USA)_start.state.bin"
rom_hashes:
  - "6dd3872fff67b4f324a740aa87ac2b93"  # Ghosts'n Goblins (USA), mapper 2 (UNROM)

# Precise action platformer (frame-perfect jumps + projectile timing).
# frame_skip 4 like Contra/Castlevania/Mega Man, NOT the trainer default 16.
frame_skip: 4
max_episode_steps: 2000

description: >
  Bespoke GhostsReward (build_reward substring "ghosts"). Brutal side-
  scrolling action platformer: Arthur runs right, jumps (A), and throws
  weapons (B) through a graveyard (Stage 1). Two-hit armor (armored ->
  underwear -> dead), instant-death pits/water, a stage timer, and lives.
  Reward: dense backtrack-safe forward progress + survival, a one-shot
  penalty on armor loss, a death penalty that ends the episode, and a large
  terminal stage-clear bonus that dominates everything. episode_success is a
  REAL stage clear only (never total>0).

# ---------------------------------------------------------------------------
# RAM MAP (empirically probed LIVE on this ROM via the shipped Stage-1 state;
# HUD/sprite/PLAYER-1-READY screenshots used as ground truth).
# ---------------------------------------------------------------------------
ram_mapping:
  # VERIFIED-LIVE — Player-1 lives. Start state = 2; -1 per death (2->1).
  # Cross-sourced: GnG Game Genie infinite-lives-P1 targets $0715 (P2 $0716).
  lives:            0x0715
  # VERIFIED-LIVE — game/player mode: 0x08 = active gameplay; 0x0A = title /
  # death sequence / menu / attract non-play. Hard "really playing" gate.
  mode:             0x0028
  # VERIFIED-LIVE — armor flag: 1 = armored, 0 = underwear. Flips 1->0 at the
  # exact frame Arthur's sprite goes silver->red on his first hit; stays 0.
  armor_flag:       0x0585
  # VERIFIED-LIVE (direction) — horizontal world/camera x, signed 16-bit LE.
  # LEFT at spawn -> 0xFFF8 (-8); RIGHT increases it; ~0 at stage start. Its
  # per-stage scale/reset is UNVERIFIED (the opening cannot be traversed under
  # scripted play), so the win thresholds below are conservative + tunable.
  scroll_x_lo:      0x005D
  scroll_x_hi:      0x005E
  # UNVERIFIED / not located: a stage/area index byte (would let the direct
  # Path-A win fire). The GnG opening is so hard that neither scripted play
  # nor the game's own attract demo can reach a 1-A->1-B / Stage-1->2
  # transition to diff-identify one. Leave stage_addr=0 until a real stage
  # transition is reachable, then set + verify it.
  # NOT a clean CPU-RAM byte: score (HUD tile buffer; +100/kill on screen but
  # no single BCD byte) -> score/kill shaping is off by default (score_addr=0).

# ---------------------------------------------------------------------------
# REWARD WEIGHTS — consumed by the bespoke GhostsReward.
# ---------------------------------------------------------------------------
reward_weights:
  forward_progress:    0.05     # per NEW furthest world-x unit (backtrack-safe)
  kill_weight:         0.05     # inert unless score_addr set (positive deltas)
  armor_hit_penalty:  -8.0      # one-shot: armored(1) -> underwear(0)
  death_penalty:     -25.0      # first life lost; ends the episode
  stage_cleared:     500.0      # TERMINAL win bonus — dominates all shaping
  survival_weight:     0.01     # per-step alive bonus
  time_penalty:       -0.005    # nudge against stalling
  # Path-B "area reload" win (verified-address-only): reach deep world-x then
  # see it collapse to ~0 while alive & in play. clear_min_progress MUST be
  # tuned to a real Stage-1 length once a transition is reachable; kept well
  # above spawn noise so it can NEVER false-fire. Set very high to disable.
  clear_min_progress:  1500
  reset_threshold:     200
  # 0 = optional verified-stage-byte win path DISABLED (Path A). Set to a
  # verified stage index address to enable the cleaner direct clear signal.
  stage_addr:          0
  # 0 = score/kill shaping DISABLED (no clean score byte isolated on this ROM).
  score_addr:          0

# GnG controls: A = JUMP, B = THROW weapon (verified). NO start/select
# (START pauses the game).
action_space:
  - []                     # noop
  - ["right"]
  - ["left"]
  - ["A"]                  # jump
  - ["B"]                  # throw
  - ["right", "B"]         # advance + throw
  - ["right", "A"]         # running jump
  - ["right", "A", "B"]    # running jump + throw
  - ["down"]               # crouch (throw low / dodge)
  - ["down", "B"]          # crouch-throw
  - ["up"]                 # ladders (Stage 2+)

curriculum:
  stage_1: ["*"]
  stage_2: ["*"]

reinforce:
  enabled: true
  # UNIFIED vanilla_ppo (pixel-CNN path, same as Contra/Castlevania). No RAM
  # tile decoder for GnG -> universal pixel encoder: 4-stacked 84x84 grayscale
  # -> Nature DQN CNN -> actor/critic. RND drives exploration (GnG is a
  # sparse-reward, punishing hard-exploration regime).
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02        # sparse rewards -> keep exploration up (like Contra)
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0

# ===========================================================================
# Go-Explore solver adapter (discovery pass, bootstrap sweep). Every address
# below was found and verified from THIS core's own scripted + random
# rollouts (no external RAM maps/disassembly) — full receipt with the
# confirming tests: runs/ghosts_n_goblins/ghosts_n_goblins_receipt.json.
#
# THE HARD PART: the captured start state drops Arthur directly next to an
# already-active zombie (frame-0 screenshot confirms this), so EVERY scripted
# hold (right/left/noop/B-mash) dies at almost the same step (~70-130) near
# spawn, and the pre-existing scroll_x_lo/hi (0x005D/0x005E) turned out to be
# a red herring: reload-to-a-high-scroll-state + a single NOOP step collapses
# it back to -8/0 EVERY time (tested from 3 independent ~250-scroll snapshots,
# 420+ death-restarts total), and inside a full-2KB scan of a real, visually-
# confirmed 270-step forward run (mountains progressively leave frame — see
# receipt) it shows net=0, mono=0.52 — indistinguishable from noise. It is
# NOT Arthur's position; rejected outright.
#
# The full-2KB scan also turned up a graveyard of GAMEPLAY-LOCKED-WRAP-test
# **false positives**: 0x0083/0x0608 climb at the IDENTICAL ~1.3/step rate
# under NOOP, RIGHT, AND LEFT (byte-for-byte identical sequences over 34-128
# step windows) — textbook free-running frame clocks, the exact MM2-$001C
# trap. 0x06C2/0x05C0 SATURATE around 224-250 (the Kirby camera-clamp
# signature) and also failed direction-independence. 0x0440/0x0448/0x0458/
# 0x0460/0x0136/0x04F1/0x0523 are one-shot combat/collision EVENT FLAGS (a
# single 204->0-style transition mid-probe, not a continuous track). All
# rejected; DO NOT reuse them.
#
# THE WINNER: action-conditioned delta correlation (mean per-step RAM delta
# split by whether the taken action contained "right"/"left"/neither) across
# 243 independent death-restarted rollouts surfaced 0x003D/0x0064/0x006C as
# near-mirror bytes whose delta is reliably +ve under "right", ~0 under
# "left" (Arthur is already pinned at the stage-1 left boundary — there is
# nowhere further left to go, so this is a boundary clamp, not a rejection),
# and exactly 0 under pure NOOP over a 70-130 step window. The dense
# (per-step, not just checkpoint) trace of 0x006C shows a real walking
# signature: smooth ~1-3/step climbs, believable knockback dips, and a CLEAN
# 254->1 wrap. Cross-validating the wrap against the full 2KB across 243
# segments (28 independent wrap events), 0x0065 increments by exactly +1 in
# ALL 28/28 — a perfect lo/hi pair. The longest captured single life (271
# steps) crosses TWO such wraps without capping (hi reaches a sustained 2),
# passing the saturation test where 0x05C0-style bytes failed it.
# progress_cap guards a receipted one-frame RAM-reuse glitch: 0x0065 spikes
# to 255 for exactly one frame during the first-hit/invincibility-init
# routine (~step 20, coincides with the armor-loss frame) before instantly
# reverting to 0 — harmless in isolation but would read as a huge bogus
# progress value for that single frame if uncapped.
solve:
  rom: "roms/Ghosts'n Goblins (USA).nes"
  # 2026-08-24 (odometer-era onboarding): progress moved to the PPU scroll
  # odometer — the hardware-surface signal (same purity class as pixels/OAM,
  # same switch Rygar/NG made). Gate receipt:
  # runs/onboard_wave1/gate_ghosts_n_goblins.json — SIGNAL SOUND, 1200-step
  # forward-hold probe: axis=x, 117 distinct, range 0..285 px, high byte
  # present, oam_churn 434/1199; tail flat because the scripted forward hold
  # dies to the spawn-adjacent zombie (see START-STATE notes below), not
  # because the instrument saturates.
  # The previously-discovered RAM pair (progress = ram[0x006C] | ram[0x0065]
  # <<8, hampel-smoothed, cap 8000 for the one-frame armor-init spike) stays
  # documented above as the historical bootstrap-probe result; the odometer
  # supersedes it as the solver's progress axis.
  #
  # SMOKE RECEIPTS (2026-08-24, 3 workers x 6 min each):
  #   seed 0: 2081 cells, max_gx 2605, max_area 0
  #           (runs/onboard_wave1/smoke_ghosts_n_goblins/)
  #   seed 1: 4046 cells, max_gx 3327, max_area 0
  #           (runs/onboard_wave1/smoke_ghosts_n_goblins_seed1/)
  # Seed 0's last-3-window freeze at gx 2605 was diagnosed with the
  # deepest-cell probe (runs/onboard_wave1/diag_deepest_ghosts_n_goblins
  # .json): ALL 11 action holds from that cell produce byte-identical
  # trajectories (x 2605->2717, lives 2->1 at step 15, armor byte 10->0,
  # zero scene cuts) — inputs are locked, so the banked state was already
  # inside the hit/death animation (the fatal hit latched BEFORE banking;
  # the lives byte lags). Classic TRAP-CELL, not a door-blip/underflow/
  # scene-cut (no config fix applies; the engine's retire-on-instant-death
  # rule uses died<=5 burst steps and this one dies at 15, so the search
  # must route around it from shallower cells — which seed 1 proves it
  # does, passing 2605 by +722 px). Verdict: SOUND_ADVANCING; scene keys
  # NOT warranted (continuously-scrolling game, scene counter flat).
  progress: {source: odometer, axis: x}
  # No clean ballistic Y was isolable from the pinned spawn (the same
  # zombie-lock that killed the X probes also meant every "hold A" burst
  # coincided with an involuntary knockback-into-air from the adjacent
  # zombie, so NOOP vs JUMP looked identical for most zero-page candidates).
  # 0x021B is the best-available height proxy: differential probing (jump
  # vs matched noop from an identical save-state) shows it diverges sharply
  # and it has a wide (0-255), bounded, rise-then-fall ballistic envelope —
  # consistent with real airborne state (jump OR knockback-launch; GnG's
  # physics engine plausibly reuses one Y variable for both). Not verified
  # NOOP-flat in isolation from a genuinely safe (non-combat) stance because
  # none was reachable in this ROM's opening; treat as provisional.
  y: 0x021B
  # Coverage baseline: no stage/area-advance byte is reachable from bootstrap
  # play (GnG's opening is too hard for scripted or random play to reach a
  # 1-A->1-B transition to diff-identify one against). GnG is a continuously-
  # scrolling side-scroller (confirmed via the mountain-parallax ladder in
  # the receipt), not room-based, so no `area` counter is structurally
  # needed the way Kirby/Zelda need one.
  level_key: []
  # NOT wired (2026-08-06): considered clear: {mode: confluence} (the
  # generic detector used for Contra) but did not ship it here. Direct
  # replay testing of the SAME wiring on 3 other secondary games (Gradius,
  # Double Dragon, Kirby) found it CONFIRMED UNSAFE in each case — fires on
  # a real death (Gradius), a combat RAM blip (Double Dragon), or an
  # ordinary room transition (Kirby) — before a single false-positive-free
  # case was found. A short smoke run here didn't happen to trigger it,
  # but "didn't fire yet" isn't evidence of safety given that pattern, and
  # GnG is combat-heavy like Double Dragon. Revisit once the detector has
  # a lives-drop veto or a per-game validated config, not before.
  # VERIFIED-LIVE — decrements 2->1 reliably at death across dozens of
  # independent trials (noop/right/left holds and hundreds of random-walk
  # restarts). Primary (and sole) death signal; no player_state byte was
  # isolated cleanly enough to add (mode $0028 conflates death/title/menu).
  lives: 0x0715
  clear:
    # Odometer-cohort scene_cut wiring, 2026-08-26 (Finding 1: odo_blank is a
    # real transition counter). Eligibility only -- no `mode` is set here, so
    # is_clear()/solutions is byte-identical to before this block existed;
    # this only moves scene_cut from DEAD to ALIVE in clear_reachability's
    # quorum table. Measured, not guessed -- full survey + per-profile numbers:
    # docs/receipts/clear_control/odometer_cohort_scene_cut_survey_2026-08-26.json
    # odo_blank fired (58 runs) and odometer_scene stayed clean (0 runs) over the
    # same budget -- architectural floor gate (scene_min=blank_min=1) is the
    # smallest integer above a null that measures zero by construction (neither
    # counter can move without an actual re-anchor event). SURVEY CAVEAT: every
    # blank run observed in the survey's own short rollout was death-class; the
    # debounced death veto (death_debounce=3) is what is expected to keep this
    # armed signal from mistaking a respawn for a transition, not a witnessed
    # non-death fire on this profile.
    signals:
      scene_cut: {scene_min: 1, blank_min: 1, kind: [pan, warp, fade], death_debounce: 3}
  # Armor mode bit: 1 (or 2, an armor/shield upgrade state observed once in
  # a long rollout) = has armor, 0 = underwear (one hit from death). Lets
  # the archive tell an armored arrival apart from an unarmored one at the
  # same (progress, y) cell — matters a lot here since a hit is often fatal.
  state_sig:
    - {addr: 0x0585, match: [1, 2]}
  # Sustained-hold macros (generic mechanism, same rationale as Contra/CV):
  # the opening zombie needs several consecutive throws to kill before it
  # closes distance (verified in our own probes: B held for ~16 steps kills
  # it), which stochastic per-step sampling rarely emits on its own.
  hold_macros:
    - {buttons: ["B"], steps: 16, p: 0.03}
    - {buttons: ["right", "A"], steps: 10, p: 0.02}

# ===========================================================================
# START-STATE CAPTURE RECIPE (GnG-specific; the generic masher does NOT work)
# ===========================================================================
# The generic scripts/capture_start_state.py fails on GnG (it pulses START =
# PAUSE, and its RIGHT/LEFT probe false-positives on the 1P/2P title cursor).
# Correct sequence:
#   1. Reset. Hold NOOP ~120 frames until the "1 PLAYER / 2 PLAYERS" title is up.
#   2. Pulse START ONCE to select 1 PLAYER.
#   3. Hold NOOP through the intro + "PLAYER 1 READY" + "STAGE 1 A" banner.
#      Active gameplay = $0028 becomes 0x08 (~frame 2600 from cold boot).
#   4. Snapshot there -> roms/Ghosts'n Goblins (USA)_start.state.bin
# The shipped capture drops Arthur into the Stage-1 graveyard, armored, near a
# skeleton (so some episodes die fast — a cleaner safe-spawn capture is a
# nice-to-have but not required).