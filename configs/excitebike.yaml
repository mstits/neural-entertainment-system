name: "Excitebike"
# Live Selection-A race state, captured right at the GO of the start
# countdown. Without it the emulator cold-boots to the title/attract demo,
# which ignores controller input -> zero learning signal.
start_state_path: "roms/Excitebike (Japan, USA)_start.state.bin"
rom_hashes:
  - "d7fe15cf2bc7b6582c07d12b3cf3bede"  # Excitebike (Japan, USA) — NROM mapper 0

# Racing/action game — landing rotation, lane timing and crash-recovery all
# need responsive control, so frame_skip 4 (NOT the trainer default 16, which
# is far too coarse to time a ramp landing).
frame_skip: 4
# There is NO race time limit (verified: idling never ends the race; the
# clock 0x0069 just wraps 0..59). A clean turbo-managed run finishes the track
# in ~4600 frames (~1150 steps @ fs4). 1600 covers a full race + slow/crashy
# runs; the episode also ends the instant the finish line is crossed.
max_episode_steps: 1600

description: >
  Training profile for Excitebike (NES, 1984/85), Selection A (solo time
  trial — no CPU opponents, cleanest signal). The bike is controlled with
  A (throttle) / B (turbo, faster but overheats), UP/DOWN (change among 4
  lanes) and LEFT/RIGHT (lean the bike mid-air to land level). Reward pays
  forward distance + a per-section milestone + a small speed bonus, and
  penalizes crashes and engine overheat. The WIN is crossing the finish
  line (section index 0x03A4 reaches the final section) — a terminal bonus
  that dominates all shaping. episode_success() is a real finish, not
  total>0.

# All addresses verified empirically against nes_core on the (Japan, USA)
# dump by driving the bike and reading RAM. NOTE two corrections to the prior
# guesses: the overheat gauge is 0x03B6 (NOT 0x03E3, which stays 0 here), and
# the finish is the section index 0x03A4 reaching 3 (there is no time limit).
ram_mapping:
  # --- forward progress (THE shaping signal) ---
  section_dist:    0x00ED   # VERIFIED-LIVE distance within current section,
                            # 0..~129, RESETS at each section boundary. Pure
                            # forward distance (stays 0 under NOOP). Shaping
                            # uses max(0, delta).
  section_index:   0x03A4   # VERIFIED-LIVE 0->1->2->3 (+1 per section
                            # boundary); reaching 3 == FINISH LINE crossed,
                            # then the race resets to 0. THE win signal.
  # --- vehicle state ---
  speed:           0x00F3   # VERIFIED-LIVE 0..48 (47 = A top, 48 = turbo)
  motor_temp:      0x03B6   # VERIFIED-LIVE engine heat: starts 8, +~1/20f
                            # under B (turbo), cools fast otherwise; at 32 =
                            # OVERHEAT and the bike stalls (speed -> ~1).
  bike_status:     0x00F2   # VERIFIED-LIVE 0 ok, 2 crash/tumble, 4 remount
                            # after an overheat stall.
  surface_status:  0x037C   # MED  0 ok, 1 puddle, 2 top/bottom edge (unused)
  lane:            0x00B0   # MED  current lane (reads 0/2 here)
  # --- race framing (not used by the reward; documented) ---
  ready_flag:      0x000E   # VERIFIED-LIVE 1 = staged/idle/crashed-remount,
                            # 0 = racing, 2 = FINISHED (race over, corroborates
                            # section_index == 3).
  start_countdown: 0x0024   # VERIFIED-LIVE start countdown; also a big value
                            # (~136) on the post-finish race restart.
  race_clock:      0x0069   # VERIFIED-LIVE elapsed seconds 0..59, WRAPS
                            # forever. TIME, not distance; NO time limit — do
                            # NOT use as progress or termination.

reward_weights:
  # Bespoke ExcitebikeReward keys (name.contains("excitebike") dispatch).
  # Progress + section milestones shape densely; the finish DOMINATES.
  forward_progress: 1.0     # per unit of within-section distance (0x00ED)
  section_bonus:    25.0    # milestone each section boundary (0x03A4 +1)
  speed_bonus:      0.02    # small throttle-holding shaping (normalized)
  crash_penalty:   -8.0     # one-shot on crash/tumble (0x00F2 -> 2)
  overheat_penalty: -5.0    # one-shot on overheat/stall (0x03B6 >= 32)
  completion_bonus: 1000.0  # TERMINAL: finish line (0x03A4 -> final section)
  time_penalty:    -0.005   # mild per-step; discourages idling

action_space:
  - []                      # NOOP
  - ["A"]                   # throttle (normal)
  - ["B"]                   # turbo (faster, overheats)
  - ["up"]                  # lane up
  - ["down"]                # lane down
  - ["A", "up"]             # accelerate + lane up
  - ["A", "down"]           # accelerate + lane down
  - ["A", "left"]           # accelerate + lean back (nose up for landings)
  - ["A", "right"]          # accelerate + lean forward
  - ["left"]                # mid-air lean back
  - ["right"]               # mid-air lean forward

curriculum:
  stage_1: ["*"]            # single track; SMB area-byte curriculum is gated
                            # off for non-Mario games by the trainer.

reinforce:
  enabled: true
  # UNIFIED vanilla_ppo (universal pixel-CNN path, same as Contra/MM): no RAM
  # tile decoder -> Nature-DQN encoder over 4-stacked 84x84 grayscale frames.
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps

  # === ROLLOUT ===
  rollout_steps: 1024
  steps: 10                 # K PPO epochs / iter
  ppo_minibatch_size: 256

  # === PPO HYPERPARAMETERS ===
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02        # keep exploration up: throttle-only collapses fast
  grad_clip: 0.5
  value_loss: huber

  # === RND INTRINSIC EXPLORATION ===
  # Extrinsic signal is dense (distance) but the finish is far, so RND helps
  # the agent discover "hold throttle + survive + manage turbo". 0.0 = off.
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0

# Go-Explore solver adapter (bootstrap 2026-08-03). Every address below was
# (re)verified live from THIS core's start state via scripted + differential
# rollouts only (no external maps/disassembly). Receipt:
# runs/excitebike/excitebike_receipt.json.
#
# IN-GAMEPLAY (not attract demo): A-vs-NOOP diverges 57 RAM bytes over 40
# frames (>25). NOTE the standard right-vs-left liveness reads only 3 bytes
# here because Excitebike's LEFT/RIGHT are air-lean controls that do nothing
# on the grounded start bike; the racing-game liveness proof is THROTTLE-vs-idle.
#
# PROGRESS design — a racing game with NO 16-bit position odometer.
# The player sprite is camera-fixed and the TRACK scrolls, so there is no
# monotone world-X byte: a wrap-test over every wrapping low-byte candidate
# (0x0012/0x0050/0x00C8...) found ZERO with a monotone hi-byte partner (they
# are sub-pixel/physics accumulators). Instead the game exposes a per-section
# distance that RESETS each section (0x00ED, 0..129) plus a SECTION/room
# counter that steps 0->1->2->3 at each boundary and hits 3 at the finish
# (0x03A4). Encoding progress = section_index*256 + section_dist (GenericGame
# lo|hi<<8) yields a MONOTONE signal (99.9%) that climbs 0->773 across ALL 4
# sections to the finish. SATURATION-TEST PASS: it does NOT cap at a scroll
# window — section_dist alone briefly plateaus at its per-section max (~1.7% of
# a section's steps near each boundary), but the section_index hi-byte (a true
# room counter) steps at the boundary so the PRIMARY progress keeps advancing.
solve:
  rom: "roms/Excitebike (Japan, USA).nes"
  # ODOMETER-ERA GATE 2026-08-24 (runs/onboard_wave1/gate_excitebike.json):
  # PPU scroll odometer PASSES — SIGNAL SOUND, still advancing — under an
  # A-hold (throttle): axis=x, 0..11062 px, 1116 distinct over 1200 steps,
  # OAM churn 841/1199. NOTE: the gate's default --forward right is FLAT
  # here (0 px, OAM static) because LEFT/RIGHT are air-lean controls that do
  # nothing on a grounded bike — Excitebike's forward driver is A. So
  # `progress: {source: odometer, axis: x}` is a certified fallback, but the
  # RAM encoding below is kept as PRIMARY: it was discovered by this repo's
  # own probes, is monotone 99.9%, and its hi-byte doubles as the area/room
  # coordinate the archive cells with.
  # SOLVER SMOKE 2026-08-24 (runs/onboard_wave1/smoke_excitebike, 3 workers,
  # 6 min, seed 0): SOUND_ADVANCING — 85 cells, max_area 2 (of 3 section
  # boundaries), max_gx_in_max_area 633, frontier growing every 60 s window
  # (+23 cells in the final one), no freeze, no diagnostic needed. 0 finishes
  # yet inside the smoke budget; the finale hook below banks the solution
  # the moment section 3 is reached.
  # progress = section_index(0x03A4)<<8 | section_dist(0x00ED). Monotone 99.9%,
  # 0->773 full track; flat under NOOP (bike must be throttled to move).
  progress: {lo: 0x00ED, hi: 0x03A4}
  # Max legit combined progress ~897 (section 3 + dist 129); the cap guards
  # transition-frame garbage (a mid-load section byte reading huge -> progress
  # in the tens of thousands).
  progress_cap: 1200
  # y = bike sprite Y (OAM shadow). VERIFIED-LIVE range 10..166: separates the
  # 4 lanes (grounded Y clusters ~10-41 top / ~114-166 bottom) AND traces jump
  # arcs, so //Y_BAND gives ~5 y-bands (a pixel-scale vertical; the zero-page
  # verticals are camera-fixed at ~128 and the lane index 0x0060 is 0..3 which
  # //32 collapses to one band). VERIFIED byte-identical across save/restore
  # (2048/2048 RAM match) so the deterministic archive return is exact.
  y: 0x0275
  # Cell FIRST coordinate = section_index (== progress hi-byte). max_area follows
  # the bike down the track section-by-section (0..3).
  area: 0x03A4
  # Coverage baseline: NO byte counts CLEARED races monotonically (section_index
  # resets 3->0 at the finish, so it is section progress, not a clear counter).
  # The finish is captured by the finale hook below, not level_key.
  level_key: []
  # Excitebike has NO lives. GenericGame requires a lives key, so this points at
  # a constant anchor (==26 across throttle/overheat/crash/lane-change/finish)
  # making the `lives<start_lives` clause inert -> death is driven purely by
  # player_state 0x00F2 below.
  lives: 0x0011
  # DEATH = the bike is DOWN. bike_status 0x00F2: 0 = racing OK (the ONLY
  # healthy value), 1 = crash-onset/stall, 2 = crash/tumble, 4 = overheat
  # stall/remount (temp==32) — all three drop speed to 0. VERIFIED: normal ramp
  # jumps keep 0x00F2==0 (jump run uniques {0,4}, the 4 = an incidental
  # overheat), so jumps are NOT flagged as death; only crashes/overheat are.
  player_state: 0x00F2
  death_states: [1, 2, 4]
  # WIN = crossing the finish line. ready_flag 0x000E: 0 racing, 1 staged/remount,
  # 2 = FINISHED — ==2 appears ONLY at/after the finish (section_index=3, never
  # mid-race), so this finale hook DUMPS A SOLUTION the instant the race is won.
  finale: {addr: 0x000E, value: 2, level_key: []}