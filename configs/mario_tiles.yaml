name: "Super Mario Bros."
rom_hashes:
  # MD5 hashes of known-good Super Mario Bros. ROM dumps
  - "811b027eaf99c2def7b933c5208636de"

# Tile-mode profile for Super Mario Bros. — the MarI/O recipe modernized.
#
# Differences vs. mario.yaml (the universal pixel CNN profile):
#
# * `reinforce.encoder: smb_tiles` swaps the 1.7M-param Nature-DQN CNN
#   for a ~14k-param MLP that consumes a 13x13 tile grid + scalars
#   decoded directly from RAM. Search space shrinks ~120x; PPO
#   gradients become large enough relative to total params to actually
#   steer learning instead of drowning in noise.
#
# * `reinforce.preserve_elite_diversity: true` stops the post-PPO
#   clone-overwrite that collapses population diversity to one policy.
#   With diversity preserved, a successful elite mutation is more
#   likely to find a complementary partner via crossover.
#
# * Dense reward shaping (`checkpoint_scale: 1.0`) gives the value
#   head non-trivial intermediate signal at every major obstacle.
#   PPO's advantage signal becomes meaningful instead of "0 most
#   steps, +2000 spike at the flag once in a blue moon."
#
# * Tighter trajectory cap (max_episode_steps 600 vs 36000) so credit
#   assignment over the trajectory is tractable. ~600 agent-steps at
#   frame_skip=8 is ~80 game-seconds, more than enough to clear 1-1
#   at human pace.
#
# * GA-only warmup is shortened to 10 gens (vs 25 for pixel mode) —
#   a 14k-param network spreads through the population in fewer gens
#   than 1.7M needs.

frame_skip: 4
# 4 (down from 8) is the canonical choice in both uvipen/Super-mario-bros-PPO-pytorch
# (CNN-based, clears 31/32 levels) and yumouwei/super-mario-bros-reinforcement-learning
# (RAM-based, clears 1-1 reliably). Frame_skip=8 was originally chosen to halve
# wall-clock per agent step, but it costs control granularity — a single agent action
# spans 8 NES frames (~133ms), which is too coarse for the frame-perfect jumps SMB
# requires past the first pit. Both canonical repos use 4. To preserve the same
# game-time-per-episode, max_episode_steps is doubled below.

description: >
  Tile-based training profile for Super Mario Bros. (NES, 1985). Uses
  RAM-decoded tile observations with a small MLP policy. Designed to
  break through the staircase-near-flag plateau the pixel-CNN profile
  hits around generation 100-150. See docs in
  src/emulation/tile_observations/smb.py for the RAM layout.

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E
  float_state:     0x001D

reward_weights:
  # Forward progress weight stays at 1.0 (canonical: gym-super-mario-bros
  # uses delta_x with no scaling). Death penalty rebalanced to -15 to
  # match the canonical Kauten reward formula r=v+c+d, which clips to
  # (-15, 15) per step and uses d=-15 on death. completion_bonus
  # dropped from 2000 to 100 — the prior 2000 was 40x larger than the
  # max forward progress reward (3160), so it dominated the value
  # function whenever achieved and starved the per-step gradient.
  # Total clean run = ~3160 forward + 2550 checkpoints + 100 completion
  # - 60 time = ~5750. Forward progress and checkpoints dominate, as
  # they should — the agent learns the path, the completion is the
  # cherry on top.
  forward_progress: 1.0
  score_delta:      0.005
  # Death and time penalties were 0.0 (no-op equilibrium); previous
  # rev set them to -50 and -0.01. That fix introduced a NEW failure:
  # 27 generations of empirical data showed avg_fitness ~95, which
  # corresponds to ~145-pixel forward progress per episode. With
  # death=-50 and average forward of 5 pixels per episode, dying
  # nets -45 while standing still nets -15 — so "stand still" still
  # strictly wins for the average policy, and the GA correctly
  # selects no-op. Multi-eval (commit 1ab09ca) gave us a clean
  # selection signal but couldn't change which target was higher.
  #
  # death=-15 is the Kauten canonical (gym-super-mario-bros clips
  # r=v+c+d to (-15, 15) per step and uses d=-15 on death). uvipen's
  # repo (clears 31/32 levels) uses -50 then divides by 10 = -5, so
  # both canonical recipes converge on a -5 to -15 effective range.
  # We pick -15 to match the per-step clip ceiling of the canonical
  # gym reward — symmetric with the +15 max forward velocity.
  #
  # time_penalty=-0.05 substitutes for gym-super-mario-bros's clock
  # delta term (we don't read the in-game clock, so we synthesize a
  # constant per-step cost). Over 1200 max steps that's -60 cumulative
  # — strictly worse than dying at any positive x, so no-op never
  # wins, but mild enough that brief exploration drags don't crush
  # the gradient.
  death_penalty:    -15.0
  # Bumped 100 -> 500 after empirical: gen 152-176 of the canonical-aligned
  # run had success_rate=0.005 (3 lucky flag touches), but the policy
  # never consolidated reliable clears. Diagnosis: with completion=100
  # and forward-to-flag=3160, the clear-vs-die-at-flag fitness delta
  # was only 100/3260 = 3% — below PPO's noise floor on a stochastic
  # policy. Bumping to 500 makes a clear worth ~15% over a near-miss,
  # large enough that the GA reliably selects clearing genomes and
  # PPO sees a strong gradient on the final approach.
  completion_bonus: 500.0
  time_penalty:     -0.05
  # Dense progress checkpoints (per-x-position bonuses defined in
  # nes_core/src/rewards.rs::MarioReward::CHECKPOINTS). Multiplier of
  # 1.0 fires the calibrated values: 50/100/150/250/400/600/1000 at
  # x={350, 720, 1100, 1640, 2100, 2700, 2900}. Total per-clear:
  # ~2550 in checkpoint bonuses, plus the 2000 completion at the
  # flag. Set to 0.0 to disable and recover the prior pure-progress
  # behavior (useful for ablation comparisons).
  checkpoint_scale: 1.0

action_space:
  - []                      # no-op
  - ["right"]
  - ["right", "A"]          # jump right
  - ["right", "B"]          # run right
  - ["right", "A", "B"]     # run-jump right
  - ["A"]                   # stationary jump
  - ["left"]
  - ["left", "A"]

# PPO settings tuned for the 14k-param tile policy. Most knobs are
# stronger than the pixel profile because gradient signal is
# stronger here:
#   * lr is 3x the pixel default (3e-4 vs 1e-4) — small network can
#     handle larger steps without diverging
#   * inner steps bumped to 10 (was 3) — each gradient update now
#     moves the policy meaningfully so we want more of them
#   * symlog kept on — keeps value loss bounded under reward scale
#     spikes from the +2000 completion bonus
#   * warmup is shorter (10 gens) — small population converges fast
reinforce:
  enabled: true
  encoder: smb_tiles
  preserve_elite_diversity: true
  # Snapshot best's pre-PPO weights and inject into the population
  # so the GA's next-gen elitism keeps both the post-PPO best AND
  # the pre-PPO weights. Without this, a fragile winning policy
  # (e.g. the gen-151 SMB 1-1 clear at fitness 7716) is destroyed
  # in-place by a single regressive PPO step. Default True; flip
  # off only to reproduce the pre-fix behavior.
  freeze_pre_ppo_elite: true
  # Multi-episode evaluation. With entropy ~0.4 and frame-perfect
  # platformer dynamics, single-episode fitness has 5x variance
  # for the SAME elite weights — observed empirically: gen 10
  # best=582, gen 11 best=147 (same frozen genome, different luck).
  # 2 episodes cuts noise to ~1/2 at only 2x wall-clock. 4 was too
  # expensive — at 50s/gen the trainer covers fewer wall-clock
  # generations than the previous (broken) 1-episode runs that hit
  # depth=2519 by gen 70 wallclock-equivalent ~14min. With 2-ep
  # we're at ~25s/gen, closer to the gen-throughput budget that
  # made random exploration in the prior run effective.
  # Trajectory used by PPO is the BEST-fitness episode of each
  # genome — PPO learns from the agent's good runs, not from a
  # randomly-picked one that may have died at frame 5.
  episodes_per_genome: 2
  symlog_rewards: true
  # Switch the critic loss from MSE to Huber (smooth L1). MSE on
  # un-normalized GAE returns produced ppo_value_loss ~300-660
  # across the prior run, which (at value_coef=0.5) sent a
  # ~150-330 magnitude gradient through the shared trunk every
  # step while the policy gradient was -0.005. Huber bounds large
  # errors to linear growth so the critic stops steamrolling the
  # actor. Combined with value_coef=0.25 below, the value-side
  # contribution is now in the single-digit range.
  value_loss: huber
  value_coef: 0.25
  bc_epochs: 30
  warmup_gens_ga_only: 10
  steps: 10
  lr: 3.0e-4
  # async_pipeline DISABLED for SMB — the 1-step observation lag (8
  # NES frames at frame_skip=8 = ~133ms) is too large for frame-perfect
  # platformer jumps. Empirical: enabled this for 50 gens, depth_leaf
  # plateaued at 723 (first pit) instead of climbing to 2012 like the
  # prior runs. The compute pipelining is real but the policy
  # degradation outweighs it for this game class. Re-evaluate per-game
  # — Zelda overworld might tolerate the lag fine; Contra likely won't.
  async_pipeline: false
  # Tile features are 14k-param MLP; GPU kernel-launch overhead
  # (~150-300 us per call on MPS) dominates the actual compute
  # (~14k FLOPS at batch=16). CPU inference avoids the launch
  # overhead entirely. Toggle to "mps" for A/B comparison.
  device: cpu
  # Production fast path: skip per-worker `catch_unwind` wrapping
  # in the Rust pool. ~0.5-1% throughput. Worker panics may abort
  # the process — acceptable since SMB ROMs are validated. Disable
  # (omit or set to true) when running new/uncertified ROMs.
  panic_isolation: false
  # 0.001 — calibrated mid-point. The 0.005 setting (last commit)
  # caused entropy to climb 1.0 -> 1.5 over 30 gens as policy_loss
  # shrank from 0.12 -> 0.025: with that ratio, the entropy bonus
  # was actively pulling the policy back toward uniform faster than
  # PPO could commit. 0.001 is 5-10% the magnitude of policy_loss,
  # which is the canonical balance.
  entropy_coef: 0.001
  # RND (Random Network Distillation, Burda+2018; tile variant via
  # src/models/tile_rnd.py). Intrinsic bonus for visiting states the
  # predictor net hasn't seen yet — Pathak's ICM paper demonstrated
  # this exact mechanism crossing 30% of SMB level 1 with ZERO
  # extrinsic reward. Our prior 41-gen run plateaued at depth_scalar
  # = 832 because no extrinsic gradient pulled the policy past the
  # first stretch (most exploration past 832 dies to Goombas/pipes
  # → low extrinsic return → PPO learns "don't go past 832"). RND
  # gives a positive bonus to NEW states regardless of extrinsic
  # outcome, so even a death-bound trajectory that visits x=900 for
  # the first time scores well in the predictor's MSE.
  #
  # intrinsic_coef=0.1 produces ~0.05-0.5 per-step bonus → ~60-600
  # cumulative over a 1200-step episode. ~5-50% of typical extrinsic
  # forward reward, so it's a meaningful nudge but doesn't dominate.
  # loss_coef=1.0 follows Burda canonical (let the predictor learn
  # at full strength so RND signal is useful from gen 1).
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  # Live BC replay. Captures every successful (level-clear) episode
  # to an in-memory buffer and periodically retrains a fresh policy
  # via supervised behavior cloning on the buffer. Solves the
  # observed "lucky-clear-then-regress" plateau (canonical run hit
  # success_rate=0.005 at gen 152 then drifted back to 0 by gen
  # 178): without BC replay, a single lucky genome's clearing
  # trajectory exists for one gen and is washed out by mutation.
  # With BC replay, the actual (state, action) sequence that led
  # to a clear is preserved and re-imitated every 20 gens — the
  # population has a permanent anchor to "what works."
  bc_replay_enabled: true
  bc_replay_every_gens: 20
  bc_replay_epochs: 5
  bc_replay_max_buffer: 16

# GA tuning. Tighter mutation_std than pixel profile because tile
# policies have far fewer weights — same per-weight noise has
# proportionally bigger behavioral impact. Stale-restart disabled
# entirely: with diversity preserved across elites, restarts hurt
# more than help.
ga_params:
  mutation_rate: 0.8
  # Lowered 5x from 0.005 after gen 132-300 showed the elite's hard-won
  # staircase-approach policy decaying under accumulated GA noise. At
  # mutation_rate=0.8 with std=0.005 on a 14k-param net, ~11k weights
  # per genome see Gaussian perturbation of magnitude 0.005 per gen.
  # That's substantial behavioral drift; weak PPO can't outpace it
  # once advantages shrink. 0.001 keeps GA diversity injection active
  # without erasing structure.
  mutation_std: 0.001
  elite_fraction: 0.4
  # Re-enabled (was 0) after 175-gen plateau at depth 2586. Restart
  # fires when the all-time best hasn't improved in 50 gens; injects
  # 50% fresh genomes (controlled by `restart_fraction`) to break out
  # of local minima. Originally disabled because the pixel-CNN run
  # was firing restart on near-clears; in tile mode we're nowhere
  # near 1-1 clear yet, so restart is the right tool.
  stale_gens_before_restart: 50
  restart_fraction: 0.5

# Per-episode step budget. Doubled from 600 to 1200 in lockstep with
# the frame_skip 8→4 change above — this preserves the original
# 4800-NES-frame (~80 game-second) episode length, just at 2× the
# decision-point density. Credit assignment over 1200 steps is still
# tractable (GAE can attribute "Mario died in pit" to the specific
# bad jump 30-50 steps prior).
max_episode_steps: 1200

curriculum:
  stage_1: ["1-1"]
  stage_2: ["1-1", "1-2"]
  stage_3: ["1-1", "1-2", "1-3", "1-4"]
  stage_4: ["1-1", "1-2", "1-3", "1-4", "2-1", "2-2", "2-3", "2-4"]
  stage_5: "full_game"
