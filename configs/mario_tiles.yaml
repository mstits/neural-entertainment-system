name: "Super Mario Bros."
rom_hashes:
  # MD5 hashes of known-good Super Mario Bros. ROM dumps
  - "811b027eaf99c2def7b933c5208636de"

# Tile-mode profile for Super Mario Bros. — the MarI/O recipe modernized.
#
# Differences vs. mario.yaml (the universal pixel CNN profile):
#
# * `reinforce.encoder: smb_tiles` swaps the 1.7M-param Nature-DQN CNN
#   for a ~14k-param MLP that consumes a 13x13 tile grid + scalars
#   decoded directly from RAM. Search space shrinks ~120x; PPO
#   gradients become large enough relative to total params to actually
#   steer learning instead of drowning in noise.
#
# * `reinforce.preserve_elite_diversity: true` stops the post-PPO
#   clone-overwrite that collapses population diversity to one policy.
#   With diversity preserved, a successful elite mutation is more
#   likely to find a complementary partner via crossover.
#
# * Dense reward shaping (`checkpoint_scale: 1.0`) gives the value
#   head non-trivial intermediate signal at every major obstacle.
#   PPO's advantage signal becomes meaningful instead of "0 most
#   steps, +2000 spike at the flag once in a blue moon."
#
# * Tighter trajectory cap (max_episode_steps 600 vs 36000) so credit
#   assignment over the trajectory is tractable. ~600 agent-steps at
#   frame_skip=8 is ~80 game-seconds, more than enough to clear 1-1
#   at human pace.
#
# * GA-only warmup is shortened to 10 gens (vs 25 for pixel mode) —
#   a 14k-param network spreads through the population in fewer gens
#   than 1.7M needs.

frame_skip: 4
# 4 (down from 8) is the canonical choice in both uvipen/Super-mario-bros-PPO-pytorch
# (CNN-based, clears 31/32 levels) and yumouwei/super-mario-bros-reinforcement-learning
# (RAM-based, clears 1-1 reliably). Frame_skip=8 was originally chosen to halve
# wall-clock per agent step, but it costs control granularity — a single agent action
# spans 8 NES frames (~133ms), which is too coarse for the frame-perfect jumps SMB
# requires past the first pit. Both canonical repos use 4. To preserve the same
# game-time-per-episode, max_episode_steps is doubled below.

description: >
  Tile-based training profile for Super Mario Bros. (NES, 1985). Uses
  RAM-decoded tile observations with a small MLP policy. Designed to
  break through the staircase-near-flag plateau the pixel-CNN profile
  hits around generation 100-150. See docs in
  src/emulation/tile_observations/smb.py for the RAM layout.

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E
  float_state:     0x001D

reward_weights:
  # Forward progress weight stays at 1.0 (canonical: gym-super-mario-bros
  # uses delta_x with no scaling). Death penalty rebalanced to -15 to
  # match the canonical Kauten reward formula r=v+c+d, which clips to
  # (-15, 15) per step and uses d=-15 on death. completion_bonus
  # dropped from 2000 to 100 — the prior 2000 was 40x larger than the
  # max forward progress reward (3160), so it dominated the value
  # function whenever achieved and starved the per-step gradient.
  # Total clean run = ~3160 forward + 2550 checkpoints + 100 completion
  # - 60 time = ~5750. Forward progress and checkpoints dominate, as
  # they should — the agent learns the path, the completion is the
  # cherry on top.
  # Bumped 1.0 -> 3.0 after empirical: the user manually bumped this
  # weight ~3x mid-run last time, and that was the inflection point
  # where the agent's depth_scalar climbed 832 -> 1264 -> 1735 -> 2608
  # -> 3161 (flagpole). Without the bump, the canonical 1.0 weight
  # leaves Mario stuck at first-pit local optima — there isn't enough
  # gradient differential between "moves a few tiles right" and
  # "actually pushes through obstacles" for PPO to commit to the
  # latter. 3.0 multiplies the per-step forward signal so the
  # advantage on long-progress episodes dominates the death penalty
  # and time cost combined.
  forward_progress: 3.0
  # Bumped back from 2.3 → 3.0 to match the configuration that
  # actually reached depth 3161 (flag region) earlier today.
  # 2.3 was an attempt to split the difference; empirically the
  # agent stuck at depth 1275 for 41 generations under that weight.
  # 3.0 is the "actually worked" baseline.

  # Air bonus: rewards Mario per step when airborne AND moving
  # right. Targets the observed jump-timing failure mode — the
  # policy converged on "run on flat ground" but never committed
  # to action 4 (run+jump+right). 0.5 per step × ~30 frames
  # airborne per jump = +15 per successful jump-clear, comparable
  # to the +50 first-checkpoint bonus, large enough that PPO
  # commits to jump-actions but small enough that it doesn't
  # dominate forward progress.
  # Bumped 0.5 -> 1.5 after the gen 88 data showed Mario consistently
  # reaching depth 2009 (just before the staircase) but never the
  # 3161 flagpole region. Diagnosis: at 0.5/frame, jumping nets +15
  # over a 30-frame arc while running on ground nets +225 forward —
  # so the policy correctly chose running, hit the pit, died. At
  # 1.5/frame, jumping nets +45 air + 135 forward = 180; still less
  # than 225 for ground-running but close enough that the death-
  # avoidance term tips the gradient toward "jump when obstacle
  # ahead." Combined with sticky_action_prob=0.5 (also bumped),
  # full-arc jumps complete ~13% of the time vs ~4% before.
  air_bonus:        1.5
  # 2026-05-07: more carrot, less stick. Periodic survival bonus
  # (+300 every 150 trainer steps = 600 NES frames ≈ 10 s of game
  # time at fs=4) gives PPO a steady positive gradient for "stay
  # alive long enough to attempt the hard maneuver". Complements
  # the once-per-episode checkpoint signals — survival reward
  # accumulates while the agent is figuring out what to do.
  survival_bonus:        300.0
  survival_block_steps:  150
  # Pit-clear bonus: detects airborne→ground transitions where Mario
  # covered ≥16 X-units (1 tile) of forward progress during the air
  # period. Each successful jump-over-anything (pit, Goomba, pipe)
  # fires +50. Positive counterpart to pit_fall_extra; with the
  # latter zeroed (below) this is a pure carrot for the exact
  # behavior we want to encourage at the obstacle complex.
  jump_clear_bonus:      50.0
  jump_clear_min_dx:     16
  # Death-cause differentiation. pit_fall_extra stays — pits are
  # the dominant failure mode at the staircase plateau and the
  # extra signal is independent (no other channel rewards
  # "successfully avoided falling"). enemy_death_extra REMOVED —
  # enemy interactions are already differentially scored: killing
  # a Goomba bumps RAM score (+score_delta * 100), dying to one
  # triggers death_penalty (-15). The extra was double-counting
  # the negative side without giving PPO any new information
  # beyond what score+death already provided.
  # 2026-05-07: zeroed (was -15). Pit fear was contributing to the
  # depth-1956 → depth-2760 wall pattern: agents stopped jumping
  # because every failed jump compounded the penalty. Replaced
  # with the positive jump_clear_bonus (above) — same intent,
  # opposite gradient direction.
  pit_fall_extra:    0.0
  score_delta:      0.005
  # Death and time penalties were 0.0 (no-op equilibrium); previous
  # rev set them to -50 and -0.01. That fix introduced a NEW failure:
  # 27 generations of empirical data showed avg_fitness ~95, which
  # corresponds to ~145-pixel forward progress per episode. With
  # death=-50 and average forward of 5 pixels per episode, dying
  # nets -45 while standing still nets -15 — so "stand still" still
  # strictly wins for the average policy, and the GA correctly
  # selects no-op. Multi-eval (commit 1ab09ca) gave us a clean
  # selection signal but couldn't change which target was higher.
  #
  # death=-15 is the Kauten canonical (gym-super-mario-bros clips
  # r=v+c+d to (-15, 15) per step and uses d=-15 on death). uvipen's
  # repo (clears 31/32 levels) uses -50 then divides by 10 = -5, so
  # both canonical recipes converge on a -5 to -15 effective range.
  # We pick -15 to match the per-step clip ceiling of the canonical
  # gym reward — symmetric with the +15 max forward velocity.
  #
  # time_penalty=-0.05 substitutes for gym-super-mario-bros's clock
  # delta term (we don't read the in-game clock, so we synthesize a
  # constant per-step cost). Over 1200 max steps that's -60 cumulative
  # — strictly worse than dying at any positive x, so no-op never
  # wins, but mild enough that brief exploration drags don't crush
  # the gradient.
  # 2026-05-07: zeroed. Hypothesis from gen 6+ stall at depth 2760:
  # the death penalty is suppressing the risk-taking required to
  # learn stair-jumps. Forward progress already differentiates
  # "died at x=10" from "died at x=2700" — agents that die early
  # earn nothing — so the additional -15 just punishes attempts to
  # commit. Combined with jump_clear_bonus (above) this flips the
  # balance to pure positive reinforcement on productive jumping.
  death_penalty:    0.0
  # 2026-05-08: Bumped 500 -> 2000. Run 153-465 reached depth 3161
  # (flag area) reliably but only ~3 clears in the last 50 gens
  # (success_rate=0.005). Diagnosis: by the time Mario reaches the
  # staircase his accumulated trajectory reward is ~5000-6000, so
  # +500 for the flag touch is only ~8-10% — still below PPO's
  # noise floor for the specific final-stretch action pattern.
  # +2000 makes it ~30-40% jump vs near-miss, putting the gradient
  # above the noise. Risk: 1-1 becomes a stronger attractor that
  # resists curriculum advancement to 1-2; mitigated by curriculum
  # advance threshold being a separate signal.
  completion_bonus: 2000.0
  # time_penalty REMOVED (was -0.05). The reasoning: "running out
  # of time" was already implicitly penalized — episodes that
  # don't reach the flag forfeit the +500 completion bonus AND
  # any unreached checkpoints, which is far larger than -60 of
  # accumulated time penalty over 1200 steps. The constant per-
  # step cost was just adding noise to the gradient, competing
  # with forward_progress and pulling the value function toward
  # negative values everywhere.
  #
  # KNOWN RISK: removing time_penalty resurrects the no-op
  # equilibrium that bit us in the first session — standing
  # still goes from -60 net to 0 net, while walking-and-dying-
  # at-x=10 goes from +14.5 to +15. Differential is now 15
  # instead of 75. We're betting that pit_fall_extra + checkpoint
  # bonuses + forward_progress * 3.0 together produce a strong
  # enough "move right" gradient that no-op doesn't reassert.
  # If avg_fitness collapses below 500 in the next 50 gens,
  # this assumption is wrong and we restore time_penalty.
  time_penalty:     0.0
  # Dense progress checkpoints (per-x-position bonuses defined in
  # nes_core/src/rewards.rs::MarioReward::CHECKPOINTS). Multiplier of
  # 1.0 fires the calibrated values: 50/100/150/250/400/600/1000 at
  # x={350, 720, 1100, 1640, 2100, 2700, 2900}. Total per-clear:
  # ~2550 in checkpoint bonuses, plus the 2000 completion at the
  # flag. Set to 0.0 to disable and recover the prior pure-progress
  # behavior (useful for ablation comparisons).
  checkpoint_scale: 1.0

action_space:
  # Reduced from 8 to 6 actions for SMB 1-1: dropped `left` and
  # `left+A`. SMB 1-1 has no left-required moments — every random
  # sample of those actions was wasted exploration, contributing
  # 25% of the entropy ceiling for zero useful behavior. With 6
  # actions, max entropy = ln(6) ≈ 1.79 (vs ln(8) ≈ 2.08), so the
  # uniform-random failure mode is naturally tighter and the
  # network's actor head has 25% fewer outputs to keep meaningful.
  # If a future curriculum stage needs left-movement (e.g. World 2
  # has bidirectional levels), reintroduce them then.
  - []                      # no-op
  - ["right"]
  - ["right", "A"]          # jump right
  - ["right", "B"]          # run right
  - ["right", "A", "B"]     # run-jump right
  - ["A"]                   # stationary jump

# PPO settings tuned for the 14k-param tile policy. Most knobs are
# stronger than the pixel profile because gradient signal is
# stronger here:
#   * lr is 3x the pixel default (3e-4 vs 1e-4) — small network can
#     handle larger steps without diverging
#   * inner steps bumped to 10 (was 3) — each gradient update now
#     moves the policy meaningfully so we want more of them
#   * symlog kept on — keeps value loss bounded under reward scale
#     spikes from the +2000 completion bonus
#   * warmup is shorter (10 gens) — small population converges fast
reinforce:
  enabled: true
  # Legacy GA recipe (elite-diversity MarI/O path) — pinned explicitly so
  # the vanilla_ppo default flip does not change this proven configuration.
  trainer_mode: ga_ppo
  encoder: smb_tiles
  preserve_elite_diversity: true
  # Snapshot best's pre-PPO weights and inject into the population
  # so the GA's next-gen elitism keeps both the post-PPO best AND
  # the pre-PPO weights. Without this, a fragile winning policy
  # (e.g. the gen-151 SMB 1-1 clear at fitness 7716) is destroyed
  # in-place by a single regressive PPO step. Default True; flip
  # off only to reproduce the pre-fix behavior.
  freeze_pre_ppo_elite: true
  # Multi-episode evaluation. With entropy ~0.4 and frame-perfect
  # platformer dynamics, single-episode fitness has 5x variance
  # for the SAME elite weights — observed empirically: gen 10
  # best=582, gen 11 best=147 (same frozen genome, different luck).
  # 2 episodes cuts noise to ~1/2 at only 2x wall-clock. 4 was too
  # expensive — at 50s/gen the trainer covers fewer wall-clock
  # generations than the previous (broken) 1-episode runs that hit
  # depth=2519 by gen 70 wallclock-equivalent ~14min. With 2-ep
  # we're at ~25s/gen, closer to the gen-throughput budget that
  # made random exploration in the prior run effective.
  # Trajectory used by PPO is the BEST-fitness episode of each
  # genome — PPO learns from the agent's good runs, not from a
  # randomly-picked one that may have died at frame 5.
  episodes_per_genome: 2
  symlog_rewards: true
  # Switch the critic loss from MSE to Huber (smooth L1). MSE on
  # un-normalized GAE returns produced ppo_value_loss ~300-660
  # across the prior run, which (at value_coef=0.5) sent a
  # ~150-330 magnitude gradient through the shared trunk every
  # step while the policy gradient was -0.005. Huber bounds large
  # errors to linear growth so the critic stops steamrolling the
  # actor. Combined with value_coef=0.25 below, the value-side
  # contribution is now in the single-digit range.
  value_loss: huber
  value_coef: 0.25
  bc_epochs: 30
  warmup_gens_ga_only: 10
  steps: 10
  lr: 3.0e-4
  # async_pipeline DISABLED for SMB — the 1-step observation lag (8
  # NES frames at frame_skip=8 = ~133ms) is too large for frame-perfect
  # platformer jumps. Empirical: enabled this for 50 gens, depth_leaf
  # plateaued at 723 (first pit) instead of climbing to 2012 like the
  # prior runs. The compute pipelining is real but the policy
  # degradation outweighs it for this game class. Re-evaluate per-game
  # — Zelda overworld might tolerate the lag fine; Contra likely won't.
  async_pipeline: false
  # Tile features are 14k-param MLP; GPU kernel-launch overhead
  # (~150-300 us per call on MPS) dominates the actual compute
  # (~14k FLOPS at batch=16). CPU inference avoids the launch
  # overhead entirely. Toggle to "mps" for A/B comparison.
  device: cpu
  # Production fast path: skip per-worker `catch_unwind` wrapping
  # in the Rust pool. ~0.5-1% throughput. Worker panics may abort
  # the process — acceptable since SMB ROMs are validated. Disable
  # (omit or set to true) when running new/uncertified ROMs.
  panic_isolation: false
  # 0.001 — restored 2026-05-12 after a brief experiment with 0.0
  # collapsed the entire 30-genome population to a single
  # deterministic policy within one generation (all 30 fitnesses
  # byte-identical, GA mutation/crossover producing no behavioral
  # diversity). With sticky_action_prob also 0, the policy at
  # entropy=0 sampled near-argmax → identical trajectories across
  # the population → degenerate GA. Diagnosis below stands (BC
  # buffer labels are still mostly uniform across actions) but
  # entropy_coef is NOT the right lever to fix it — the lever is
  # selective trajectory admission to the BC buffer, which is a
  # code change for a follow-up. For now keep the canonical 0.001.
  #
  # Inspection of the BC success buffer showed action distribution
  # at 14.7/15.8/17.5/18.1/16.3/17.6% across the 6 actions
  # (uniform = 16.67%). The "clears" the buffer collected were
  # near-random-walk lottery wins from MIXED-source policies, not
  # policy-driven clears. BC loss stayed at ~1.68 vs ln(6)=1.79
  # random baseline.
  entropy_coef: 0.001
  # RND (Random Network Distillation, Burda+2018; tile variant via
  # src/models/tile_rnd.py). Intrinsic bonus for visiting states the
  # predictor net hasn't seen yet — Pathak's ICM paper demonstrated
  # this exact mechanism crossing 30% of SMB level 1 with ZERO
  # extrinsic reward. Our prior 41-gen run plateaued at depth_scalar
  # = 832 because no extrinsic gradient pulled the policy past the
  # first stretch (most exploration past 832 dies to Goombas/pipes
  # → low extrinsic return → PPO learns "don't go past 832"). RND
  # gives a positive bonus to NEW states regardless of extrinsic
  # outcome, so even a death-bound trajectory that visits x=900 for
  # the first time scores well in the predictor's MSE.
  #
  # intrinsic_coef=0.1 produces ~0.05-0.5 per-step bonus → ~60-600
  # cumulative over a 1200-step episode. ~5-50% of typical extrinsic
  # forward reward, so it's a meaningful nudge but doesn't dominate.
  # loss_coef=1.0 follows Burda canonical (let the predictor learn
  # at full strength so RND signal is useful from gen 1).
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  # Sticky actions (Machado et al. 2018): each step, 25% chance the
  # emulator repeats the previous action instead of executing the
  # policy's freshly-sampled one. Targets the observed jump-cutoff
  # failure: SMB jumps need ~30 NES frames of A held, but at
  # frame_skip=4 + entropy 1.5, the policy oscillates between
  # A-actions and non-A-actions, releasing A mid-jump and falling
  # short. Sticky 0.25 means once Mario commits to action 4
  # (run-jump-right), there's a 25% chance the next decision keeps
  # holding A even if the policy tried to release. Documented to
  # help platformers; the recorded log-prob in the trajectory is
  # the OVERRIDDEN action's log-prob under the current policy so
  # PPO's importance ratio stays exact.
  # 0.5 — restored 2026-05-12. Brief experiment with 0.0 collapsed
  # the entire 30-genome population to byte-identical fitness across
  # all slots — sticky-action turns out to be a hidden GA-exploration
  # mechanism, not just a jump-completion helper. Removing it left
  # mutation-on-weights as the only diversity source, and with the
  # 14k-param MLP at mutation_std=0.001, child genomes produced
  # identical argmax action sequences as the elite. Per-step sticky
  # RNG was the variance amplifier the GA was relying on. BC label
  # corruption (the original reason for dropping this) is real but
  # comes mostly from MIXED-source trajectory aggregation in the
  # buffer, not from sticky overrides; that fix is in code, not YAML.
  sticky_action_prob: 0.5
  # Live BC replay. Captures every successful (level-clear) episode
  # to an in-memory buffer and periodically retrains a fresh policy
  # via supervised behavior cloning on the buffer. Solves the
  # observed "lucky-clear-then-regress" plateau (canonical run hit
  # success_rate=0.005 at gen 152 then drifted back to 0 by gen
  # 178): without BC replay, a single lucky genome's clearing
  # trajectory exists for one gen and is washed out by mutation.
  # With BC replay, the actual (state, action) sequence that led
  # to a clear is preserved and re-imitated every 20 gens — the
  # population has a permanent anchor to "what works."
  bc_replay_enabled: true
  bc_replay_every_gens: 20
  bc_replay_epochs: 5
  bc_replay_max_buffer: 16
  # 1 (not 3 default) so BC trains on a single coherent trajectory.
  # Aggregating multiple clears from different gens with slightly
  # different jump timings over similar states forces the network
  # to predict a low-confidence near-uniform mix. Single trajectory
  # gives BC one set of (state, action) labels per state that the
  # network CAN actually fit. Same fix as mario_canonical.yaml;
  # tested 2026-05-12.
  bc_replay_train_window: 1

# GA tuning. Tighter mutation_std than pixel profile because tile
# policies have far fewer weights — same per-weight noise has
# proportionally bigger behavioral impact. Stale-restart disabled
# entirely: with diversity preserved across elites, restarts hurt
# more than help.
ga_params:
  mutation_rate: 0.8
  # 2026-05-08: REVERTED adaptive_mutation_scale to false. The
  # earlier hypothesis (actor head scrambled by fixed 0.001 noise)
  # missed the elite-preservation mechanic: elites carry forward
  # UNCHANGED each gen, so mutation only ever touches children. The
  # actor head wasn't actually being scrambled in surviving genomes.
  # Switching to per-tensor std scaling at mutation_std=0.05 gave
  # the trunk 5× MORE noise than before (0.107 × 0.05 = 0.00535 vs
  # the previous 0.001 absolute), eroding the trunk's hard-won
  # feature representation faster than PPO could relearn it. Result:
  # 137-gen run plateau'd at depth 2746 with zero clears, peak
  # fitness frozen at gen 10. Reverted to the working fixed-noise
  # configuration that produced the clear-finding run.
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  # Re-enabled (was 0) after 175-gen plateau at depth 2586. Restart
  # fires when the all-time best hasn't improved in 50 gens; injects
  # 50% fresh genomes (controlled by `restart_fraction`) to break out
  # of local minima. Originally disabled because the pixel-CNN run
  # was firing restart on near-clears; in tile mode we're nowhere
  # near 1-1 clear yet, so restart is the right tool.
  #
  # Reverted from a brief experiment with 15-gen window + 60%
  # restart_fraction. The reasoning was sound (population stuck;
  # need diversity injection) but the IMPLEMENTATION is wrong:
  # GA's evolve() reseeds restarted genomes from
  # network_factory() — random init, NOT from the BC seed or any
  # successful-trajectory cache. Firing restart frequently would
  # have replaced 60% of 32 genomes with random weights every 15
  # gens, repeatedly thrashing the population. Real fix would be
  # to reseed from BC weights or the success cache, not pure
  # random; that's a code change in genetic_algorithm.py, not a
  # YAML tweak. Reverting until that's properly designed.
  stale_gens_before_restart: 50
  restart_fraction: 0.5

# Per-episode step budget. Doubled from 600 to 1200 in lockstep with
# the frame_skip 8→4 change above — this preserves the original
# 4800-NES-frame (~80 game-second) episode length, just at 2× the
# decision-point density. Credit assignment over 1200 steps is still
# tractable (GAE can attribute "Mario died in pit" to the specific
# bad jump 30-50 steps prior).
#
# 2026-05-12: bumped 1200 → 2400. Empirical observation: at 1200 ×
# fs=4 = 4800 NES frames = ~200 in-game seconds, the trainer was
# truncating episodes at the HALFWAY point of SMB 1-1's 400-second
# in-game clock. Mario was being reset mid-level on truncation, not
# on death or timer. The agent intermittently reached the flagpole
# (gens 168 / 198 / 228 / 305 cleared with fitness 12k-13k) but
# success_rate was capped at 0.005 — a chunk of the population was
# losing wall-clock to the cap rather than to genuine failure.
# 2400 = full clock budget; cost is 2× wall-clock per gen. GAE
# truncation bootstrap already handles non-terminal cutoffs
# correctly so this is a "remove an artificial constraint" change,
# not a reshape of the gradient.
max_episode_steps: 2400

curriculum:
  stage_1: ["1-1"]
  stage_2: ["1-1", "1-2"]
  stage_3: ["1-1", "1-2", "1-3", "1-4"]
  stage_4: ["1-1", "1-2", "1-3", "1-4", "2-1", "2-2", "2-3", "2-4"]
  stage_5: "full_game"
  # Gate the stage advance on the top-5 genomes' clear rate, not the
  # whole-population mean. With a 60-genome mutated GA population, most
  # genomes are junk mutations, so the population-mean success rate can
  # never reach the 0.8 advance threshold even with a perfect elite
  # (validation 2026-07-12: a 60-genome pool maxed 0.005 clears over 300
  # gens — the gate was structurally unreachable). Measuring only the
  # 5 highest-fitness genomes of each generation makes the gate answer
  # "can the BEST policies this stage produces clear it reliably", which
  # is the actual mastery signal — the same thing the vanilla_ppo trainer
  # measures with its single deployed policy. k=5 with episodes_per_genome
  # 2 yields ~10 elite episodes/gen, enough to clear the >=10-sample floor
  # in a single generation. Omit this key on other games to keep the
  # legacy whole-population gate.
  top_k_gate: 5
