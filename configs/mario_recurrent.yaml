name: "Super Mario Bros. Recurrent"
reward_id: mario
rom_hashes:
  - "811b027eaf99c2def7b933c5208636de"

# Vanilla PPO profile — the literature recipe (yumouwei/uvipen) that
# empirically clears SMB 1-1 in ~10M frames. Single policy, N parallel
# envs collecting rollouts of fixed length, batched GAE, K-epoch PPO
# update. NO GA, NO population, NO BC injection.
#
# Why a separate profile vs. ga_ppo / pure_ppo: the GA modes treat
# 30 workers as a population of distinct policies, mixing data from
# many policies into PPO's gradient. That mixing is the empirical
# reason our 2-day investigation of the hybrid never converged.
# Here all 30 workers run the SAME policy; their data is one big
# homogeneous batch.

description: >
  Vanilla PPO with N parallel envs. Matches the canonical
  yumouwei super-mario-bros-reinforcement-learning recipe.
  Expected: first clear in 100-300 iters (where each iter is
  one collect-then-update cycle, ~512 × 30 = 15,360 timesteps).
  Designed to be the apples-to-apples literature baseline.

frame_skip: 4
max_episode_steps: 2400

# CRITICAL: without a start state the emulator cold-boots to the TITLE
# SCREEN, where the attract-mode demo auto-plays 1-1 and IGNORES all
# controller input. Training there means every env runs the identical
# scripted demo (operMode stays 0), the agent never controls Mario, and
# the policy gets zero learning signal — entropy pins at ln(num_actions)
# and "progress" is just the demo walking into the first pit. This state
# drops the agent into live 1-1 gameplay (operMode 1) so inputs matter.
start_state_path: "roms/Super Mario Bros. (World)_start.state.bin"

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E
  float_state:     0x001D

reinforce:
  enabled: true
  encoder: smb_tiles
  # 4-frame stack on the 175-dim tile feature vector. Same as the
  # canonical profile; provides temporal context for jump timing.
  tile_frame_stack: 4
  # === TRAINER MODE ===
  # vanilla_ppo branches off `run()` BEFORE the GA loop. The
  # population/elite/mutation/BC machinery is bypassed entirely;
  # one policy, N envs, K-epoch PPO per iteration.
  trainer_mode: vanilla_ppo
  # Recurrent (GRU) tile policy — memory over the trajectory, the
  # diagnosis's lever for getting PAST the 1-2 / area-byte-3 exploration
  # wall (the stateless net masters 1-1 but plateaus there). The rollout
  # threads + done-masks the hidden state; the update replays full env
  # sequences with truncated BPTT. recurrent_env_minibatch = env
  # trajectories per BPTT minibatch (gradient batch).
  recurrent: true
  recurrent_env_minibatch: 8

  # === ROLLOUT KNOBS ===
  # Per-env rollout length. 1024 × 30 envs = 30,720 timesteps per
  # PPO update. Bumped from 512 so the natural 1-1 → 1-2 transition
  # fits inside a single rollout: empirically Mario touches the flag
  # around step 380, the cutscene runs ~150 steps, 1-2 gameplay
  # starts at step ~590, leaving 430+ steps of actual 1-2 frames
  # per iter for the policy to train on. With rollout_steps=512 the
  # rollout boundary cut off 30 steps BEFORE the 1-2 byte-flip and
  # the policy never saw a single 1-2 frame.
  rollout_steps: 1024
  # K-epoch SGD over the rollout. Trimmed 10 -> 4 for the recurrent
  # path: each epoch replays the full rollout through the GRU (BPTT), so
  # epochs are ~num_envs/env_mb x more expensive than the stateless path.
  steps: 4
  # Minibatch for the SGD pass. 256 × 60 minibatches per epoch
  # × 10 epochs = 600 gradient steps per iteration.
  ppo_minibatch_size: 256

  # === PPO HYPERPARAMETERS (yumouwei defaults) ===
  lr: 3.0e-4
  gamma: 0.9
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  grad_clip: 0.5
  # Huber on un-normalized GAE returns. MSE was the original PPO
  # choice but produces unbounded value gradients at our reward
  # scale; Huber is the structural fix.
  value_loss: huber

  # === RND INTRINSIC EXPLORATION (Burda 2018) ===
  # Canonical no-shaping SMB-PPO is exploration-limited: measured over
  # 80 iters the policy entropy pins at ~95% of ln(num_actions) and
  # settles on a single safe-failing behavior (walk right, die at the
  # first pit) with zero clears. RND's per-state novelty bonus keeps
  # advantages alive past that wall — exactly the "policy converges on
  # a safe-failing strategy because beyond-the-cliff is unrewarded
  # unknown territory" case it was designed for.
  #
  # intrinsic_coef scales the (normalized, ~unit-std) novelty bonus
  # folded into the per-step reward before GAE. loss_coef weights the
  # predictor MSE in the PPO loss. Set intrinsic_coef: 0.0 to run the
  # pure-canonical baseline arm of an A/B. Starting value 0.5 — tune
  # via the baseline-vs-RND comparison.
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0

  # === DISABLE EVERYTHING ELSE ===
  # All the GA / BC / population machinery is dead code in this
  # mode but set explicitly so a future reader doesn't think these
  # are mistakes.
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  # Vanilla PPO is single-policy; sticky-action's GA-exploration
  # benefit doesn't apply. Sticky also corrupts the recorded
  # log-probs vs the executed actions (the policy's intended
  # action is overwritten by RNG), which directly invalidates
  # PPO's importance ratio. Off.
  sticky_action_prob: 0.0
  # MPS path is slower than CPU for the 14k-param MLP (kernel
  # launch overhead dominates compute). Match canonical's CPU
  # pin.
  device: cpu
  panic_isolation: false
  async_pipeline: false

# Canonical-shape reward (yumouwei): forward + completion + death,
# no dense shaping. Vanilla PPO is supposed to converge from this
# reward alone — if it doesn't, the algorithm isn't working, not
# the reward.
reward_weights:
  forward_progress: 1.0
  score_delta:      0.025
  death_penalty:   -15.0
  completion_bonus: 50.0
  time_penalty:     0.0
  # All shaping disabled. Pure r = v + c + d.
  checkpoint_scale: 0.0
  jump_clear_bonus: 0.0
  survival_bonus:   0.0
  air_bonus:        0.0
  pit_fall_extra:   0.0
  enemy_death_extra: 0.0

action_space:
  - []                      # NOOP
  - ["right"]
  - ["right", "A"]
  - ["right", "B"]
  - ["right", "A", "B"]
  - ["A"]
  - ["left"]

curriculum:
  stages:
    - name: stage_1
      levels: ["1-1"]
      advance_threshold: 0.5
      min_episodes: 200
