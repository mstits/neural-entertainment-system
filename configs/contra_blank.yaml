# Blank-slate Contra show profile — fresh stem so the show cannot
# lap runs/live_show/contra/ and must search live. See
# smb_blank_slate.yaml for why the filename is the mechanism.

name: "Contra"
reward_id: contra
# Live stage-1 gameplay state (scripts/capture_start_state.py). Without
# it the emulator cold-boots to the title-screen demo, which ignores
# input — training there gives zero learning signal.
start_state_path: "roms/Contra (USA)_start.state.bin"
rom_hashes:
  - "7bdad8b4a7a56a634c9649d20bd3011b"  # Contra (U) — NesDev canonical dump

# Action game — needs responsive control, so frame_skip 4 (NOT the
# trainer's default 16, which is far too coarse to dodge bullets).
frame_skip: 4
max_episode_steps: 2000

description: >
  Training profile for Contra (NES, 1988). Side-scrolling run-and-gun.
  Reward emphasizes forward progress + enemy kills + weapon pickups. Contra
  is brutally unforgiving (one-hit deaths), so death_penalty matters a lot
  and episodes end fast.

ram_mapping:
  # PROVENANCE. This block's former header claimed its addresses were
  # "emulator-verified during the win-verification pass". No Contra stage
  # transition and no Contra boss defeat has ever been witnessed in this
  # repo, so that pass cannot have verified anything that depends on one:
  # runs/clear_gap/contra_blank/SUMMARY.json censuses 6 chained archives
  # (52,539-66,252 cells each) with solutions_banked_ever 0 and distinct
  # area values [0] in every run. The two entries that asserted clear /
  # boss-death semantics on that basis now sit in
  # `quarantined_external_knowledge` below. What is left is what our own
  # differential probes measured, including where they measured nothing.
  player_x:        0x0334   # on-screen sprite X. NOT 0x0031: all this repo
                            # knows about 0x0031 is that it reads constant 0
                            # through live gameplay
                            # (docs/receipts/ram_verify/contra.json). The
                            # "whole-game completion COUNT" identification
                            # this comment used to carry was never measured
                            # here — a constant-0 byte is consistent with
                            # anything — and is retracted.
  player_y:        0x0021   # MEASURED DEAD, kept so it is not re-adopted by
                            # accident: docs/receipts/ram_verify/contra.json
                            # reads it 0 throughout live gameplay ("NOT
                            # usable"), and it does not move under a jump
                            # probe. The receipted vertical observable is
                            # 0x031A (ballistic arc under scripted jumps),
                            # which is what solve: uses. "vertical" was an
                            # unverified label; it is retracted.
  player_state:    0x0090   # CONTESTED — do not rely on this for death.
                            # The "0=falling, 1=normal, 2=dead" encoding has
                            # no positive receipt here, and this profile's
                            # own solve: block refutes it: $0090 sits in
                            # {1,2} for 89.5-99.1% of ordinary forward /
                            # NOOP / reverse play. rewards.rs records it
                            # free-running a 0->1->2 animation cycle even
                            # after lives hits 0. The verified death signal
                            # on this profile is the lives decrement
                            # (0x0032). NOTE for scripts/hazard_collect.py:
                            # its resolve_death_addr() reads this key
                            # generically and then tests SMB's death codes
                            # (6, 11), which this byte's range can never
                            # match — do not point that tool at Contra.
  # Scroll / world position. $0064 is a within-stage SCREEN counter and a
  # progress proxy, NOT a clear signal — that much is receipted
  # (docs/receipts/ram_verify/contra.json: increments 0..7 during a single
  # hold-right rollout of stage 1). Whether it RESETS at a stage boundary
  # is unknown here: no stage boundary has ever been crossed on this ROM in
  # this repo, so the former "RESETS to 0 each stage" clause described
  # something nobody measured and is retracted.
  screen_number:   0x0064
  # Lives, score
  lives:           0x0032   # remaining lives (starts at 2; 0 = last life).
                            # VERIFIED: decrements on deaths during random
                            # rollouts (docs/receipts/ram_verify/contra.json);
                            # independently re-derived from scratch by
                            # scripts/discover_observables.py.
  score_start:     0x07E2   # 6-digit BCD score
  score_end:       0x07E7
  weapon:          0x00AA   # changes on weapon pickup; nonzero == holding a
                            # non-default weapon, which is the only property
                            # the weapon_upgrade reward actually uses. The
                            # specific value-to-weapon mapping this comment
                            # used to assert (0=default, 1=M, 2=F, ...) has
                            # no receipt in this repo, and
                            # docs/research/CONTRA_ROUTE_A_2026-08-27.md
                            # deliberately declines to say what any value of
                            # $00AA corresponds to. Retracted as unmeasured.

# --------------------------------------------------------------------------
# Retracted 2026-08-27 — see docs/research/UNWITNESSED_SEMANTICS_2026-08-27.md
# Both entries below asserted semantics for an event that has never been
# witnessed on this ROM in this repo, so neither could have been measured
# here. String values on purpose: `int(v)` must raise, so no consumer can
# fold these addresses back into a set (the exclusion-fold inversion closed
# for Zelda in 222ae25). tests/test_purity_quarantine_sweep.py enforces that
# no profile on this ROM re-adopts them into a live `ram_mapping`.
quarantined_external_knowledge:
  applies_to_rom: "roms/Contra (USA).nes"
  provenance: >-
    Introduced by the 2026-07-08 "win-verification corrections" pass
    (5c9f195), which cites a witnessed result only for SMB. No
    Contra-specific witness exists for either claim, and no source for
    them is recorded — they are unattributed external material.
  status: UNVERIFIED_EXTERNAL
  rediscovery_rule: >
    Dead until this project witnesses the event the claim is about and
    then measures the byte across it. For q_current_level that means a
    real Contra stage transition observed on our own rendered frames,
    with the byte logged before and after; for q_boss_defeated it means a
    boss kill that SUSTAINS — docs/research/CONTRA_WALL_2026-08-27.md row
    A2 already falsified the obvious reading (81,244 alive steps, 830
    zero-hits, 15 replay-verified, 0/15 sustaining >=20 zero steps; HP
    refills within 1-2 steps once fire stops, so joint-zero is a
    live-suppression multiplexing artifact, not a kill). A byte that
    passes enters a NEW ram_mapping entry carrying its own receipt; these
    entries are never promoted in place.
  q_current_level:  "0x0030"  # claimed: stage index 0-7, increments on a real
                              # stage clear. Never observed to change: churn
                              # 0.0/1k, net 0 under hold-right, across every
                              # probe run on it (runs/ram_verify/contra.json).
  q_boss_defeated:  "0x003B"  # claimed: 0->1 when the current stage boss dies.
                              # Never observed to change (churn 0.0/1k), and no
                              # boss has ever been defeated on this ROM here.

reward_weights:
  # PROGRESS must dominate. The prior weights made score_delta ~71x
  # larger than forward (score-farm fixed point: stand and shoot for
  # points instead of advancing). Rebalanced so advancing the stage is
  # the gradient the policy climbs.
  forward_progress: 2.0     # per unit of screen/x gain (was 0.5)
  score_delta:      0.0005  # minor flavor only (was 0.01 — caused 71x dominance)
  screen_progress_bonus: 30.0  # milestone on each NEW max screen (gated; can't be farmed)
  completion_bonus: 2000.0  # terminal stage-1 clear reward (fires at clear_screen)
  # clear_screen: <unset → disabled>. Read vanilla_ppo_max_screen off a
  # run to find the real stage-1-end screen, then set it to arm the win.
  weapon_upgrade:   5.0     # getting a better weapon
  enemy_kill:       1.5     # NOTE: not wired into ContraReward (score_delta is the kill proxy)
  death_penalty:   -25.0
  time_penalty:    -0.005

action_space:
  - []                        # NOOP
  - ["right"]
  - ["left"]
  - ["A"]                     # jump
  - ["B"]                     # fire
  - ["right", "B"]            # run-fire
  - ["right", "A"]            # right-jump
  - ["right", "A", "B"]       # run-jump-fire
  - ["up", "B"]               # shoot up
  - ["down"]
  # Prone fire: the base-wall core sits recessed at ground level behind a
  # ledge lip (strike-film receipt 2026-07-31); the original set had no
  # down+B so the solver structurally could not fire prone. Generic
  # controller completeness, same rationale as CV's plain "up".
  - ["down", "B"]                  # prone

curriculum:
  stage_1: ["*"]
  stage_2: ["*"]
  stage_3: ["*"]
  stage_4: ["*"]

reinforce:
  enabled: true
  # === UNIFIED vanilla_ppo (Phase 2 — first non-SMB game on the stack) ===
  trainer_mode: vanilla_ppo
  # Contra has no RAM tile decoder (only SMB does), so it uses the
  # universal pixel CNN path: 4-stacked 84x84 grayscale frames -> Nature
  # DQN encoder -> actor/critic heads. The SMB area-byte save-state
  # curriculum is gated off for non-Mario games (the trainer detects
  # this by name); Contra trains single-stage from its start state.
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  # Skip-per-pixel batched PPU via clean-scanline history (headless-only;
  # a live frame sink keeps exact rendering). Training-quality accepted:
  # rare 1-frame-stale rows are invisible to the 4-frame-stacked policy.
  batched_render: replace
  # Production fast path: drop the per-worker-step catch_unwind wrap.
  panic_isolation: false
  device: mps            # CNN is ~4.7x faster on MPS than CPU (benched); switch to cpu if MPS misbehaves

  # === ROLLOUT ===
  rollout_steps: 1024
  steps: 10              # K PPO epochs / iter
  ppo_minibatch_size: 256

  # === PPO HYPERPARAMETERS ===
  lr: 2.5e-4
  gamma: 0.99            # Contra is denser/longer-horizon than SMB
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02     # higher than default — Contra rewards are sparse
  grad_clip: 0.5
  value_loss: huber

  # === RND INTRINSIC EXPLORATION ===
  # Contra is one-hit-death + sparse-reward — exactly the hard-exploration
  # regime RND targets. Set rnd_intrinsic_coef: 0.0 for a pure baseline.
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0

# Solver adapter (breadth sprint 2026-07-31). Addresses are the June
# training-track map (receipted in-config at contra_screen9.yaml; x/screen/
# state/lives validated in production runs 2026-06). progress = player_x +
# screen_number<<8 — monotone through a stage's screens.
# level_key deliberately EMPTY for the coverage baseline: no stage byte is
# receipted yet (discover it from deep arrival states, then chain).
solve:
  rom: "roms/Contra (USA).nes"
  # progress = fine scroll + screen<<8 (receipts: docs/receipts/ram_verify/
  # contra.json — the June map's 0x0031/0x0021 read 0 in live play and
  # collapsed the archive to screen granularity; 0x0065/0x031A discovered
  # by differential analysis 2026-07-31).
  #
  # RE-VERIFIED 2026-08-10 by a fresh run of the 3-probe protocol
  # (scripts/discover_observables.py, forward-hold / NOOP-hold /
  # reverse-hold from this profile's own start state; receipt:
  # docs/receipts/games/contra_reentry_2026-08-10.md). $0065|$0064<<8 is
  # still the recommended pair and clears BOTH gates on today's core:
  # Gate 1 rises under forward (net +635, monotone fraction 1.00), flat
  # under NOOP (net 0), wrap-coupled 3x; Gate 2 no camera clamp
  # (rebases 0, within-room cap false). No amendment needed — the byte
  # pair below is what the probe would emit from scratch.
  progress: {lo: 0x0065, hi: 0x0064, smooth: hampel}
  # NOT ADOPTED, 2026-08-10 (both would change the cell key, so both are
  # behaviour changes, and both would break comparability with the
  # receipted base wall at max_gx_in_max_area == 3072 that the re-entry
  # gate is measured against — see the receipt's "deliberately not
  # adopted" section):
  #   * area: 0x0064 — the probe names $0064 the room/screen counter, but
  #     it is already this profile's progress PAGE byte, so wiring it as
  #     `area` adds no information to the key while re-basing max_area /
  #     max_gx_in_max_area telemetry mid-ledger.
  #   * y: 0x0010 — the probe's top-scoring ballistic candidate (score
  #     90.8) outranks the wired $031A (score 57.9, rank 3 of 6). Both
  #     pass; the ranking is a heuristic, and swapping y re-bands every
  #     cell. Owed a controlled A/B, not a silent swap.
  y: 0x031A
  level_key: []
  # WIN-CONDITION: level_key is empty (coverage baseline — Contra has no
  # clean stage counter), so without this a "clear" can never fire. The
  # multi-modal confluence detector (clear_detect.StreamingConfluenceDetector)
  # votes on two purely-RAM-derivable signals — a timer->score tally cadence
  # and a position-reset-with-entity-wipe (a fresh room/level loading in) —
  # and only fires when BOTH agree in the same rolling window, so an ordinary
  # in-level score tick or scroll can't fake it. Untried on a real Contra
  # clear to date; if it never fires, raise stride/window before assuming
  # the signals don't apply to this game's actual level-transition RAM
  # shape.
  clear: {mode: confluence}
  # RE-VERIFIED 2026-08-10: the 3-probe protocol independently re-derives
  # $0032 as the lives byte (start 2, decrements on death, churn 1.11) —
  # top-ranked of 4 candidates. This is the ONLY death signal actually
  # carrying the adapter, see below.
  lives: 0x0032
  # UNRESOLVED, MEASURED INERT — deliberately left exactly as-is.
  # $002C never once entered {1, 2} across all four probes on 2026-08-10
  # (forward 325 steps, NOOP 240, reverse 900, advance-with-deaths 1800;
  # observed values 3/4/10, frac_in{1,2} = 0.000 in every probe). So
  # GenericGame.is_dead's second clause is measurably a no-op here: over
  # the advance probe it added +0.000 to the lives-only death rate.
  # Harmless (zero false positives) but it detects nothing.
  # The June "correction" to $0090 is REFUTED by the same probe and must
  # NOT be pasted in: $0090 sits in {1, 2} for 89.5% / 96.7% / 99.1% of
  # ordinary forward / NOOP / reverse play, and wiring it here would make
  # is_dead true on 99.6% of advance-probe steps versus 89.3% for
  # lives alone — it would truncate essentially every trajectory.
  # Neither byte is a player-state observable on the evidence we have.
  # Rediscovery rule: a death byte enters here only after a probe shows
  # it ~never in its death set while alive AND reliably in it at the
  # lives-decrement events. Until then death detection is lives-only.
  player_state: 0x002C
  death_states: [1, 2]
  # Enemy object array (provisional, 2026-07-31): state bytes at
  # $0368 + k*$10 span the stride-$20 object array plus its interleaved
  # phase; fire-vs-idle probe receipt (20 wall/pre-wall cells x 100
  # steps): nonzero->zero transitions 36-44 under fire vs 5-7 idle per
  # slot byte. Feeds --kill-key so the base-wall fight (fixed camera,
  # progress-invisible: frontier pinned at 3072 for 45 min in the v2
  # coverage baseline) gets a searchable kill dimension.
  entity_slots: {lo: 0x0311, hi: 0x0315}
  # Local kill counting (see solver comment): cumulative kk saturates on
  # run-and-gun stages; local kk counts kills since the last progress
  # high-water mark = the fight itself at a fixed-camera wall.
  kill_key_local: true
  # Type-conditioned wall health (causal receipts 2026-07-31): entity
  # types at $0311-$0314, per-slot HP at $04BF-$04C2; wall hardware =
  # types 54/68 (guns) + 55/56 (sensor/core), receipted by fire test
  # (type 54 hp 3->0, type ->0 on destruction) and wall-vs-pre-wall
  # corpus (54/55/68 present in 50-101 of 600 wall cells, <=2 of 600
  # pre-wall). Soldiers (33/44/45) share the slots — hence typed.
  # Core open-window phase bit (pixel-phase mining receipt
  # runs/breadth_contra/pixel_phase_receipt.json: exposed palette when
  # $001A % 16 in 7..14; MI 0.53 vs 0.006 null, accuracy 0.997).
  # Keyed into cells so window-timed fire trajectories are archivable.
  state_sig:
    - {addr: 0x001A, mod: 16, match: [7, 8, 9, 10, 11, 12, 13, 14]}
  # v2 (slot-identity receipt runs/breadth_contra/slot_identity_receipt.json):
  # keyed on the STABLE per-slot identity array $058F+k (constancy 0.97-1.0,
  # class TVD 0.909) instead of the cycling animation-phase codes at $0311+k
  # (constancy 0.007 within guns — the receipted phase-aliasing source).
  # Identity values: 5/48 = wall guns, 50 = core/sensor; soldiers = 1;
  # 0 = empty-slot reset (deliberately excluded — counting it would alias
  # empty slots as dead hardware). Slots are time-multiplexed (HP flickers
  # 0 between phase cycles, median lifetime 20 steps) — the hp sum is
  # therefore a live-visible-hardware reading, not a persistent pool.
  boss_typed:
    type_addrs: [0x058F, 0x0590, 0x0591, 0x0592]
    hp_addrs: [0x04BF, 0x04C0, 0x04C1, 0x04C2]
    types: [5, 48, 50]
    start: 16
  # Sustained-fire holds: stochastic sampling rarely emits the long
  # aimed bursts the base fight wants (same generic mechanism as CV
  # stair-mount up-holds).
  hold_macros:
    - {buttons: ["B", "right"], steps: 16, p: 0.03}
    - {buttons: ["B"], steps: 12, p: 0.01}
