# Phase-B: ONE generalist tile policy over multiple World-1 level archetypes,
# trained with Prioritized Level Replay (difficulty-weighted level sampling).
#
# This is the go-forward generalist direction (NOT a per-level specialist /
# router). It reuses the recipe that PASSED Phase-A honestly:
#   tile encoder (smb_tiles_pos), generic reward, sticky-0.25 in TRAINING,
#   entropy_floor OFF (0.0), entropy_coef 0.005 — the consolidation fix that
#   let iter-130 clear 1-1 at 63-67% cold-greedy under the full Machado
#   protocol (sticky-0.25 + jitter-16, warp 0). See
#   checkpoints/mario_1_1_tile_gate_v2_consolidate/PHASEA_RESULT.md.
#
# LEVEL SET (verified clean level ENTRANCES — no mid-level crutch):
#   train : 1-1 (overworld), 1-2 (underground), 1-4 (castle)
#   holdout: 1-3 (athletic)  — NEVER trained on; used only to measure transfer.
# 2-1's banked state is mid-level (x=1439), so it is EXCLUDED until a true
# 2-1 entrance is captured. This keeps every training start at a level entry,
# consistent with the "no save-state crutch" rule (PLR selects WHICH level,
# never skips a level's hard first half).
#
# plr_levels drives the per-env iter-boundary warm-start: each env is assigned
# a level sampled by inverse-recent-success weight (train on what we're worst
# at), then warm-started from that level's clean entry state. The reward fn
# already attributes per-env; per-env outcomes feed the PLR weights.
#
# NOTE: activating plr_levels requires the PLR-routing adaptation of the
# _run_vanilla_ppo iter-boundary warm-start loop (the fixed-set, no-advance,
# no-mid-capture variant of the existing SMB save-state-curriculum plumbing).
# That trainer change is the immediately-next build; this file is its spec.

name: Mario World-1 generalist (PLR, tile)
reward_id: mario
rom_path: "roms/Super Mario Bros. (World).nes"
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
frame_skip: 4
# The cold-boot level (1-1) entrance. reset_all() lands every env here each
# iter; PLR then loads index>0 envs to their level's entry state over the top.
# Index-0 (1-1) envs auto-reset from this same blob on death.
start_state_path: "roms/Super Mario Bros. (World)_start.state.bin"
description: >
  Single generalist tile policy over three World-1 archetypes (overworld /
  underground / castle) via Prioritized Level Replay, holding out 1-3 to
  measure transfer. Model-free PPO, generic reward, sticky-0.25 training.

ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29

reward_weights:
  forward_progress: 1.0
  time_penalty: -0.01
  death_penalty: -15.0
  completion_bonus: 50.0
  score_delta: 0.0
  air_bonus: 0.0
  survival_bonus: 0.0
  jump_clear_bonus: 0.0
  checkpoint_scale: 0.0

action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A

# Prioritized Level Replay level set. Each entry: a level label + a clean
# entry-state file. `null` state == cold power-on boot (the true 1-1 entrance).
# `holdout: true` levels are NEVER sampled for training; the winner-eval probes
# them to report transfer.
plr_levels:
  - level: "1-1"
    state: null   # power-on boot = clean 1-1 entrance (x=0)
  - level: "1-2"
    state: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_03.state"  # x=0
  - level: "1-4"
    state: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_10.state"  # x=45
  - level: "1-3"
    state: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_05.state"  # x=0
    holdout: true

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles_pos
  preserve_elite_diversity: true
  freeze_pre_ppo_elite: true
  episodes_per_genome: 2
  symlog_rewards: true
  value_loss: huber
  value_coef: 0.25
  bc_epochs: 0            # generalist learns from scratch; no demo anchor
  warmup_gens_ga_only: 10
  steps: 10
  lr: 0.0003
  async_pipeline: false
  device: cpu
  panic_isolation: false
  entropy_coef: 0.005     # the consolidation recipe that passed Phase-A
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  sticky_action_prob: 0.25
  bc_replay_enabled: false
  preprocess_f16: false
  smb_curriculum: false   # PLR level routing replaces the staged curriculum
  plr_enabled: true       # activate plr_levels routing
  # v1 (floor 0.0) collapsed: entropy free-fell 1.77 -> 0.14 by iter 250,
  # return peaked at iter 100 then regressed, cold-greedy never left 0. The
  # 3-level problem is harder than single-level Phase-A, so the low base coef
  # over-consolidates before any level clears. floor 0.3 arms the coef
  # controller to arrest the collapse (bump coef when entropy < floor), while
  # staying below Phase-A #1's over-holding 0.5 (which blocked greedy
  # consolidation). If clears appear but stay stochastic, a phase-2 floor
  # release consolidates them greedy.
  entropy_floor: 0.3
  entropy_coef_max: 0.05
  num_envs: 60

ga_params:
  mutation_rate: 0.8
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  stale_gens_before_restart: 50
  restart_fraction: 0.5

max_episode_steps: 2400
