name: "Mega Man 3 (USA)"

rom_path: "roms/Mega Man 3 (USA).nes"
rom_hashes:
  - "75b924155cafee335c9ea7a01bfc8efb"
start_state_path: "roms/Mega Man 3 (USA)_start.state.bin"

description: |
  Mega Man 3 (NES, 1990), onboarding profile (wave 5, 2026-08-25).
  Structure copied from configs/mega_man_usa.yaml (MM1 wave-4
  adjacency); no game knowledge encoded -- generic controller,
  odometer progress source.

  Start state: roms/Mega Man 3 (USA)_start.state.bin, minted this
  session by a SCRIPTED, frame-timed navigation (receipt
  runs/onboard_wave5/mint_mega_man_3.json), not the generic blind
  masher alone. The generic house masher (capture_start_state.py,
  pure undirected START/A pulses) genuinely stalls forever on MM3's
  stage-select screen at both --max-frames 2000 and --max-frames
  4000 -- confirmed by rendered frames identical at f=1800 and
  f=3600. This IS the directional-cursor-screen trap: the 3x3
  stage-select grid's CENTER cell is a static Mega Man
  portrait/"PUSH START" prompt, not a selectable robot-master box,
  so an undirected masher can never leave it (it just re-triggers
  the same idle prompt). One scripted RIGHT tap moves the cursor
  onto an adjacent box (landed on Top Man); START then commits it.
  Visually confirmed at the capture frame: live Top Man stage
  gameplay (conveyor-block room, Mega Man sprite, two HUD energy
  meters) -- not a menu, cursor, or text screen. Liveness also
  confirmed by input-divergence probe from a fresh reload:
  right_vs_left_120f=329, right_vs_noop_120f=337,
  left_vs_noop_120f=59, a_vs_noop_120f=30 (2KB RAM range) --
  directional input moves the player and RIGHT/LEFT diverge from
  each other and from NOOP.

frame_skip: 4

# A GENERIC controller. Tuned action sets encode another game's tactics.
action_space:
  - []
  - ["right"]
  - ["left"]
  - ["up"]
  - ["down"]
  - ["A"]
  - ["B"]
  - ["right", "A"]
  - ["right", "B"]
  - ["left", "A"]
  - ["left", "B"]
  - ["right", "A", "B"]
  - ["down", "B"]
  - ["up", "B"]

solve:
  rom: "roms/Mega Man 3 (USA).nes"
  # Odometer gate (runs/onboard_wave5/gate_mega_man_3_right.json):
  # --forward right, 1200 steps, axis x, range 0..551, 142 distinct,
  # oam_churn 1122/1199 -> PASS "SIGNAL SOUND -- still advancing". No
  # RAM-derived progress byte was isolated by discover_observables.py
  # (room counter: none, progress candidates: none -- gate/saturation
  # checks did not clear one), so the odometer is the only forward-
  # progress signal and drives the search (same shape as
  # configs/mega_man_usa.yaml and configs/ninja_gaiden_ii.yaml).
  progress: {source: odometer, axis: x}
  # y / lives from scripts/discover_observables.py's 3-probe protocol
  # against this exact start state (receipt
  # runs/onboard_wave5/discover_mega_man_3.json). No RAM map, no
  # disassembly, no walkthrough.
  #   $0012  y candidate (jump/ballistic signature), sole candidate found.
  #
  # LIVES RE-NOMINATED 2026-08-26 (false-death-fanout sweep, tool-level fix
  # commit 158ec74): the original nomination, $001A, read 0 at this exact
  # root state -- confirmed directly (env.get_ram(0x001A) == 0 on the start
  # state). $001A's "reaches empty" / "spends its stock" gates were
  # structurally vacuous at start==0 (fixed by 158ec74), so a byte that
  # never held a real count could still outrank one that did. A death
  # decrement on a 0-start byte underflows 0->255, which GenericGame's
  # wrap-aware is_dead reads as an instant death every episode -- 10 of 11
  # profiles affected by this had no player_state fallback, so detection
  # was not degraded, it was inverted. Re-running discover_observables.py
  # against this profile's real ROM + start state with the fix live
  # demoted $001A out of the candidate list entirely and top-ranked
  # $0029 instead: starts_nonzero=true, root value 1, reaches_empty=true,
  # spends_its_stock=true, moves_while_idle=false (agreed 5/5 driven death
  # runs). Independently verified here: env.get_ram(0x0029) == 1 at root,
  # and flat at 1 across a 150-step (600-frame) idle no-op rollout -- does
  # not free-run, does not move while idle. Receipt:
  # runs/false_death_fanout/mega_man_3/discover_mega_man_3_postfix.json.
  y: 0x0012
  lives: 0x0029
  level_key: []   # coverage baseline; no stage/room-advance byte captured yet
