# Robust learned 1-2: the research-brief pipeline realized on our stack.
#   - RECURRENT tile policy (GRU) — handles 1-2's moving-elevator POMDP that a
#     feedforward MLP can't (TileRecurrentPolicyNetwork, hidden 128 / gru 64,
#     ~112k params) via reinforce.recurrent + the tile-width knobs.
#   - WAVEFRONT PBRS reward — dense, non-cheating distance-to-goal from the
#     Go-Explore solution traces (shortens the effective horizon so PPO isn't
#     starved over ~787 steps).
#   - DARS demo-anchor (DQfD) — 103k noise-augmented RECOVERY (obs,action) pairs
#     so the policy learns to return to the path from drifted states; coef
#     1.0 -> 0.02 realizes the staged "imitate then wean" schedule.
#   - sticky-0.25 in training (match the honest gate) + entropy floor.
# GATE: cold sticky-0.25 + jitter-16 from the 1-2 entrance >= 60%.

name: Mario 1-2 robust recurrent (wavefront + DARS)
reward_id: mario
rom_path: "roms/Super Mario Bros. (World).nes"
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
frame_skip: 4
start_state_path: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_03.state"
description: >
  Recurrent tile policy for SMB 1-2 with non-cheating wavefront PBRS reward and
  DARS recovery demo-anchor, sticky-trained. Honest gate: cold sticky+jitter
  clear from the 1-2 entrance.

ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29

reward_weights:
  forward_progress: 1.0
  time_penalty: -0.01
  death_penalty: -15.0
  completion_bonus: 50.0
  score_delta: 0.0
  air_bonus: 0.0
  survival_bonus: 0.0
  jump_clear_bonus: 0.0
  checkpoint_scale: 0.0

action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles_pos
  recurrent: true              # GRU policy for the moving-platform POMDP
  recurrent_env_minibatch: 8
  tile_hidden_dim: 128         # -> TileRecurrentPolicyNetwork hidden_dim
  tile_trunk_dim: 64           # -> gru_dim
  preserve_elite_diversity: true
  freeze_pre_ppo_elite: true
  episodes_per_genome: 2
  symlog_rewards: true
  value_loss: huber
  value_coef: 0.25
  gae_lambda: 0.95
  gamma: 0.99
  bc_epochs: 0
  warmup_gens_ga_only: 10
  steps: 10
  lr: 0.0003
  ppo_clip_eps: 0.2
  async_pipeline: false
  device: cpu
  panic_isolation: false
  entropy_coef: 0.01
  entropy_floor: 0.1
  entropy_coef_max: 0.05
  rnd_intrinsic_coef: 0.0      # wavefront supplies the dense signal instead
  rnd_loss_coef: 0.0
  sticky_action_prob: 0.25
  # Non-cheating dense distance-to-goal shaping (PBRS, search-derived).
  wavefront_reward:
    enabled: true
    dmap: "checkpoints/wavefront/mario_1_2_dmap.pkl"
    alpha: 0.15
    gamma: 0.99
  # DARS recovery demos (search provenance, allowlisted).
  demo_anchor_enabled: true
  demo_anchor_paths:
  - "runs/dars_1_2/recovery_demos.npz"
  demo_anchor_coef: 1.0
  demo_anchor_coef_final: 0.02
  bc_replay_enabled: false
  preprocess_f16: false
  smb_curriculum: false
  num_envs: 48

ga_params:
  mutation_rate: 0.8
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  stale_gens_before_restart: 50
  restart_fraction: 0.5

max_episode_steps: 2400
