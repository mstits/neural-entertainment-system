name: "1942"

rom_path: "roms/1942 (Japan, USA).nes"
rom_hashes:
  - "4f90905fd77c1c9456bd5dfe1ceddc34"
start_state_path: "roms/1942 (Japan, USA)_start.state.bin"

description: |
  1942 (NES), minimal onboarding profile. Generic controller, odometer
  progress candidate; nothing inherited from another game's tactics.

frame_skip: 4

action_space:
  - []
  - ["right"]
  - ["left"]
  - ["up"]
  - ["down"]
  - ["A"]
  - ["B"]
  - ["right", "A"]
  - ["right", "B"]
  - ["left", "A"]
  - ["left", "B"]
  - ["right", "A", "B"]
  - ["down", "B"]
  - ["up", "B"]

solve:
  rom: "roms/1942 (Japan, USA).nes"
  # Gate trace 2026-08-24: dominant axis is y (x=0, y=787 over 1200
  # steps) — vertical scroller. runs/onboard_wave2/gate_1942.json
  # Re-confirmed onboard wave 3 with forward=right/up/A, all three
  # SIGNAL SOUND with the same "flat tail" behaviour finding —
  # runs/onboard_wave3/gate_1942_{right,up,A}.json.
  #
  # SIGN (onboard wave 3, 2026-08-25): the gate script re-bases its
  # trace to its own observed minimum, so its "min 0 / max 787" does
  # NOT tell you which way the raw counter runs. Measured directly
  # (deepest-cell + root-state hold diagnostic,
  # runs/onboard_wave3/diag_1942_{deepest,root,lifecycle_noop}.log):
  # 1942's raw y odometer counts DOWN while the plane flies forward —
  # every one of noop/right/left/up/down/A/B held from the verified-
  # live start state drove raw y strictly negative. go_explore_solve's
  # `_xram` clamps negative reads to 0 (every other odometer profile is
  # a right-scroller, so "forward" was always the increasing
  # direction) — the unsigned read pinned the smoke's progress column
  # at 0 for the full run (7 cells, best_score 0 throughout,
  # runs/onboard_wave3/smoke_1942/archive.stats.json). Added a signed
  # `axis: -y` (go_explore_solve.py 2026-08-25) to flip the sign before
  # the clamp; re-smoked at runs/onboard_wave3/smoke_1942_v2 — 7 cells
  # -> 106 cells, best_score 0 -> 764, frontier 65 still open, growing
  # through the full 4-minute budget. SOUND_ADVANCING.
  progress: {source: odometer, axis: -y}
  # discover_observables.py --forward up, 5/5-run agreement
  # (runs/onboard_wave3/discover_1942_up.json). $0083 is the
  # jump/ballistic-signature candidate it reports for `y`.
  #
  # RE-NOMINATED 2026-08-26 (false-death fanout sweep, tool-level fix
  # commit 158ec74): the old `lives: 0x00C9` reads 0 at this profile's
  # own root state (confirmed directly: fresh Pool + load_worker_state,
  # ram[0x00C9] == 0). Both of lives_from_death_drives' acceptance
  # gates are structurally vacuous at start == 0, so 0x00C9 was
  # nominated for free rather than earned; with the fix it now carries
  # `starts_nonzero: false` and is demoted to rank 3 of 5 candidates
  # (runs/false_death_fanout/1942/discover_1942_up.json). The new
  # top-ranked candidate, $0524, reads 1 at root (starts_nonzero:
  # true), is flat across 300 idle NOOP steps (does not free-run, does
  # not move while idle), and under a held-`up` 700-step rollout steps
  # down 1 -> 0 at t=65 then refills 0 -> 1 at t=471 before dropping
  # again at t=479 — real stock-with-continue behaviour, not debris.
  # Re-ranked candidate table + a --workers 2 --minutes 1 before/after
  # go_explore_solve smoke are both under runs/false_death_fanout/1942/.
  # Neither `y` nor `lives` is the progress observable (that stays the
  # certified odometer above) — these feed is_dead / cell_fn only.
  y: 0x0083
  lives: 0x0524
  clear:
    # Odometer-cohort scene_cut wiring, 2026-08-26 (Finding 1: odo_blank is a
    # real transition counter). Eligibility only -- no `mode` is set here, so
    # is_clear()/solutions is byte-identical to before this block existed;
    # this only moves scene_cut from DEAD to ALIVE in clear_reachability's
    # quorum table. Measured, not guessed -- full survey + per-profile numbers:
    # docs/receipts/clear_control/odometer_cohort_scene_cut_survey_2026-08-26.json
    # odo_blank fired (110 runs) and odometer_scene stayed clean (0 runs) over
    # the same budget -- architectural floor gate (scene_min=blank_min=1) is the
    # smallest integer above a null that measures zero by construction (neither
    # counter can move without an actual re-anchor event).
    signals:
      scene_cut: {scene_min: 1, blank_min: 1, kind: [pan, warp, fade], death_debounce: 3}

  # Empty until a real clear is captured; guessing it is authored
  # semantics. The solver can search but cannot yet recognise winning.
  level_key: []
