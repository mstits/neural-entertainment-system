#  3. MISSION-CLEAR address to FINAL-VERIFY. 0x0030 is verified rock-stable in
#     Mission 1 but its increment was not observed (a scripted bot can't clear a
#     mission). The win predicate never false-positives (safe under-trigger); do
#     ONE assisted full-Mission-1 clear to confirm 0x0030 (or set mission_addr to
#     the true counter). Everything else (progress, combat, health, death, game
#     over) is fully verified and trains today.
# ============================================================================