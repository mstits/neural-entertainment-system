# ==========================================================================
# SMB ONE-SHOT — LEVEL-SCOPED CONSOLIDATION ("weld ONE level")  [tile scout]
# ==========================================================================
# Whole-distribution consolidation collapsed the cold chain TWICE on the tile
# scout (CONSOLIDATE ABORT #1/#2). Cold PER-LEVEL greedy competence, by
# contrast, is proven achievable. This profile welds exactly ONE level at a
# time under a hard cold no-regression gate:
#
#   * train 100% of the pool inside the TARGET level's rungs (its entry + its
#     x-buckets from the existing sub-stage ladder) — no frontier/spread, no
#     Go-Explore, no curriculum advance (the ladder is READ-ONLY here);
#   * every probe, cold-eval the TARGET from its entry AND every already-welded
#     PROTECT level from its entry (eval_game.py --sequential --level-clear:
#     greedy from each level's entry state, "cleared the level it started in");
#   * HARD GATE: any protect level's greedy clear rate below its mode-start
#     baseline -> immediate rollback to the last accepted snapshot + entropy
#     freeze for a cooldown. Protect held + target improved -> snapshot-accept
#     (best_<level>.pt). Target clear rate >= accept_bar sustained accept_probes
#     probes -> write best_<level>.pt + a DONE marker + exit cleanly.
#
# A driver chains levels by running this profile once per level: 1-1 (no
# protect) -> 1-2 (protect 1-1) -> 1-3 (protect 1-1,1-2) -> 1-4 (protect the
# rest), each waiting on the previous level's consolidate_<level>.DONE marker.
#
# Tile SCOUT (encoder: smb_tiles) validates the plumbing ~4x faster; the pixel
# deliverable swaps encoder: nature_dqn and num_envs: 24 only. The gate,
# ladder, and per-level predicate are all encoder-agnostic.

name: "Super Mario Bros. (one-shot, tiles)"
reward_id: mario
rom_hashes:
  - "811b027eaf99c2def7b933c5208636de"

description: >
  Tile-scout vanilla PPO that welds ONE SMB level at a time under a cold
  no-regression gate. 100% of the pool trains the target level's rungs; every
  probe cold-evals the target and each protect level from its entry state and
  rolls back on any protect regression. Terminates on a sustained greedy clear
  bar with a DONE marker so a driver can chain 1-1 -> 1-2 -> 1-3 -> 1-4.

frame_skip: 4
max_episode_steps: 2400

# DoD reference start — the 1-1 cold boot. Also the auto entry state for a
# target/protect level of "1-1" (which has no disk seed: the cold boot IS 1-1).
start_state_path: "roms/Super Mario Bros. (World)_start.state.bin"

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E
  float_state:     0x001D

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo

  encoder: smb_tiles           # scout; pixel deliverable uses nature_dqn
  num_envs: 24                 # tile throughput (pixel deliverable runs 24)

  preprocess_f16: true
  batched_render: replace
  device: mps

  # smb_curriculum stays ON (the "mario" name gates the SMB machinery); the
  # sub-stage ladder is built READ-ONLY here purely to resolve each level's
  # rungs + their nearest-x disk seeds (the target's warm-start seeds and each
  # level's entry state). substage_ladder is NOT enabled — consolidate_level
  # wins over it and turns frontier advance OFF.
  smb_curriculum: true

  # ======================================================================
  # LEVEL-SCOPED CONSOLIDATION — the whole point of this profile.
  # ======================================================================
  consolidate_level:
    enabled: true

    # The level to weld this run (displayed label). Its rungs (entry + x-buckets)
    # are read from the ladder; 100% of the pool warm-starts across them.
    target: "1-2"

    # Entry state to PROBE the target from (greedy, from-this-state). Optional:
    # if omitted, auto-resolves to the target level's entry-rung disk seed
    # (bound via seed_globs below); if that is also absent, the profile start
    # state (correct only for target "1-1"). Give an explicit path for a level
    # with no reliable disk seed.
    # target_entry_state: "checkpoints/super_mario_bros/smb_curriculum/stage_02.state"

    # Already-welded levels to PROTECT: each is cold-probed from its entry every
    # cycle and must never drop below its mode-start baseline (else rollback).
    # entry_state auto-resolves the same way as the target's; give it explicitly
    # for any mid-chain level whose disk seed is not reliable.
    protect:
      - level: "1-1"           # 1-1 has no disk seed -> entry = the profile cold boot
      # - {level: "1-2", entry_state: "checkpoints/.../stage_02.state"}

    # Disk seeds the ladder binds rung entry states from (disk-first, nearest-x).
    # Falls back to substage_ladder.seed_globs if that block is present.
    seed_globs:
      - "checkpoints/super_mario_bros/smb_curriculum/stage_0*.state"
      - "checkpoints/super_mario_bros/smb_curriculum/stage_1_4_bw_x*.state"
      - "checkpoints/auto_curriculum/depth_0_*.state.bin"

    # The consolidation schedule itself: decay entropy (and RND) from->to over N
    # iters via the shared lerp_coef — the proven June weld recipe, now scoped
    # to one level. Frozen (held at `from`) during a post-rollback cooldown.
    schedule:
      entropy: {from: 0.01, to: 0.002, iters: 80}
      rnd:     {from: 0.1,  to: 0.0}

    # Probe cadence: every N iters, greedy-eval `episodes` episodes per level
    # (target + each protect), each capped at `max_steps`.
    probe:
      every: 25
      episodes: 8
      max_steps: 1500

    accept_bar: 0.75           # target greedy clear-rate termination bar
    accept_probes: 3           # sustained probes at/above the bar to finish
    cooldown: 40               # iters of entropy freeze after a protect rollback
    # tol: 1.0e-9              # rate-comparison tolerance (absorbs k/episodes quantization)
    # winner: best_1-2.pt      # override the best_<level>.pt filename

  # === ROLLOUT ===
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256

  # === PPO HYPERPARAMETERS (the proven smb_1_4_dense recipe) ===
  lr: 3.0e-4
  gamma: 0.9
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01           # the consolidate schedule decays this to 0.002
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.1      # the consolidate schedule decays this to 0.0
  rnd_loss_coef: 1.0

  # === DISABLE THE GA / BC POPULATION MACHINERY (dead code in vanilla_ppo) ===
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  sticky_action_prob: 0.0
  panic_isolation: false
  async_pipeline: false

reward_weights:
  forward_progress: 3.0
  score_delta:      0.005
  death_penalty:    0.0
  completion_bonus: 2000.0
  time_penalty:     -0.05
  checkpoint_scale: 1.0
  jump_clear_bonus: 50.0
  jump_clear_min_dx: 16
  survival_bonus:   0.0
  survival_block_steps: 150
  air_bonus:        1.5
  pit_fall_extra:   0.0
  enemy_death_extra: 0.0

action_space:
  - []                      # NOOP
  - ["right"]
  - ["right", "A"]          # jump right
  - ["right", "B"]          # run right
  - ["right", "A", "B"]     # run-jump right
  - ["A"]                   # stationary jump
  - ["left"]

curriculum:
  stage_1: ["1-1"]
  stage_2: ["1-1", "1-2"]
  stage_3: ["1-1", "1-2", "1-3", "1-4"]
