name: world1_specialists_v1
game: mario
hysteresis_k: 2
levels:
  1-1:
    ckpt: checkpoints/super_mario_bros_one_shot_tiles/vanilla_ppo_iter_01580.pt
    profile: configs/smb_oneshot_tiles.yaml
  1-2:
    ckpt: checkpoints/mario_1_2_underground_consolidate/robust_1_2_handoff.pt
    profile: configs/smb_underground_consolidate.yaml
  1-3:
    ckpt: checkpoints/mario_1_3/robust_1_3_handoff.pt
    profile: configs/smb_1_3.yaml
  1-4:
    ckpt: checkpoints/mario_1_4_go_explore/robust_1_4_handoff.pt
    profile: configs/smb_1_4_go_explore.yaml
  default:
    ckpt: checkpoints/super_mario_bros_one_shot_tiles/vanilla_ppo_iter_01580.pt
    profile: configs/smb_oneshot_tiles.yaml
  1-2@1:
    ckpt: checkpoints/mario_1_2_underground_consolidate/robust_1_2_handoff.pt
    profile: configs/smb_underground_consolidate.yaml
  2-1:
    # Routed two-net level (disclosed via gx_switches in every result):
    # the welded front (greedy 1.0 to gx1471) opens; at gx1440 the back
    # net takes the seam. back_2_1_iter230_clears.pt is the Run B winner
    # frozen in its clears era — greedy 1.0 (12/12) from the gx1421
    # runway seed to the flag, probed 2026-07-18.
    ckpt: checkpoints/mario_2_1/robust_2_1_front.pt
    profile: configs/smb_oneshot_tiles.yaml
    gx_switches:
      # Seam pilot: BC clone of one verified live-lineage solution
      # (sol_020, 386 actions, provenance search) at 100% action
      # accuracy — deterministic replay from the deterministic front-net
      # arrival. Probed greedy 4/4 live-arrival -> flag (gx3299).
      # Robustified replacement trains in mario_2_1_seamweld.
      - at_gx: 1440
        ckpt: checkpoints/mario_2_1_seamweld/seam_pilot_sol020.pt
        profile: checkpoints/mario_2_1_seamweld/weld_2_1_seam.yaml
        # One noop step at the switch reproduces the load -> one-noop ->
        # act convention the pilot's demo was minted (and probed) under.
        noop_pad: 1
  2-2:
    # BC pilot of the verified chain-entry solution (archive trace +
    # beam exit, 933 actions, provenance search): 100% action accuracy
    # on the 712-dim de-aliased encoder (the 700-dim water encoder
    # aliases wall-push states and made the demo unlearnable). Probed
    # 4/4 greedy from the true chain entry. entry opts reproduce the
    # replay convention and ride the stack through the water scene cut.
    ckpt: checkpoints/mario_2_2_water/pilot_2_2_beam.pt
    profile: checkpoints/mario_2_2_water/water_tiles_pos.yaml
    entry:
      noop_pad: 1
      continuous_stack: true
  2-3:
    # winners/best.pt from iter 380 (frozen 2026-07-17, training
    # clear_rate 0.110): probed 1.0 greedy 6/6 from the 2-3 entry on
    # 2026-07-18. robust_2_3_native.pt probes 0.0 from the same entry —
    # the earlier freeze promoted a checkpoint outside its clears era.
    ckpt: checkpoints/mario_2_3/robust_2_3_iter380_clears.pt
    profile: configs/smb_2_3.yaml
