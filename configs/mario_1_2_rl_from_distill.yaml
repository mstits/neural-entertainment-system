# Phase-1 Stage 2: distill the Go-Explore 1-2 solutions into a LEARNED policy.
#
# Demo-anchored sticky PPO (the blueprint's "BC + DAgger + 25% sticky"):
#   - single level 1-2, booted from its entrance (start_state_path = stage_03).
#   - demo_anchor (DQfD): a per-update imitation loss toward the 4 solved
#     trajectories (search-provenance, allowlisted) — pulls the policy onto the
#     solution path throughout PPO (DAgger-like drift correction), coef decays
#     1.0 -> 0.02 so the policy weans off the teacher onto its own robust play.
#   - sticky_action_prob 0.25 in TRAINING -> learns to recover from slips.
#   - dense reward (forward + completion + death) + entropy_floor 0.3 (the
#     anti-collapse guard).
# GATE: does 1-2 clear cold under sticky-0.25 + jitter-16 (the honest bar it
# has never passed)? eval_game --start from the profile (stage_03) --sequential
# --level-clear --sticky-prob 0.25 --start-jitter 16.

name: Mario 1-2 RL from distilled init
reward_id: mario
rom_path: "roms/Super Mario Bros. (World).nes"
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
frame_skip: 4
# 1-2 entrance — all envs boot + auto-reset here (single-level training).
start_state_path: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_03.state"
description: >
  Distill the 4 Go-Explore 1-2 solution trajectories into a learned tile policy
  via demo-anchored sticky PPO. Honest gate: cold sticky+jitter 1-2 clear.

ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29

reward_weights:
  forward_progress: 1.0
  time_penalty: -0.01
  death_penalty: -15.0
  completion_bonus: 50.0
  score_delta: 0.0
  air_bonus: 0.0
  survival_bonus: 0.0
  jump_clear_bonus: 0.0
  checkpoint_scale: 0.0

action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles_pos
  preserve_elite_diversity: true
  freeze_pre_ppo_elite: true
  episodes_per_genome: 2
  symlog_rewards: true
  value_loss: huber
  value_coef: 0.25
  bc_epochs: 0
  warmup_gens_ga_only: 10
  steps: 10
  lr: 0.0003
  async_pipeline: false
  device: cpu
  panic_isolation: false
  entropy_coef: 0.005
  entropy_floor: 0.3
  entropy_coef_max: 0.05
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  sticky_action_prob: 0.25
  # DQfD demo anchor — the 4 Go-Explore 1-2 solutions (search provenance).
  demo_anchor_enabled: true
  demo_anchor_paths:
  - "runs/ge_1_2_solve/demos/demo_000.npz"
  - "runs/ge_1_2_solve/demos/demo_001.npz"
  - "runs/ge_1_2_solve/demos/demo_002.npz"
  - "runs/ge_1_2_solve/demos/demo_003.npz"
  demo_anchor_coef: 1.0
  demo_anchor_coef_final: 0.02
  bc_replay_enabled: false
  preprocess_f16: false
  smb_curriculum: false
  # Restart training episodes from states ALONG the solution (the solve
  # archive, 8180 waypoints across 1-2) so the policy learns every segment
  # instead of needing 800 correct steps from the start (Go-Explore
  # robustification, Ecoffet 2021). Archive placed at <ckpt>/go_explore/archive.pkl.
  go_explore:
    enabled: true
    inline_return_prob: 0.6
    save_every: 20
  num_envs: 60

ga_params:
  mutation_rate: 0.8
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  stale_gens_before_restart: 50
  restart_fraction: 0.5

max_episode_steps: 2400
