name: "The Legend of Zelda"
reward_id: zelda
rom_hashes:
  - "f4095791987351be68674a9355b266bc"  # Legend of Zelda, The (USA) (Rev A).nes — canonical launcher dump
  - "614fb3085826e62f3be3a3fe0b931689"  # zelda.nes — alternate dump used by the bench harnesses

# Live overworld start (past the title, CONTROLLABLE) — without this Zelda
# cold-boots to the title demo and trains on ignored inputs (the start-state
# demo bug). Verified on this emulator: loads in 0.06s, game-mode=5 (normal
# play), and Link MOVES under input (x 80->127). NOTE: zelda_start2.state.bin
# was frozen (Link stuck, no milestone could fire) — do not use it. Swap to a
# sword/dungeon-entrance state for reverse curriculum.
start_state_path: "roms/zelda_start_ctrl.state.bin"

description: >
  Training profile for The Legend of Zelda (NES, 1986). Zelda is significantly
  harder than Mario for RL — the game is non-linear, reward signals are
  extremely sparse (you can wander a whole dungeon without score changing),
  and the action space effectively includes menu navigation.
  This profile is a starting point; reward shaping will need heavy iteration.

# QUARANTINED 2026-08-25 (external research audit review, CLAIMS.md's
# Quarantine section carries the full note). Every address below is
# disassembly-sourced (aldonunez/zelda1-disassembly + Data Crystal), not
# independently re-derived by this project's own discovery tools, and
# none carries a [VERIFIED: ...] receipt the way configs/metroid.yaml's
# surviving ram_mapping entries do. NOT the reward's source — ZeldaReward
# (nes_core/src/rewards.rs) declares its own identical hardcoded
# constants and never reads this block; this was always a parallel,
# undisclosed copy. Values are strings, not ints, so a tool folding
# ram_mapping the way scripts/observatory.py does (int(a) over
# .values()) raises instead of silently consuming a banned address.
# A key here may be promoted back to a real ram_mapping entry only after
# an independent differential re-derivation on this ROM, per the
# rediscovery_rule below — never by deleting the q_ prefix in place.
quarantined_external_knowledge:
  provenance: "aldonunez/zelda1-disassembly + Data Crystal RAM map (external, undiscovered)"
  status: UNVERIFIED_EXTERNAL
  rediscovery_rule: >
    A quarantined byte is dead until re-derived from scratch by this
    project's own differential protocol on this ROM: drive input from
    the verified start state, watch the byte move, record wrap /
    reversibility / saturation-and-persistence evidence in a receipt.
    A byte that passes enters a NEW ram_mapping entry with its own
    [VERIFIED: ...] tag; the quarantined entry itself is never promoted
    in place and never cited as the reason a byte was chosen.
  q_link_x:          "0x0070"
  q_link_y:          "0x0084"
  q_world_map_x:     "0x00EB"
  q_world_map_y:     "0x00EC"
  q_dungeon_level:   "0x10"
  q_current_hearts:  "0x066F"  # current HP (4 bits per heart)
  q_max_hearts:      "0x066F"  # upper 4 bits
  q_rupees:          "0x066D"
  q_bombs:           "0x0658"
  q_keys:            "0x066E"
  q_triforce_pieces: "0x0671"  # bitfield, 1 bit/fragment; 0xFF = all 8 (opens L9)
  q_ganon_defeated:  "0x0672"  # 0->1 when Ganon dies -- claimed win flag
  q_song:            "0x0609"  # active track: 0x10=ending, 0x02=Ganon fight

reward_weights:
  # Zelda reward hierarchy, round 4.
  # Every signal the agent should care about has its own line here. The
  # relative magnitudes reflect "how much should training care about this
  # event compared to exploring a new screen (=20)":
  #
  #   triforce_piece (50)  >  heart_container (30)  >  new_item (25)  >
  #   exploration (20)     >  dungeon_enter (15)     >  heart_recovery (5)
  #                        >  enemy_kill (3) ≈ item_used (3)
  #                        >  rupee (2)     >  item_cycle (0.5)
  #                        >  damage (-5)   >  death (-20)
  #
  # History:
  #   r1: motion=0.01 exploration=2  -> motion-reward exploit (300 in 1 cell)
  #   r2: motion=0.0005 exploration=5 -> population spread to 19 cells but
  #       elite collapsed to 100% up+A sword-spam.
  #   r3: motion=0 exploration=20    -> some exploration progress; reward
  #       palette was too sparse (no reward for hearts, items, coins).
  #   r4 (current): rich item/heart/coin signals as the user asked for.
  # Round 5 rebalance (PDF re-read): the old weights had total-available
  # exploration reward = 128 screens × 20 = 2560, vs triforce total = 8 ×
  # 50 = 400. Agents optimally ground new screens instead of progressing
  # through dungeons. Fix: make progress milestones dominate exploration
  # so the policy gradient pulls toward Triforce rescue, not wandering.
  #
  #   new totals (approximate, assuming full game clear):
  #     exploration  128 × 10  = 1280
  #     dungeon_enter  9 × 60  =  540
  #     triforce     8 × 200   = 1600
  #     boss kills   9 × 80    =  720
  #     → progress (2860) ≥ exploration (1280). Right attractor.
  # Round 6 rebalance — aggressive. After 800+ gens plateaued at
  # best=100 with overworld-only behavior, the old weights weren't
  # pulling the policy toward the next milestone. New priorities:
  # wall-bump/stagnation penalties reduced 10× so experimentation
  # isn't crushed; dungeon_enter × 50 so it's the dominant gradient
  # once the agent stumbles into a cave; triforce × 50 as the
  # long-term anchor. first_sword set to 0 — the sword-equipped
  # start-state means that bonus never fires anyway.
  exploration_bonus: 50.0    # was 10 — make new screens matter
  dungeon_enter:   3000.0    # was 60 — THE next-tier gradient
  enemy_kill:       75.0     # was 25 — make combat worth 1.5× a new screen,
                             # so agent stops to fight instead of sprinting past
  rupee_collected:   5.0     # was 2
  heart_container: 300.0     # was 30 — rare and valuable
  heart_recovery:   20.0     # was 5
  triforce_piece: 10000.0    # per-fragment (8 total = 80000) — MILESTONE, not win
  # Win chain — must strictly dominate the 8x10000 fragment economy so the
  # agent is driven to actually BEAT Ganon, not just farm fragments.
  all_fragments:  20000.0    # one-time: all 8 collected -> Level 9 openable
  level9_enter:   30000.0    # one-time: entered Ganon's dungeon ($0010==9)
  ganon_reached:  30000.0    # one-time: Ganon fight begins (song 0x02)
  win_bonus:     100000.0    # TERMINAL jackpot: Ganon dead / Zelda rescued
  damage_taken:     -5.0     # was -8 — less punishing, encourage combat
  death_penalty:   -30.0     # was -20 — tiny bump
  new_item:         80.0     # was 25
  item_tier_upgrade: 40.0    # was 15
  first_sword:       0.0     # was 100 — start-state already has sword
  key_collected:    50.0     # was 10
  magic_key:       500.0     # was 30
  map_compass:     200.0     # was 8
  item_used:         3.0
  item_cycle:        0.5
  motion:            0.0     # disabled — was exploitable
  # Anti-stagnation: after `stagnation_window` frames of no motion,
  # every additional idle frame costs this. First pass at -0.05/window=30
  # wasn't loud enough — observed workers stuck at start position for
  # entire episodes (-0.05 × 60 idle steps = only -3 vs exploration
  # bonus of +20 per new screen that the frozen policy never earned).
  # Bumped to -0.5/window=15 so 30 frozen steps cost the full new-screen
  # bonus, forcing the policy gradient to dominate toward movement.
  stagnation:       -0.5
  stagnation_window: 15
  # Activity-based episode cutoff (SethBling's MarI/O trick). If this
  # many consecutive agent-steps fire no positive reward signal (no
  # new screen, no kill, no pickup, no heart, no tier upgrade), the
  # episode ends. At frame_skip=16 this is N × 16 / 60 seconds of
  # game time. Zelda sword fights can run tens of seconds without a
  # kill landing, and careful navigation between dungeons can be a
  # minute+ without a new-screen event, so this is generous. Lowering
  # it punishes sword-combat episodes; raising it lets stuck genomes
  # idle forever.
  activity_timeout_steps: 900   # ≈ 4 min of game time at frame_skip=16
  # Per-step penalty for holding a directional button while Link's
  # (x,y) does not change — "running at a wall / cave / bush the
  # agent cannot enter." Strictly worse than doing nothing, because
  # doing nothing at least doesn't fake progress. This breaks the
  # "hold UP against the start-screen cave ledge forever" attractor.
  wall_bump:        -0.5

action_space:
  # Start removed: opens an empty inventory menu early game (agent has
  # only the sword), wastes 1/N of the action budget. Re-add via a
  # curriculum-aware action space once the agent picks up a second item
  # (boomerang/bombs).
  - []                # no-op
  - ["up"]
  - ["down"]
  - ["left"]
  - ["right"]
  - ["A"]             # sword
  - ["B"]             # secondary item
  - ["up", "A"]
  - ["down", "A"]
  - ["left", "A"]
  - ["right", "A"]

curriculum:
  # Zelda reward fn emits concrete map_xx_xx IDs from RAM — we don't know
  # in advance which cell is "near start". "*" matches every recorded
  # level, so stage_success_rate averages across wherever the agents went.
  stage_1: ["*"]
  stage_2: ["*"]
  stage_3: ["*"]
  stage_4: ["*"]

reinforce:
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  # Skip-per-pixel batched PPU via clean-scanline history (headless-only;
  # a live frame sink keeps exact rendering). Training-quality accepted:
  # rare 1-frame-stale rows are invisible to the 4-frame-stacked policy.
  batched_render: replace
  # Production fast path: drop the per-worker-step catch_unwind wrap.
  panic_isolation: false
  enabled: true
  # Raised from 0.01 after round-2 saw policy collapse — the elite genome
  # picked "up+A" 100% of the time, indicating softmax had gone degenerate.
  # 0.05 is aggressive but for a 12-action space with sparse rewards we
  # need it. If even this isn't enough next round, go to 0.1 and/or add
  # an anti-idle penalty.
  entropy_coef: 0.05
  ppo_clip_eps: 0.2
  # Shorter window per REINFORCE update — keeps the grad signal fresh and
  # avoids drowning in old trajectories during long episodes.
  max_steps_per_traj: 1000
  top_k: 5                    # use more trajectories (was 3); more diverse update

ga_params:
  # MarI/O-style diversity injection. If the best-seen fitness has not
  # improved for this many consecutive generations, replace
  # `restart_fraction` of the population (bottom-ranked only, never
  # elites) with freshly initialised networks. Elites are preserved so
  # the current best solution isn't thrown away.
  stale_gens_before_restart: 10
  restart_fraction: 0.5

# Per-episode step budget. At frame_skip=16 and 60 fps, N agent-steps
# corresponds to N × 16 / 60 seconds of in-game time.  Zelda is a
# long adventure game — a full playthrough takes hours — so we set a
# very loose cap. The activity_timeout_steps above will kill idle
# genomes long before this cap kicks in; this exists only to stop
# a single pathological genome running for days on a locked-up
# pool. At 36000 this is ~2.7 hours of game time per episode.
max_episode_steps: 36000

# DreamerV3 trainer settings. Zelda is the harder, more exploration-
# heavy game so the Dreamer config is tuned for that:
#   * larger replay (1M) — exploration agent revisits diverse latent
#     regions over a long run; truncating short would drop dungeon-3
#     experience while training on dungeon-1 still
#   * longer warmup (20k) — random actions need more time to find
#     non-trivial states before the world model starts learning
#   * higher entropy_coef (1e-3) — keeps the categorical actor from
#     committing to a single button-mash too early
#   * shorter imag_horizon (10) — Zelda's reward sparsity means
#     imagination quality degrades fast; better to have shorter
#     accurate rollouts than long fantasy ones
dreamer:
  replay_capacity: 1000000
  warmup_steps: 20000
  batch_size: 16
  seq_len: 64
  imag_horizon: 10
  actor_lr: 8.0e-5
  critic_lr: 8.0e-5
  entropy_coef: 1.0e-3
  latent_kind: categorical
  stoch_dim: 32
  stoch_classes: 32
  checkpoint_every_gens: 50

# --------------------------------------------------------------------------
# Go-Explore adapter (scripts/go_explore_solve.py, GenericGame). Opt-in: the
# trainer never reads `solve:`, so adding this block leaves every training
# path byte-identical; it only switches the SOLVER off the SMB adapter and
# onto the profile-driven one.
#
# PURITY. Every address below was measured on THIS emulator, from our own
# scripted rollouts, with our own rendered pixels as the only ground truth.
# The pre-existing `quarantined_external_knowledge:` above (formerly
# `ram_mapping:`, quarantined 2026-08-25) descends from a disassembly and
# is NOT the source for anything here — where a probe happens to land on
# the same address that is a coincidence recorded in the receipt, not
# evidence.
# Receipt (protocol, sample counts, rejected candidates):
#   docs/receipts/games/zelda_onboarding_2026-08-10.md
#
# WHY A BESPOKE PROBE. scripts/discover_observables.py assumes a forced
# scroller that mass-rewrites RAM on death. Zelda satisfies neither: its
# game-over is a slow animation with peak churn ~300 bytes/step (under the
# instrument's 350 reset threshold, so its reset detector never fires), and
# a hold-right probe walks into an octorok. Run head-on it returns
# $00E8 as "room" and $000A as "hp" — both junk (receipt §5). The substitute
# is the same discipline with a stricter event track: a screen transition is
# only counted when OUR OWN rendered play area really changes.
solve:
  rom: "roms/Legend of Zelda, The (USA) (Rev A).nes"
  # ROOT STATE. Use roms/zelda_start.state.bin with --root-state. The
  # profile's training start_state_path (zelda_start_ctrl.state.bin) is a
  # ONE-heart state on an octorok screen: measured 283 exploration attempts
  # from it reached 2 screens and died 78 times, while the same driver from
  # zelda_start.state.bin (three hearts) reached 11 screens with 2 deaths.
  # start_state_path is deliberately left untouched (changing it would move
  # the training path); the solver takes its root from the CLI.
  #
  # progress = Link's on-screen X ($0070). Measured (45-step directional
  # holds, frame_skip 4, from zelda_start.state.bin): 89->240 under a RIGHT
  # hold, 78->0 under LEFT, dead flat (88) under UP/DOWN and flat (84) under
  # NOOP. It RE-BASES at every screen edge (240 -> 156 crossing east), which
  # is the room-graph signature — so it is the WITHIN-ROOM axis only, and
  # the room byte leads the cell key as `area` rather than riding as a <<8
  # page. No `hi`: pairing X with the room index would make a one-column
  # step east (+256) outrank the entire width of a screen and bias the
  # frontier east/south for a reason nothing measured.
  progress: {lo: 0x0070}
  # y = Link's on-screen Y ($0084). Same probe: 133->85 under UP, 133->189
  # under DOWN, flat under LEFT/RIGHT/NOOP. ($0248/$024C track it exactly —
  # OAM-shadow mirrors of the same sprite; the zero-page byte is the source
  # and the mirrors are not wired.)
  y: 0x0084
  # area = the overworld SCREEN INDEX ($00EB) — the room-graph class's real
  # progress axis. Measured over 114 visually-verified screen transitions
  # (a transition counts only when the settled play-area block fingerprint
  # changes by >25%, which is what rejects the death-spin false positives an
  # earlier pass banked):
  #     right  +1  36/36 (1.00)      left  -1  49/49 (1.00)
  #     up    -16   8/12 (0.67)      down +16  11/17 (0.65)
  # The vertical impurity is the DRIVER, not the byte: the residual samples
  # carry a +-1 delta, i.e. Link slid along a wall and crossed an east/west
  # edge while the button said UP. So $00EB is a 16-wide grid index
  # (row*16 + column). Cross-check: across 53 banked screens no background
  # fingerprint ever mapped to two $00EB values, and the 11 values reached
  # form a contiguous block (rows 5-7, columns 6-10).
  # $00EC steps identically but read a stale 120 once mid-load (1/125), so
  # the clean twin is used and $00EC is left out.
  area: 0x00EB
  # level_key EMPTY = coverage baseline, and here that is a correctness
  # requirement, not a default. A level_key ADVANCE is `is_clear` and a
  # level_key CHANGE that is not an advance kills the lineage as a warp — on
  # a grid map that would fabricate a "clear" every time a worker walks east
  # and execute every worker that walks west. Zelda has no measured
  # per-screen clear signal, so nothing is wired: the run is honest
  # coverage. The sect/psig transit machinery still engages, because
  # room_id() = level_key + area + room_sig and `area` alone changes at
  # every screen crossing (max_sect telemetry counts them).
  level_key: []
  # lives = fine HP ($0670), used as the Metroid-style damage proxy: any
  # move OFF the full-health value means Link took a real hit and the
  # lineage is terminated. Ground truth is the HUD heart box (rows 44-58,
  # cols 170-208 of our own frame; one full heart = 41 red pixels).
  #
  # THE COMPLETE MEASURED LADDER, from roms/zelda_start.state.bin down to
  # the death fade (repro: docs/receipts/games/zelda_hp_ladder_probe.py):
  #     $0670   255  127  254  126  253  125    0
  #     $066F    34   34   33   33   32   32   32
  #     hp px   123  103   82   62   41   21    0
  # i.e. $0670 is a HALF-HEART-resolution HP register: bit 7 = "the current
  # heart is full (1) / half (0)", low 7 bits = a full-hearts-remaining
  # counter (127 -> 126 -> 125), and 0 = dead. Every one of the six visible
  # HP levels gets its own value, so this is the finest damage signal on the
  # bus. $066F only tracks the low-7 half of that (34/33/32, saturating at
  # 32 through 1.0, 0.5 AND 0.0 hearts) — strictly coarser, blind to the
  # last two levels and to death itself, so it is NOT wired.
  #
  # READ THE BYTE, NOT THE PIXELS, AND MIND THE PHASE. $0670 LEADS the
  # rendered HUD by exactly one frame_skip=4 step: at the step the byte
  # moves, the heart box still shows the OLD value and repaints on the next
  # step. Sampling both on the same frame therefore makes every real hit
  # look like "damage byte moved at full health" — a one-step desync
  # artifact, not a false positive. Settled with the controller FROZEN to
  # no-op for 20 steps after each firing (a no-op cannot inflict new
  # damage): 14/14 firings across 40 rollouts were real hits, 0 were at
  # genuinely full health, and the HUD never returned to 123 px. The same
  # test run on-frame scores 9 of those 14 "false". Score damage on the
  # NEXT step or you will re-derive the artifact.
  #
  # WHY THE RAW BYTE IS WIRED, UNMASKED. As an integer the ladder is NOT
  # monotone: 127 -> 254 is an INCREASE while HP falls from 2.5 to 2.0
  # hearts. That does not matter to GenericGame.is_dead, which is a
  # one-shot `lives(ram) < start_lives`: the root reads 255 and every
  # damaged value (254, 127, 126, 125, 253, 0) is below it, so the test is
  # exact — it fires on, and only on, the first half-heart lost. Verified
  # 0 false / 5 true over the 16-rollout macro harness at seed 1234.
  #   PRECONDITION, and it is load-bearing: the root state must read
  #   $0670 == 255. Rooted at a PARTIAL-health state the non-monotonicity
  #   does bite — from 127, the next hit reads 254, which is not < 127, so
  #   that half-heart is missed and is_dead only fires on the one after.
  #   roms/zelda_start.state.bin reads 255 (full) and is what the launch
  #   command roots at; the training start_state_path reads 253, whose own
  #   ladder (253 -> 125 -> 0) happens to stay monotone. Any NEW root — a
  #   reverse-curriculum dungeon-entrance state, say — must be checked.
  #   To make the wiring root-independent instead, GenericGame would need
  #   an optional `lives_mask` (`int(ram[self._lives]) & self._lives_mask`,
  #   default 0xFF = byte-identical for every existing profile) and this
  #   profile would set 0x7F, whose ladder 127/127/126/126/125/125/0 IS
  #   monotone. Note that is a SENSITIVITY change, not a bug fix: masked,
  #   the first half-heart is invisible (127 == 127) and is_dead would fire
  #   one full heart late. Not requested; recorded so the option is costed.
  #
  # NOT RESOLVED: Zelda's real death is the CONTINUE/SAVE/RETRY menu, which
  # this proxy anticipates rather than detects. No menu-state byte survived
  # probing (receipt §5); until one does, is_dead fires on the first hit.
  # That is deliberate but aggressive — measured, ~1/3 of 700-step macro
  # rollouts are terminated on first contact.
  lives: 0x0670
  # The discrete-transition gate. `addr` is the same measured screen index,
  # so `max_room` telemetry is the deepest grid cell reached. `buttons` is
  # given explicitly because the auto-derivation only builds UP macros: the
  # measurement above says a Zelda screen is left across ANY of its four
  # edges, so all four directional holds are transition maneuvers here.
  # steps=45: at frame_skip 4 a crossing needed up to ~60 held steps in the
  # probe, and 45 is inside the observed band without wasting the budget.
  room_advance: {addr: 0x00EB, steps: 45, p: 0.05, near: 24,
                 buttons: [["up"], ["down"], ["left"], ["right"]]}
  # NOT WIRED, and why:
  #   entity_slots — no clean kill-flag array was isolated. The strided scan
  #     over a sword-spam drive returns only the OAM shadow ($0200-$02FF,
  #     stride 8), which is sprite data, not per-enemy life state.
  #   rupees / keys — no pickup occurred in any probe rollout (every HUD
  #     counter read x0 throughout), so there was nothing to calibrate
  #     against and nothing is claimed.
  #   clear: — no measured win/clear signal of any kind. Deliberately absent
  #     rather than borrowed from another profile.
