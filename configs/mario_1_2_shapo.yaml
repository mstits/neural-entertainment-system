# Mario 1-2 SHAPO — SAM-PPO under uniform alpha-noise (v7 report pivot).
#
# Continuation of the PR-MDP seed-0 run at its ~130M-step checkpoint:
# the co-trained adversary was diagnosed as collapsed (uniform-random,
# never sharpened) and purged; SHAPO (sharpness-aware policy updates,
# rho=0.05, actor set only, critic standard) replaces the arms race per
# the v7 consultation. Pre-registered gates (plans/v7 distillation):
#   P1 (T+5M):  pessimism shock — protagonist entropy +>=15%, max honest
#               depth temporarily regresses (EXPECTED, not failure).
#   P2 (T+30M): 30-ep SPRT median honest depth > 20% (x>=650) @ 95%.
#   KILL (250M total, unchanged budget): median <25% AND entropy <0.05
#               AND max depth never breaks x=1500.
#

name: Mario 1-2 SHAPO
rom_path: "roms/Super Mario Bros. (World).nes"
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
frame_skip: 4
start_state_path: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_03.state"
description: >
  PR-MDP adversarial PPO on SMB 1-2: co-trained action adversary at
  alpha=0.25 replaces random sticky during training. Honest gate unchanged:
  cold greedy sticky-0.25 + jitter from the 1-2 entrance.

ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29

reward_weights:
  forward_progress: 1.0
  time_penalty: -0.01
  death_penalty: -15.0
  completion_bonus: 50.0
  score_delta: 0.0
  air_bonus: 0.0
  survival_bonus: 0.0
  jump_clear_bonus: 0.0
  checkpoint_scale: 0.0

action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles_pos
  recurrent: false
  tile_hidden_dim: 128
  tile_trunk_dim: 32
  preserve_elite_diversity: true
  freeze_pre_ppo_elite: true
  episodes_per_genome: 2
  symlog_rewards: true
  value_loss: huber
  value_coef: 0.5
  gae_lambda: 0.95
  gamma: 0.99
  bc_epochs: 0
  warmup_gens_ga_only: 10
  rollout_steps: 128
  ppo_minibatch_size: 256
  steps: 10                    # 10 protagonist epochs (10:2 alternation)
  lr: 0.0003
  ppo_clip_eps: 0.2
  async_pipeline: false
  device: cpu
  panic_isolation: false
  entropy_coef: 0.05           # report spec: protagonist 0.05
  entropy_floor: 0.02
  entropy_coef_max: 0.08
  rnd_intrinsic_coef: 0.0
  rnd_loss_coef: 0.0
  # Random sticky OFF in training: the PR-MDP alpha-mixture IS the noise.
  # (Eval-side sticky comes from the probe harness, not this scalar.)
  sticky_action_prob: 0.0
  # SHAPO transition (v7 report, 2026-07-30): the co-trained adversary
  # collapsed to uniform noise (entropy pinned at ln|A| for 130M steps —
  # GDA limit cycle). Verdict: REPLACE. The override channel keeps the
  # exact alpha=0.25 uniform noise profile the protagonist adapted to
  # (no distribution shift at the checkpoint boundary); SAM supplies the
  # robustness pressure via parameter-space flatness instead.
  sam_rho: 0.05                # Euclidean SAM, actor set only, per report
  prmdp:
    enabled: true
    alpha: 0.25
    adversary_mode: uniform    # no adversary net, no adversary updates
  # Non-farmable wavefront + lost-cut stay (clean, reclaims off-path waste).
  wavefront_reward:
    enabled: true
    dmap: "checkpoints/wavefront/mario_1_2_dmap.pkl"
    phi_target: 100.0
    gamma: 0.99
  demo_anchor_enabled: false   # imitation eliminated (Dossier v3 §3)
  bc_replay_enabled: false
  preprocess_f16: false
  smb_curriculum: false
  go_explore:
    enabled: true
    inline_return_prob: 0.6
    cell:
      type: smb_gx_phase
      gx_bucket: 32
      y_bucket: 32
    score: max_x
    save_every: 20
  num_envs: 60

ga_params:
  mutation_rate: 0.8
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  stale_gens_before_restart: 50
  restart_fraction: 0.5

max_episode_steps: 2400
