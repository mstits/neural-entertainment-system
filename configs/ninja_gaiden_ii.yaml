solve:
  rom: "roms/Ninja Gaiden II - The Dark Sword of Chaos (USA).nes"
  # Odometer gate (runs/onboard_wave4/gate_ninja_gaiden_ii_right.json):
  # --forward right, 1200 steps, axis x, range 0..2043, 449 distinct,
  # oam_churn 689/1199 — PASS, SIGNAL SOUND (tail-quarter flat noted as
  # a behaviour finding, not an instrument fault). NG1 precedent
  # (configs/ninja_gaiden.yaml) also runs on the odometer, same class.
  progress: {source: odometer, axis: x}
  # y / lives discovered by scripts/discover_observables.py's own
  # 3-probe protocol against this exact start state, 2026-08-25. No RAM
  # map, no disassembly, no walkthrough.
  # Receipt: runs/onboard_wave4/discover_ninja_gaiden_ii.json
  #   $0023  progress candidate (netF=64, mono=1.00) — NOT used because
  #          the odometer already gated SOUND and is the preferred
  #          hardware surface (same reasoning as ninja_gaiden/rygar).
  #   $000E  y candidate — jump/ballistic signature.
  #   $004C  lives candidate — decrements on death, 5 of 5 agreement.
  y: 0x000E
  lives: 0x004C
  clear:
    # Odometer-cohort scene_cut wiring, 2026-08-26 (Finding 1: odo_blank is a
    # real transition counter). Eligibility only -- no `mode` is set here, so
    # is_clear()/solutions is byte-identical to before this block existed;
    # this only moves scene_cut from DEAD to ALIVE in clear_reachability's
    # quorum table. Measured, not guessed -- full survey + per-profile numbers:
    # docs/receipts/clear_control/odometer_cohort_scene_cut_survey_2026-08-26.json
    # 9 scene-ordinal bumps fired in ordinary short random play (max run 1) --
    # the Metroid camera-clamp/seam shape. scene raised well above the observed
    # null and `kind` restricted to `fade` so only the blank half of the signal
    # can vote; `warp`/`pan` stay excluded rather than guessing a number that
    # happens to clear this survey's own null.
    signals:
      scene_cut: {scene_min: 5, blank_min: 1, kind: [fade], death_debounce: 3}

  # DELIBERATELY EMPTY — no clear captured yet; guessing a stage-advance
  # byte here is the authored-semantics class the purity line forbids.
  level_key: []
