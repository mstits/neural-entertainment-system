name: "Batman - The Video Game"

rom_path: "roms/Batman - The Video Game (USA).nes"
start_state_path: "roms/Batman - The Video Game (USA)_start.state.bin"

description: |
  Batman - The Video Game (NES), minimal onboarding profile. Generic
  controller, odometer progress source. No game internals.

  Start state provenance: roms/Batman - The Video Game (USA)_start.state.bin
  minted 2026-08-24, wave 2 (runs/onboard_wave2/mint_batman_the_video_game.json)
  — right/left 120f-hold divergence 278 RAM / 140 OAM bytes, cross-checked by
  an independent fresh Pool reload; visual check confirms live Stage-1
  side-scroller gameplay, not a title-screen demo.

frame_skip: 4

action_space:
  - []
  - ["right"]
  - ["left"]
  - ["up"]
  - ["down"]
  - ["A"]
  - ["B"]
  - ["right", "A"]
  - ["right", "B"]
  - ["left", "A"]
  - ["left", "B"]
  - ["right", "A", "B"]
  - ["down", "B"]
  - ["up", "B"]

solve:
  rom: "roms/Batman - The Video Game (USA).nes"
  # Progress-signal gate on the PPU scroll odometer: passed, 318 distinct
  # values over 1200 steps, net max 1222 px, no high-byte saturation.
  # Receipt: runs/onboard_wave2/gate_batman_the_video_game.json.
  # (Flat over the roll's last quarter — see runs/onboard_wave3/
  # diagnostic notes; not re-gated, the RAM-byte progress candidate below
  # was left as a discovered fallback, not swapped in, since the odometer
  # receipt already reads SOUND.)
  progress: {source: odometer, axis: x}
  # Discovered by scripts/discover_observables.py's 3-probe protocol
  # (forward-hold / NOOP-hold / reverse-hold) from this profile's own
  # start state, 2026-08-25. No RAM map, no disassembly, no walkthrough.
  # Receipt: runs/onboard_wave3/observables_batman.json
  #
  #   $00D5|$00A3<<8  discovered RAM-byte progress pair (net +22112,
  #                   mono=0.94, passes wrap + saturation gates) — kept
  #                   here as a receipted fallback, not wired as the
  #                   active `progress:` source (the odometer already
  #                   gates SOUND and is the hardware-surface signal
  #                   this project prefers).
  #   $0042  jump/ballistic signature ("y").
  #   $00EE  room/screen counter; flagged CAMERA-CLAMP SATURATOR by the
  #          gate (saturates, cap=1) — left unwired as `area:` for that
  #          reason.
  #   $00B7  decrements on death, agreed by 5 of 5 independent runs.
  y: 0x0042
  lives: 0x00B7
  clear:
    # scene_cut DECLINED 2026-08-27, superseding the 2026-08-26 arming
    # (4dd15ea). Re-adjudicated by measurement, not judgement:
    # scripts/scene_cut_arming.py.
    # CHANNEL DEAD: the gate is kind=['fade'], which votes on the blank
    # channel, and odo_blank produced 0 runs in 4x6000 steps (odometer_scene:
    # 70 runs, deliberately gated out as camera-clamp/seam noise). A blank-only
    # gate over a blank counter measured at zero is indistinguishable from an
    # unwired odometer -- the exact evidence state tetris_usa was DECLINED for.
    # THE GENERAL REASON, which applies to every profile in this cohort and not
    # only this one: the audit probe CLEARS NOTHING, so its entire observed
    # (d_scene, d_blank) distribution is null. A gate at or below that null
    # fires on ordinary play; a gate above it has no evidence it can ever fire.
    # An ARM needs a WITNESSED positive -- one blank run known to be a level
    # transition -- and no profile here has one. Same refusal, same reason, as
    # docs/receipts/rygar/clear_predicate_REFUTED.md.
    # The instrument is NOT the problem: odo_blank moves for 20 of the 25
    # cohort profiles and reads 55/55 transitions on Rygar's banked tape.
    # Re-arm by witnessing one transition on this profile, registering it in
    # scene_cut_arming.WITNESSED_TRANSITIONS, and re-running the audit.
    # Reproduce: .venv/bin/python scripts/scene_cut_arming.py --profile configs/batman_the_video_game.yaml
    # Receipt:   docs/receipts/clear_control/scene_cut_arming_2026-08-27.json
    signals:
      scene_cut:
        enabled: false
        reason: >-
          DECLINED 2026-08-27 by scripts/scene_cut_arming.py. CHANNEL DEAD: the
          gate is kind=['fade'], which votes on the blank channel, and
          odo_blank produced 0 runs in 4x6000 steps (odometer_scene: 70 runs,
          deliberately gated out as camera-clamp/seam noise). A blank-only gate
          over a blank counter measured at zero is indistinguishable from an
          unwired odometer -- the exact evidence state tetris_usa was DECLINED
          for. An ARM requires a witnessed level transition to place a length
          floor against; this profile has none.

  # DELIBERATELY EMPTY. Observing a stage-advance byte requires a real
  # clear, and nothing has cleared yet. With an empty level_key the
  # solver explores for coverage but cannot declare a solution — it can
  # search, and it cannot yet recognise winning. Guessing a byte here is
  # the authored-semantics class the purity line forbids, so it stays
  # empty until a clear is actually captured.
  level_key: []
