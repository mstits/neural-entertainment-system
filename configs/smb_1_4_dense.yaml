name: "Mario 1-4 dense"
reward_id: mario
rom_hashes:
  - "811b027eaf99c2def7b933c5208636de"

# Train SMB 1-4 (the CASTLE: lava pits, firebars, bridge/axe at the end).
# Warm-start ALL envs at the 1-3 start (area byte 3, stage_03.state),
# curriculum OFF. Uses the PROVEN mario_tiles platformer recipe: a naive
# "run right" dies in 1-3's pits, so the canonical (shaping-off) reward
# leaves the forward gradient confounded by death and the policy flails
# at high entropy (observed: entropy stuck ~1.78, max_x stalled ~1340-1872
# with no commitment). The mario_tiles shaping (air_bonus + jump_clear +
# survival, low entropy, low RND, no death penalty) gives a clean
# "jump-over-pits-while-going-right" gradient — the same recipe that
# mastered 1-1's pits. Plus the LEVEL_1_3 dense x-ladder (checkpoint_scale).
start_state_path: "checkpoints/super_mario_bros/smb_curriculum/stage_1_4.state"

frame_skip: 4
max_episode_steps: 2400

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E
  float_state:     0x001D

reinforce:
  enabled: true
  encoder: smb_tiles
  tile_frame_stack: 4
  trainer_mode: vanilla_ppo
  smb_curriculum: false
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 3.0e-4
  gamma: 0.9
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  # Low entropy: the jump shaping provides the gradient, so the policy
  # should COMMIT to jumps rather than flail (mario_tiles value).
  entropy_coef: 0.01
  grad_clip: 0.5
  value_loss: huber
  # Low RND: at 0.5 the novelty bonus kept the policy exploring instead
  # of committing to forward progress. mario_tiles uses 0.1.
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  sticky_action_prob: 0.0
  device: cpu
  panic_isolation: false
  async_pipeline: false

# mario_tiles platformer shaping (proven to master 1-1's pits) + the
# LEVEL_1_3 dense x-ladder via checkpoint_scale.
reward_weights:
  forward_progress: 3.0
  score_delta:      0.005
  # No death penalty: let the agent experiment with risky pit-jumps
  # without the -15 fear that suppresses jump exploration (mario_tiles).
  death_penalty:    0.0
  completion_bonus: 2000.0
  # Mild anti-camp pressure. CRITICAL for 1-3: survival_bonus is REMOVED
  # here (unlike mario_tiles/1-1). In 1-1 surviving aligns with progress
  # (run along the floor), but 1-3 is floating platforms over pits, so
  # "survive" = camp on a safe platform, a ~+2048/episode local optimum
  # that directly competes with the risky pit-jumps needed to advance.
  # Removing it + a small per-step penalty pushes the policy to progress.
  time_penalty:     -0.05
  checkpoint_scale: 1.0      # LEVEL_1_3 dense x-ladder ON
  jump_clear_bonus: 50.0     # reward clearing obstacles via a jump
  jump_clear_min_dx: 16
  survival_bonus:   0.0      # OFF for platform levels (camping optimum)
  survival_block_steps: 150
  air_bonus:        1.5      # reward being airborne while moving right
  pit_fall_extra:   0.0
  enemy_death_extra: 0.0

action_space:
  - []
  - ["right"]
  - ["right", "A"]
  - ["right", "B"]
  - ["right", "A", "B"]
  - ["A"]
  - ["left"]

curriculum:
  stages:
    - name: stage_1
      levels: ["1-3"]
      advance_threshold: 0.5
      min_episodes: 200
