name: Mario 2-3
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
description: 'Tile-scout vanilla PPO targeting SMB 2-3, the Cheep Cheep bridge level.
  Per the Mario wiki, the level is a chain of long bridges under an endless rain of
  leaping Cheep Cheeps: running keeps them spawning behind Mario while walking lets
  them arc in from the front, so sustained hold-right-and-run is both the fastest
  and the safest policy. The second half adds small platforms to leap across, and
  the Cheep Cheep rain stops at the stone steps before the flag. Reputedly one of
  the easier levels for RL: dominant strategy is run right with occasional committed
  jumps, so standard platform shaping (air/jump-clear bonuses) applies. PPO params
  are the uvipen-calibrated set that cleared 2-2 (lr 1e-4, 4096 samples/update, gae_lambda
  1.0).

  '
