# Distinct display name -> distinct checkpoint slug
# (super_mario_bros_one_shot), so the one-shot campaign gets its own
# checkpoint subtree and does NOT collide with the base
# checkpoints/super_mario_bros/ curriculum blobs it warm-starts FROM.
# The name still contains "mario", so every SMB dispatch that is
# substring-gated on the profile name stays active: the reward function,
# the _smb_curriculum_active gate (trainer.py ~608), the SMB progress
# proxies (~5674), and the go_explore max_x score kind (~4658). Only the
# checkpoint directory changes.
name: "Super Mario Bros. (one-shot)"
rom_hashes:
  - "811b027eaf99c2def7b933c5208636de"

# ==========================================================================
# SMB ONE-SHOT — sequential cold clear of World 1 (1-1 -> 1-2 -> 1-3 -> 1-4)
# ==========================================================================
# Pixel-CNN (nature_dqn) is the DELIVERABLE vehicle: the only historically
# cold-capable SMB clears (1-2 June, 1-4 stochastic July) were on pixels,
# and there is no cross-encoder transfer, so the DoD is claimed on this
# profile. configs/smb_oneshot_tiles.yaml is the zero-new-code tile SCOUT
# that front-runs ladder validation ~4x faster; its policy is discarded.
#
# The campaign generalizes the proven area-byte save-state curriculum into
# an ordered (world, area, x-bucket) sub-stage ladder: 3 buckets each for
# 1-1/1-2/1-3 and a dense 8-bucket ladder for 1-4 pre-seeded from the
# existing stage_1_4_bw_x*.state blobs, so we warm-start at the Bowser
# bridge on iter 0 instead of waiting to discover it. The proven 50%/5-iter
# rolling advance gate is reused verbatim, measured on region_of(ram)
# (sub-stage order) instead of the scalar packed byte. A three-way
# warm-start partition (Frontier 50 / Retention 25 on cleared level-entries
# / Spread 25) holds early levels. A cold-eval probe subprocessing
# eval_game.py --sequential every 25 iters is the PRIMARY metric, the
# regression alarm, and the winner-selector (best_cold.pt). Warps are
# blocked by construction (off-ladder + admission predicate) and
# metric-immune (won semantics), reported only as a "beyond" stat.

description: >
  Pixel-CNN vanilla PPO for the sequential cold clear of SMB World 1.
  Ordered (world, area, x-bucket) sub-stage ladder over the proven
  area-byte curriculum, three-way retention warm-start, and a
  cold-eval probe (eval_game.py --sequential) as the primary metric and
  winner selector. Dense per-level checkpoint ladders ON — the June
  1-2 wall-break — plus the July 1-4 backward states pre-seeded.

frame_skip: 4
max_episode_steps: 2400

# DoD reference start — the 1-1 cold boot. Without a start state the
# emulator boots to the TITLE SCREEN, where the attract-mode demo
# auto-plays 1-1 and ignores controller input; every env then runs the
# identical scripted demo and the policy gets zero learning signal. This
# state drops the agent into live 1-1 gameplay (operMode 1) so inputs
# matter, and it is the exact greedy start the cold probe scores from.
start_state_path: "roms/Super Mario Bros. (World)_start.state.bin"

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E
  float_state:     0x001D

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo

  # Pixel-CNN, the deliverable vehicle: 4-stacked 84x84 grayscale frames
  # -> 1.7M-param Nature-DQN encoder -> actor/critic heads.
  encoder: nature_dqn
  num_envs: 24                 # machine sweet spot (tile scout runs 60)

  # Pixel fast path (matches contra.yaml / mario.yaml): f16 observation
  # transfer skips the per-batch /255 MPS kernel and halves H->D bytes;
  # batched_render replaces per-pixel PPU with clean-scanline history
  # (headless-only; a live sink keeps exact rendering). The 1.7M-param
  # CNN is materially faster on MPS than CPU (benched ~4.7x on contra).
  preprocess_f16: true
  batched_render: replace
  device: mps

  # === SUB-STAGE CURRICULUM (the campaign spine) ===
  # smb_curriculum stays ON (name is gated on "mario"); substage_ladder
  # extends it into the ordered (world, area, x-bucket) list. The ladder
  # builder (src/training/smb_substage_ladder.build_ladder) binds each
  # sub-stage to its nearest-x disk seed via these globs (disk-first,
  # live-fill), and region_of(ram) credits only sequential-path states so
  # a warp cannot raise the frontier.
  smb_curriculum: true
  substage_ladder:
    enabled: true
    seed_globs:
      - "checkpoints/super_mario_bros/smb_curriculum/stage_0*.state"
      - "checkpoints/super_mario_bros/smb_curriculum/stage_1_4_bw_x*.state"
      - "checkpoints/auto_curriculum/depth_0_*.state.bin"
    # Buckets per level: 3 for 1-1/1-2/1-3 (entry / mid-chokepoint / exit),
    # 8 for 1-4 (~256 x-units each, matching the pre-seeded backward
    # states). Keys are quoted so YAML does not fold "1_1" to the int 11.
    buckets: {"1_1": 3, "1_2": 3, "1_3": 3, "1_4": 8}
  # Reuse the PROVEN advance gate verbatim: promote when the rolling-mean
  # fraction of envs past the current sub-stage reaches 50% over 5 iters,
  # applied to region_of(ram) instead of the scalar packed byte.
  advance: {pct: 0.50, window: 5}
  # Three-way partition of the 24-env pool, recomputed each iter from the
  # frontier order: Frontier holds F and F-1, Retention pins a fixed floor
  # on every already-cleared level-entry (anti-forgetting), Spread samples
  # uniformly over all buckets below the frontier.
  warm_start: {frontier: 0.50, retention: 0.25, spread: 0.25}

  # === COLD-EVAL PROBE (primary metric + winner selector) ===
  # Subprocess scripts/eval_game.py --sequential (greedy argmax from the
  # 1-1 start, sequential predicate from won RAM semantics) every 25 iters.
  # This is the number every phase gates on AND the number the DoD is
  # scored by — training telemetry never selects the deliverable.
  cold_eval:
    every: 25
    curve_episodes: 8          # cheap curve between GO gates
    gate_episodes: 24          # full sweep at each GO gate
    greedy: true               # argmax; stochastic also reported
    winner: best_cold.pt       # save_winner re-keyed on cold_seq_clear_rate
    # If an already-cleared early level's cold high-water regresses for 2
    # consecutive probes: log FORGETTING, bump Retention to 40% for 100
    # iters; if it persists, roll back to best_cold.pt + reset optimizer.
    forgetting: {probes: 2, retention_bump: 0.40, bump_iters: 100}

  # === CONSOLIDATION (gated, reversible, never on a clock) ===
  # Terminal entropy/RND decay (the proven June recipe) that collapses a
  # stochastic clear into a deployable greedy one. Armed ONLY once the
  # cold probe proves the frontier reached 1-4; reversible so a premature
  # commit is not fatal.
  consolidate:
    trigger: cold_probe_reached_1_4
    entropy: {from: 0.01, to: 0.002, iters: 80}
    rnd: {from: 0.1, to: 0.0}
    # Abort + rearm if a probe shows early-level forgetting OR greedy 1-4
    # clear fails to rise for 40 iters -> restore entropy 0.01 and resume.
    abort_if: {early_forgetting: true, no_gain_iters: 40}
    fallback: cyclic           # explore<->consolidate oscillation if terminal aborts 2x

  # === GO-EXPLORE UNSTICK (DEFERRED subroutine, NOT the go_explore_on branch) ===
  # A bounded archive burst invoked ONLY on a stall — never concurrent with
  # the curriculum. cell = smb_sequential puts world/area IN the key (the
  # Angle-B collision fix). Wired only if Phase D actually stalls.
  go_explore_fallback:
    stall_patience: 60
    burst_iters: 30
    cell: smb_sequential

  # === WARP HANDLING ===
  # Block on the sequential track, report as "beyond": off-ladder by
  # construction + the smb_sequential_cell admission predicate + won-metric
  # immunity. A 1-2 warp scores seq_clear=0, surfaces under cold_warp_rate.
  warp: {mode: block, report_beyond: true}

  # === ROLLOUT ===
  rollout_steps: 1024          # 1-1 -> 1-2 transition fits inside one rollout
  steps: 10                    # K PPO epochs / iter (canonical)
  ppo_minibatch_size: 256

  # === PPO HYPERPARAMETERS (the proven smb_1_4_dense recipe) ===
  lr: 3.0e-4
  gamma: 0.9
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  # Base entropy 0.01 (yumouwei/uvipen canonical); the consolidate block
  # decays it to 0.002 once the frontier reaches 1-4.
  entropy_coef: 0.01
  grad_clip: 0.5
  # Huber on un-normalized GAE returns keeps the value gradient bounded
  # under the +2000 completion spike.
  value_loss: huber
  # Base RND 0.1 (the dense ladder already bridges dead zones, so RND is a
  # secondary nudge); the consolidate block decays it to 0.0.
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0

  # === DISABLE THE GA / BC POPULATION MACHINERY (dead code in vanilla_ppo) ===
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  # Sticky actions corrupt PPO's importance ratio (recorded log-prob no
  # longer matches the executed action). Off.
  sticky_action_prob: 0.0
  panic_isolation: false
  # async_pipeline OFF for SMB — the 1-step obs lag breaks frame-perfect
  # jumps (validated 50-gen regression).
  async_pipeline: false

# ONE global platform-shaping profile (the smb_1_4_dense weights). The
# per-level dense checkpoint ladder auto-switches by area byte inside a
# single episode via checkpoints_for() (rewards.rs), so only the scalar
# weights are global. 1-4 needs NO bespoke reward stage — it is linear
# x-progress to the axe; its difficulty is handled by sub-stage density
# (8 seeded buckets), not new shaping.
reward_weights:
  forward_progress: 3.0
  score_delta:      0.005
  # No death penalty: let the agent experiment with risky pit-jumps
  # without the -15 fear that suppresses jump exploration.
  death_penalty:    0.0
  completion_bonus: 2000.0
  # Small per-step pressure. survival_bonus is 0 for platform levels:
  # "survive" = camp on a safe platform, a local optimum that competes
  # with the risky pit-jumps needed to advance.
  time_penalty:     -0.05
  checkpoint_scale: 1.0        # dense per-level x-ladders ON (the June wall-break)
  jump_clear_bonus: 50.0       # reward clearing an obstacle via a jump
  jump_clear_min_dx: 16
  survival_bonus:   0.0        # OFF for platform levels (camping optimum)
  survival_block_steps: 150
  air_bonus:        1.5        # reward being airborne while moving right
  pit_fall_extra:   0.0
  enemy_death_extra: 0.0

action_space:
  - []                      # NOOP
  - ["right"]
  - ["right", "A"]          # jump right
  - ["right", "B"]          # run right
  - ["right", "A", "B"]     # run-jump right
  - ["A"]                   # stationary jump
  - ["left"]

# Informational on the vanilla_ppo path — advancement is driven by the
# sub-stage ladder inside _run_vanilla_ppo (region_of + the 50%/5-iter
# gate), not by the CurriculumManager. Kept for parity and any future
# generic curriculum consumer.
curriculum:
  stage_1: ["1-1"]
  stage_2: ["1-1", "1-2"]
  stage_3: ["1-1", "1-2", "1-3", "1-4"]
