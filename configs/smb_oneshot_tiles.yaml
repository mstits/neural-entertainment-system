name: Super Mario Bros. (one-shot, tiles)
reward_id: mario
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
description: "Tile-scout vanilla PPO for the sequential cold clear of SMB World 1.\
  \ Ordered (world, area, x-bucket) sub-stage ladder over the proven area-byte curriculum,\
  \ three-way retention warm-start, and a cold-eval probe (eval_game.py --sequential)\
  \ as the primary metric and winner selector. Dense per-level checkpoint ladders\
  \ ON \u2014 the June 1-2 wall-break \u2014 plus the July 1-4 backward states pre-seeded.\n"
frame_skip: 4
max_episode_steps: 2400
start_state_path: roms/Super Mario Bros. (World)_start.state.bin
ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29
reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles
  num_envs: 60
  preprocess_f16: true
  batched_render: replace
  device: mps
  smb_curriculum: true
  substage_ladder:
    enabled: true
    seed_globs:
    - checkpoints/super_mario_bros/smb_curriculum/stage_0*.state
    - checkpoints/super_mario_bros/smb_curriculum/stage_1_4_bw_x*.state
    - checkpoints/auto_curriculum/depth_0_*.state.bin
    buckets:
      '1_1': 3
      '1_2': 3
      '1_3': 3
      '1_4': 8
  advance:
    pct: 0.5
    window: 5
  warm_start:
    frontier: 0.35
    retention: 0.4
    spread: 0.25
  cold_eval:
    every: 25
    curve_episodes: 8
    gate_episodes: 24
    greedy: true
    winner: best_cold.pt
    forgetting:
      probes: 2
      retention_bump: 0.4
      bump_iters: 100
  consolidate:
    trigger: cold_probe_reached_1_4
    entropy:
      from: 0.01
      to: 0.002
      iters: 80
    rnd:
      from: 0.1
      to: 0.0
    abort_if:
      early_forgetting: true
      no_gain_iters: 40
    fallback: cyclic
  go_explore_fallback:
    enabled: true
    stall_patience: 20
    burst_iters: 30
    burst_env_frac: 0.25
    burst_env_cap: 8
    cell: smb_sequential
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 0.0003
  gamma: 0.9
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  sticky_action_prob: 0.0
  panic_isolation: false
  async_pipeline: false
reward_weights:
  forward_progress: 3.0
  score_delta: 0.005
  death_penalty: 0.0
  completion_bonus: 2000.0
  time_penalty: -0.05
  checkpoint_scale: 1.0
  jump_clear_bonus: 50.0
  jump_clear_min_dx: 16
  survival_bonus: 0.0
  survival_block_steps: 150
  air_bonus: 1.5
  pit_fall_extra: 0.0
  enemy_death_extra: 0.0
action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A
- - left
curriculum:
  stage_1:
  - 1-1
  stage_2:
  - 1-1
  - 1-2
  stage_3:
  - 1-1
  - 1-2
  - 1-3
  - 1-4
