solve:
  rom: "roms/Ninja Gaiden III - The Ancient Ship of Doom (USA).nes"
  # Odometer gate (runs/onboard_wave5/gate_ninja_gaiden_iii_right.json):
  # --forward right, 1200 steps, axis x, range 0..264, 49 distinct,
  # oam_churn 1199/1199 -- PASS, SIGNAL SOUND (tail-quarter flat noted
  # as a behaviour finding, same shape as NG1/NG2/Super C, not an
  # instrument fault). NG1/NG2 precedent: prefer the odometer as
  # progress source once it gates SOUND.
  progress: {source: odometer, axis: x}
  # y / lives / room-counter discovered by scripts/discover_observables.py's
  # own 3-probe protocol against this exact start state, 2026-08-25. No
  # RAM map, no disassembly, no walkthrough.
  # Receipt: runs/onboard_wave5/discover_ninja_gaiden_iii.json
  #   $00DC  room/screen counter (netF=264, mono=1.00, no saturation) --
  #          not used as primary progress (odometer already gated SOUND
  #          and is the preferred hardware surface), kept as `area` for
  #          archive cell-keying since it steps cleanly at transitions.
  #   $0084|$00DC<<8  spatial pair -- SATURATES (camera-clamp, caps at
  #          scroll-window limit + rebases at room transitions). Flagged
  #          by the discovery tool itself; not used.
  #   $0006  y candidate -- jump/ballistic signature.
  #   $007B  lives candidate -- decrements on death, 5 of 5 agreement.
  area: 0x00DC
  y: 0x0006
  lives: 0x007B
  clear:
    # Odometer-cohort scene_cut wiring, 2026-08-26 (Finding 1: odo_blank is a
    # real transition counter). Eligibility only -- no `mode` is set here, so
    # is_clear()/solutions is byte-identical to before this block existed;
    # this only moves scene_cut from DEAD to ALIVE in clear_reachability's
    # quorum table. Measured, not guessed -- full survey + per-profile numbers:
    # docs/receipts/clear_control/odometer_cohort_scene_cut_survey_2026-08-26.json
    # 9 scene-ordinal bumps fired in ordinary short random play (max run 2) --
    # the Metroid camera-clamp/seam shape. scene raised well above the observed
    # null and `kind` restricted to `fade` so only the blank half of the signal
    # can vote; `warp`/`pan` stay excluded rather than guessing a number that
    # happens to clear this survey's own null.
    signals:
      scene_cut: {scene_min: 6, blank_min: 1, kind: [fade], death_debounce: 3}

  # DELIBERATELY EMPTY -- no clear captured yet; guessing a stage-advance
  # byte here is the authored-semantics class the purity line forbids.
  level_key: []
