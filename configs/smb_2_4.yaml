  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29
reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles
  num_envs: 24
  preprocess_f16: true
  batched_render: replace
  device: mps
  smb_curriculum: true
  consolidate_level:
