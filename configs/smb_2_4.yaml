name: Mario 2-4
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
description: 'Tile-scout vanilla PPO targeting SMB 2-4, the World 2 castle. Per the
  Mario wiki, the level opens onto lava, then two paths lined with Fire-Bars (the
  top path has more), several empty blocks without Fire-Bars attached (they gain
  them in later castles), a lava pit with Podoboos under small platforms, two lifts
  moving in opposite vertical directions, and gaps before the fire-breathing fake
  Bowser and the axe. Structurally the same problem class as 1-4 — precise timing
  around rotating Fire-Bar hazards with committed jumps — so shaping mirrors
  smb_weld_1_4.yaml exactly. PPO params are the uvipen-calibrated set (lr 1e-4,
  4096 samples/update, gae_lambda 1.0).

  '
frame_skip: 4
max_episode_steps: 2400
# Entry point for the World-2 chain: the exact frame of the 2-3 -> 2-4 transition,
# captured by the preceding weld as checkpoints/handoffs/handoff_2-4.state.
# This file does NOT exist yet — it must exist before launch. The launcher's
# start-state resolution (scripts/train_game.py resolve_start_state) only fails
# loud (SystemExit) when NOTHING resolves; if the ROM's `_start.state.bin`
# sidecar is present it silently falls back to it with a warning, which would
# train 1-1 from power-on instead of 2-4. Verify the handoff file exists (and
# no "[launcher] using start-state sidecar" line appears) before trusting a run.
start_state_path: checkpoints/handoffs/handoff_2-4.state
ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29
reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles
  num_envs: 24
  preprocess_f16: true
  batched_render: replace
  device: mps
  smb_curriculum: true
  # DISABLED for now: no 2-4 entry state exists yet. It arrives when the chain
  # reaches it (the 2-3 weld captures handoff_2-4.state on the 2-3 -> 2-4
  # transition). Flip enabled: true once checkpoints/handoffs/handoff_2-4.state
  # exists; the block below is kept content-verified so only the flag changes.
  consolidate_level:
    enabled: false
    target: 2-4
    protect: []
    seed_globs:
    - checkpoints/super_mario_bros/smb_curriculum/stage_*.state
    - checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_*.state
    - checkpoints/harvested_seeds/seed_2_4_gx*.state
    schedule:
      entropy:
        from: 0.01
        to: 0.002
        iters: 80
      rnd:
        from: 0.1
        to: 0.0
    probe:
      every: 25
      episodes: 8
      max_steps: 1500
    accept_bar: 0.75
    accept_probes: 3
    cooldown: 40
    target_entry_state: checkpoints/handoffs/handoff_2-4.state
  # uvipen-calibrated PPO: lr 1e-4, gamma 0.9, tau (gae_lambda) 1.0, clip 0.2,
  # entropy 0.01 (decays to 0.002 via the consolidate schedule), 10 epochs,
  # 4096 samples/update (rollout_steps 4096, minibatch 512).
  rollout_steps: 4096
  steps: 10
  ppo_minibatch_size: 512
  lr: 0.0001
  gamma: 0.9
  gae_lambda: 1.0
  ppo_clip_eps: 0.2
  value_coef: 0.25
  entropy_coef: 0.01
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  sticky_action_prob: 0.0
  panic_isolation: false
  async_pipeline: false
# Castle shaping: identical to smb_weld_1_4.yaml — 2-4 is the same problem
# class as 1-4 (Fire-Bar timing, lava gaps, axe finish), just with Podoboos
# and vertical lifts added. air_bonus 1.5 pays for committed jumps through
# Fire-Bar windows; jump_clear_bonus 50 rewards landed forward jumps of
# >= jump_clear_min_dx pixels (the lava-gap and lift-to-lift clears).
reward_weights:
  forward_progress: 3.0
  score_delta: 0.005
  death_penalty: 0.0
  completion_bonus: 50.0
  time_penalty: -0.05
  checkpoint_scale: 1.0
  jump_clear_bonus: 50.0
  jump_clear_min_dx: 16
  survival_bonus: 0.0
  survival_block_steps: 150
  air_bonus: 1.5
  pit_fall_extra: 0.0
  enemy_death_extra: 0.0
# Standard 7-action SIMPLE_MOVEMENT set. No ["left","A"] here — that extra
# action was water-specific (in 2-2, A is the only vertical control, so backing
# off a Blooper while holding depth needed a leftward stroke). On land the
# standard set already covers every useful move, and an eighth action would
# only dilute exploration.
action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A
- - left
curriculum:
  stage_1:
  - 2-1
  stage_2:
  - 2-1
  - 2-2
  stage_3:
  - 2-1
  - 2-2
  - 2-3
  - 2-4
