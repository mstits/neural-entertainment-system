name: Mario 2-4
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
description: "Tile-scout vanilla PPO targeting SMB 2-4, the World 2 castle. Per the\
  \ Mario wiki, the level opens onto lava, then two paths lined with Fire-Bars (the\
  \ top path has more), several empty blocks without Fire-Bars attached (they gain\
  \ them in later castles), a lava pit with Podoboos under small platforms, two lifts\
  \ moving in opposite vertical directions, and gaps before the fire-breathing fake\
  \ Bowser and the axe. Structurally the same problem class as 1-4 \u2014 precise\
  \ timing around rotating Fire-Bar hazards with committed jumps \u2014 so shaping\
  \ mirrors smb_weld_1_4.yaml exactly. PPO params are the uvipen-calibrated set (lr\
  \ 1e-4, 4096 samples/update, gae_lambda 1.0).\n"
frame_skip: 4
max_episode_steps: 2400
start_state_path: checkpoints/handoffs/handoff_2-4.state
