name: "Punch-Out"
reward_id: punch_out
# Assigned dump: Mike Tyson's Punch-Out!! (Japan, USA) (Rev A), mapper 9 (MMC2).
# The generic masher does NOT reach live gameplay on this dump (long intro +
# ring walk), and a cold boot lands on the attract demo (inputs ignored -> the
# start-state-demo bug), so a captured Glass Joe opening-bell save state is
# REQUIRED. It was captured live on this exact ROM (opp HP $0398=0x60, Mac HP
# $0392=0x60, throw_ok $00BC=1, punches-to-star $0347=20 => Glass Joe, round
# $0006=1, match-id $0001=0, losses $000A=0).
start_state_path: "roms/Mike Tyson's Punch-Out!! (Japan, USA) (Rev A)_start.state.bin"
rom_hashes:
  - "c119a5a9b0e2959ad5d11562f9f4ce55"  # Mike Tyson's Punch-Out!! (Japan, USA)
                                        # (Rev A) — mapper 9 (MMC2). The USA /
                                        # Mr. Dream dump (3e4af910…) shares these
                                        # exact core RAM offsets, so the same
                                        # bespoke reward works on it too.

# Boxing needs responsive dodges/counters (a telegraphed jab lands in a few
# frames), so frame_skip 4 (NOT the trainer default 16, far too coarse to dodge
# a punch or counter an open guard). The knocked-down flags stay set for
# seconds, so fs4 never misses a knockdown rising edge.
frame_skip: 4
# A Glass Joe KO usually comes in well under a minute, but a bout can run a full
# 3 rounds to a decision. 2500 steps @ fs4 = 10000 frames (~166 s) covers a slow
# multi-round bout plus the win/lose transition.
max_episode_steps: 2500

description: >
  Training profile for Mike Tyson's Punch-Out!! (NES). Boot state is the Glass
  Joe bout (Minor Circuit fight 1), the canonical first-win target. Little Mac
  dodges (LEFT/RIGHT), ducks (DOWN), and throws body blows (A/B) or face jabs
  (UP+A / UP+B); the star uppercut (press START with a star) is intentionally
  EXCLUDED from the action space because START also PAUSES the fight — an
  unguarded pause is a degenerate absorbing action for PPO. The bespoke
  PunchOutReward (nes_core/src/rewards.rs) drives opponent-health damage +
  knockdowns and penalizes taking damage / getting knocked down; the real win
  is the winning KO/TKO (match-id latch $0001 goes nonzero), which strictly
  dominates all shaping.

# All addresses VERIFIED-LIVE against nes_core on this (Rev A) dump from the
# captured Glass Joe start state (Data Crystal + TASVideos MTPO RAM maps
# corroborate the labels).
#   Data Crystal: https://datacrystal.tcrf.net/wiki/Mike_Tyson's_Punch-Out!!/RAM_map
#   TASVideos:    https://tasvideos.org/GameResources/NES/MikeTysonsPunchout/RamMap
ram_mapping:
  opp_health:   0x0398   # VERIFIED opponent HP 0..0x60; drops on every landed
                         # Mac punch, refills when a downed opponent gets up.
                         # Mirror at 0x0399.
  mac_health:   0x0392   # VERIFIED Little Mac HP 0..0x60; drops when hit.
                         # Mirror at 0x0391.
  opp_down:     0x03D1   # VERIFIED opponent knocked-down flag; 0->1 on an
                         # opponent knockdown (opp-specific). Knockdown signal.
  mac_down:     0x03D0   # VERIFIED Little Mac knocked-down flag; 0->1 when Mac
                         # is floored.
  stars:        0x0342   # banked star punches (clean counters). Minor shaping.
  losses:       0x000A   # VERIFIED career loss counter; 0->1 when Mac is TKO'd.
                         # THE lose terminal.
  opp_type_id:  0x0002   # VERIFIED opponent index (Glass Joe = 0). level_id only.
  round:        0x0006   # VERIFIED current round (starts 1).
  throw_ok:     0x00BC   # VERIFIED 1 = Mac can punch (live), 0 = down / between.
  punches_to_star: 0x0347 # VERIFIED 20 (0x14) == Glass Joe (opponent fingerprint).


# --------------------------------------------------------------------------
# Retracted 2026-08-27 — see docs/research/UNWITNESSED_SEMANTICS_2026-08-27.md
# String value on purpose: `int(v)` must raise, so no consumer can fold this
# address back into a set (the exclusion-fold inversion closed for Zelda in
# 222ae25). tests/test_purity_quarantine_sweep.py enforces that no profile on
# this ROM re-adopts it into a live `ram_mapping`.
quarantined_external_knowledge:
  applies_to_rom: "roms/Mike Tyson's Punch-Out!! (Japan, USA) (Rev A).nes"
  provenance: >-
    The Data Crystal + TASVideos MTPO RAM maps named in this file's own
    header. The solve: block below already states that this ram_mapping
    block "cites internet RAM maps ... and is therefore NOT usable as a
    solver observable under the purity line"; the entry was nonetheless
    carrying a "VERIFIED WIN LATCH" tag for an event this repo has never
    seen.
  status: UNVERIFIED_EXTERNAL
  rediscovery_rule: >
    Dead until a bout on this ROM is actually won here and the byte is
    logged across the win. No bout has ever ended on any surface in any
    Punch-Out bank in this repo, win or loss:
    runs/fight_gate/smoke/solutions/ is empty (the only go_explore archive
    ever run on this profile) and cumulative opponent damage topped out at
    81 against the 96 cap. runs/clear_gap/punchout/s8_remeasure_verdict.json
    reproduced the falsifier byte-for-byte — from the archived knockdown
    state (opp_hp=0, opp_down=1) a pure-NOOP continuation refills opp_hp
    0->96 at step 120 while match_id stays constant 0 — and names the
    claim "a purity leak dressed as an empirical find". A knockdown is
    witnessed here; a bout win is not.
  q_match_id:  "0x0001"  # claimed: 0 through the whole bout and during a loss,
                         # nonzero ONLY at the winning KO/TKO. The winning
                         # KO/TKO has never occurred here, so the "ONLY at"
                         # half of the claim has no witness.
                         # STILL LIVE IN THE ENGINE: nes_core/src/rewards.rs
                         # hardcodes RAM_MATCH_ID = 0x0001 and drives
                         # episode_success() from it. Quarantining this entry
                         # retracts the documentation claim; it does NOT
                         # disarm the Rust constant. See the follow-up named
                         # in docs/research/UNWITNESSED_SEMANTICS_2026-08-27.md.

# Keys consumed by build_reward's `name.contains("punch-out")` arm. Opponent
# damage is dense; the knockdown bonus and (dominant) win bonus drive the win.
reward_weights:
  opp_damage:       0.5    # per opp_health (0x0398) unit LOST (landed punches)
  knockdown_bonus: 25.0    # each opponent knockdown (0x03D1 rising edge)
  star_bonus:       2.0    # each star banked (0x0342 increment)
  mac_damage:      -0.3    # per mac_health (0x0392) unit lost
  mac_knockdown:  -20.0    # each Mac knockdown (0x03D0 rising edge)
  win_bonus:      500.0    # TERMINAL: match-id (0x0001) latches nonzero. THE win.
  loss_penalty:   -50.0    # TERMINAL: losses (0x000A) increments (Mac TKO'd)
  time_penalty:  -0.002

action_space:
  # Discrete boxing moveset. START (star uppercut) OMITTED on purpose: it
  # doubles as PAUSE, and an unguarded pause freezes RAM into a degenerate
  # absorbing state for PPO.
  - []                      # NOOP (wait / read the opponent)
  - ["A"]                   # right body blow
  - ["B"]                   # left body blow
  - ["up", "A"]             # right face jab (high — the knockdown punch)
  - ["up", "B"]             # left face jab (high)
  - ["left"]                # dodge left
  - ["right"]               # dodge right
  - ["down"]                # duck / block

curriculum:
  stage_1: ["*"]            # single bout (Glass Joe); the SMB area-byte
                            # save-state curriculum is gated off for non-Mario
                            # games by the trainer.

reinforce:
  enabled: true
  # Unified vanilla_ppo (universal pixel-CNN path, same as Contra/MM): no RAM
  # tile decoder for Punch-Out -> Nature-DQN encoder over 4-stacked 84x84
  # grayscale frames -> actor/critic heads. Single-stage PPO from Glass Joe.
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps

  rollout_steps: 1024
  steps: 10                 # K PPO epochs / iter
  ppo_minibatch_size: 256

  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02        # landing the first counter needs dodge+punch
                            # timing, easy to collapse to NOOP — keep it up
  grad_clip: 0.5
  value_loss: huber

  # Discovering the dodge->open-guard->counter loop is a hard-exploration
  # problem, so RND helps. 0.0 = pure baseline.
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0
# --- Odometer-era League onboarding (2026-08-24) ---------------------------
rom_path: "roms/Mike Tyson's Punch-Out!! (Japan, USA) (Rev A).nes"
solve:
  no_clear_predicate: "no witnessed clear exists for this game, so no predicate can be validated; deliberately unminted per the 4-CONFIRMED/41-VOID roster adjudication (docs/research/CLEAR_GAP_CLOSURE_2026-08-26.md). `solutions: 0` here is a compile-time constant, never a search result."
  rom: "roms/Mike Tyson's Punch-Out!! (Japan, USA) (Rev A).nes"
  # PURITY NOTE: the ram_mapping block above cites internet RAM maps
  # (Data Crystal / TASVideos) and is therefore NOT usable as a solver
  # observable under the purity line. The only purity-clean progress
  # surface tried here is the PPU scroll odometer (hardware surface,
  # same purity class as pixels/OAM).
  #
  # ODOMETER GATE VERDICT 2026-08-24 (scripts/progress_signal_gate.py):
  #   forward=right, 1200 steps: axis=x range 0..28, 16 distinct,
  #     oam_churn 373/1199 — runs/onboard_wave1/gate_punchout.json
  #   forward=left,  1200 steps: axis=x range 0..46, 17 distinct,
  #     oam_churn 357/1199 — runs/onboard_wave1/gate_punchout_left.json
  #   y range = 0 in BOTH runs, so axis: y is also dead.
  # The 28-46 px x-wobble is screen shake, not scrolling. Verdict:
  # CAMERA_STATIC_AGENT_ACTIVE — Punch-Out is a fixed-screen fight-gate
  # game; the camera never scrolls, while the agent's sprites churn
  # (OAM moving ~30% of steps). The odometer is the WRONG progress
  # surface for this game class. League onboarding via the scroll
  # pipeline is a no-go; this game needs a fight-gate progress
  # mechanism (opponent-defeat / bout-outcome detection) built from
  # purity-clean surfaces before go_explore_solve can drive it.
  # Left declared so the gate receipt is reproducible, but DO NOT
  # point go_explore_solve at this profile via axis: x/y — no scroll
  # gradient exists. Superseded below by the fight-gate progress source.

  # --- Fight-gate progress (2026-08-25) -------------------------------------
  # docs/proposals/FIGHTGATE_MECHANISM_2026-08-25.md built a generic,
  # non-game-specific progress mechanism for exactly the CAMERA_STATIC_
  # AGENT_ACTIVE class above: randomized attack-mash/approach-retreat
  # probes (scripts/discover_observables.py --fight-gate) plus a decrement-
  # consensus self/foe HP discriminator, with NO game knowledge or RAM map
  # consulted going in. Blind discovery on this exact ROM/start-state
  # (runs/fight_gate/discover_punchout.json) nominated addr 920 (=0x0398)
  # — start=96 (0x60), attack_agree 5/5, defense_agree 0/5 — the SAME byte
  # the ram_mapping block above cites from Data Crystal/TASVideos, now
  # independently re-derived from purity-clean observables alone. A
  # go_explore_solve smoke on the emitted candidate (runs/fight_gate/smoke/,
  # 3 min, 12 workers) tracked cumulative opponent damage rising 0->81
  # (bounded under the true 96 cap), 27 cells / 35 improvements / 0 crashes
  # — the mechanism works end to end on this game.
  #
  # Two honest qualifications (named as follow-up, not fixed here):
  #   1. The ranking heuristic does not uniquely surface 0x0398 as its #1
  #      pick — it ranks #3 of 5 in foe_hp_candidates (behind addr 238 and
  #      158, two zero-page bytes of unknown semantics that also pass the
  #      decrement-consensus gates on this probe budget). The correct
  #      candidate was picked here by cross-referencing the independently-
  #      verified ram_mapping block, not by the discovery pass alone.
  #   2. find_round_gate returned VOID (insufficient_probe: no bout
  #      boundary crossed in 24,000 attack_mash/approach_retreat steps) —
  #      an instrument-budget finding, not evidence against a round byte.
  #      `round:` is therefore omitted below rather than guessed.
  #
  # League classification: CAMERA_STATIC_AGENT_ACTIVE -> SOUND_ADVANCING-
  # eligible. The odometer verdict above stands (no scroll gradient on
  # this game class); the fight_gate source is the correct, now-validated
  # progress surface for go_explore_solve on this profile.
  progress: {source: fight_gate, foe_hp: 0x0398, foe_hp_start: 0x60}
  # y/level_key/lives are required by GenericGame regardless of progress
  # source. No scroll axis exists on this game (see the odometer verdict
  # above), so y is a placeholder, not a tracked observable. `lives` is
  # wired to throw_ok (0x00BC): 0 = Mac down/between exchanges, the
  # closest existing purity-clean analogue to a life-lost signal for a
  # single-life bout — same values proven live in the fight_gate smoke.
  y: 0x0061
  level_key: []
  lives: 0x00BC
