# Mario 1-2 CGSA-PPO — the researcher's recipe (SMB 1-2 RL Consulting, 2026-07-23).
#
# Cell-Granular Stochasticity Annealing with Go-Explore restarts: every archived
# cell carries its own sticky probability p_sticky(c), initialized 0.0 and
# annealed toward 0.25 as the policy masters the segment (>=75% local success
# per 50 attempts -> +0.05; <30% -> -0.05). Restarts are priority-sampled by
# W(c) = (1-p_hat)^2 + 0.1 on the un-welded frontier (0.01 maintenance on
# welded cells). Cells at the target noise are WELDED only by Wald's SPRT
# (H0 p<=0.15 vs H1 p>=0.60, alpha=.01, beta=.05) — the sound replacement for
# the small-sample gates the ladder experiments proved to be mirages.
#
# Per the recipe: NO demo anchor (imitation eliminated in Dossier v3), high
# entropy floor, short rollouts (T=128 -> frequent restarts = fast curriculum
# turnover), value_coef 0.5, epochs 3. The non-farmable wavefront + lost-cut
# are kept (clean scaffolding; reclaims off-path rollout waste).
#
# Signposts (abandonment criteria, logged by [cgsa] telemetry):
#   S1 it350: archive frontier gx_max >= 2000 (abandon < 1800)
#   S2 it800: gauntlet-zone (gx 1600-2200) frontier avg p_sticky >= 0.15
#             (terminate < 0.10)
#   S3 it1150: external probe — from gx~1500 at sticky 0.25, >=10% of 30
#             episodes traverse to gx >= 2200 (abandon at 0%)
# Falsification (3 seeds x 1400 iters, S1+S2 met, 0/400 honest entrance
# clears, gauntlet value-MSE >= 1.5x the 1-1 baseline) -> policy class
# falsified; fallback claim = robustness profile across sticky 0..0.25.
#
# EVAL UNCHANGED: cold greedy + sticky-0.25 + jitter-16 from the entrance.

name: Mario 1-2 CGSA s1
reward_id: mario
rom_path: "roms/Super Mario Bros. (World).nes"
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
frame_skip: 4
start_state_path: "checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_03.state"
description: >
  CGSA-PPO on SMB 1-2: per-cell sticky-noise curriculum over the Go-Explore
  archive, priority frontier restarts, SPRT weld verification. Honest gate
  unchanged: cold greedy sticky-0.25 + jitter from the 1-2 entrance.

ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29

reward_weights:
  forward_progress: 1.0
  time_penalty: -0.01
  death_penalty: -15.0
  completion_bonus: 50.0
  score_delta: 0.0
  air_bonus: 0.0
  survival_bonus: 0.0
  jump_clear_bonus: 0.0
  checkpoint_scale: 0.0

action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A

reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles_pos
  recurrent: false
  tile_hidden_dim: 128
  tile_trunk_dim: 32
  preserve_elite_diversity: true
  freeze_pre_ppo_elite: true
  episodes_per_genome: 2
  symlog_rewards: true
  value_loss: huber
  value_coef: 0.5              # recipe: balance policy/value learning
  gae_lambda: 0.95
  gamma: 0.99
  bc_epochs: 0
  warmup_gens_ga_only: 10
  rollout_steps: 128           # recipe T=128: frequent restarts -> fast
  ppo_minibatch_size: 256      # curriculum turnover
  steps: 3                     # PPO epochs per iter (recipe: 3)
  lr: 0.0003
  ppo_clip_eps: 0.2
  async_pipeline: false
  device: cpu
  panic_isolation: false
  entropy_coef: 0.01           # v2: 0.05 kept the policy near-uniform 1400 iters
  entropy_floor: 0.02
  entropy_coef_max: 0.05
  rnd_intrinsic_coef: 0.0
  rnd_loss_coef: 0.0
  # Target noise: cells anneal toward this; per-env training noise is the
  # CGSA curriculum's, NOT this scalar (it seeds cg_target + eval parity).
  sticky_action_prob: 0.25
  cgsa:
    enabled: true
    target_sticky: 0.25
    anneal_step: 0.05
    attempts_per_update: 15   # v6: throughput — full anneal needs ~2k zones x
                              # 5 windows; 15 keeps gates meaningful while
                              # cutting the per-rung cost 40%
    maintenance_weight: 0.003 # v6: 0.01 leaked ~1/3 of attempts to welded/
                              # waiting zones
    cohort_k: 40
    zone_px: 32
    priority_alpha: 2.0
    priority_floor: 0.1
  # Non-farmable wavefront + lost-cut stay (clean, reclaims off-path waste).
  wavefront_reward:
    enabled: true
    dmap: "checkpoints/wavefront/mario_1_2_dmap.pkl"
    phi_target: 100.0
    gamma: 0.99
  demo_anchor_enabled: false   # imitation eliminated (Dossier v3 §3)
  bc_replay_enabled: false
  preprocess_f16: false
  smb_curriculum: false
  go_explore:
    enabled: true
    inline_return_prob: 0.6
    cell:
      type: smb_gx_phase
      gx_bucket: 32            # recipe: 32x32 px cells
      y_bucket: 32
    score: max_x
    save_every: 20
  num_envs: 60

ga_params:
  mutation_rate: 0.8
  mutation_std: 0.001
  adaptive_mutation_scale: false
  elite_fraction: 0.4
  stale_gens_before_restart: 50
  restart_fraction: 0.5

max_episode_steps: 2400
