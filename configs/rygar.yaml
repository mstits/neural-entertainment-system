name: "Rygar"

rom_path: "roms/Rygar (USA).nes"
rom_hashes:
  - "527cc09ab3a503372abbbf567b76db46"
start_state_path: "roms/Rygar (USA)_start.state.bin"

description: |
  Rygar (NES, 1987), solver profile. Written from MEASUREMENT ONLY —
  nothing here is inherited from another game's profile.

frame_skip: 4

# A GENERIC controller. Tuned action sets encode another game's tactics.
action_space:
  - []
  - ["right"]
  - ["left"]
  - ["up"]
  - ["down"]
  - ["A"]
  - ["B"]
  - ["right", "A"]
  - ["right", "B"]
  - ["left", "A"]
  - ["left", "B"]
  - ["right", "A", "B"]
  - ["down", "B"]
  - ["up", "B"]

solve:
  no_clear_predicate: "no witnessed clear exists for this game, so no predicate can be validated; deliberately unminted per the 4-CONFIRMED/41-VOID roster adjudication (docs/research/CLEAR_GAP_CLOSURE_2026-08-26.md). `solutions: 0` here is a compile-time constant, never a search result."
  rom: "roms/Rygar (USA).nes"
  # Discovered by scripts/discover_observables.py's 3-probe protocol
  # (forward-hold / NOOP-hold / reverse-hold) from this profile's own
  # start state, 2026-08-21. No RAM map, no disassembly, no walkthrough.
  # Receipt: runs/rygar_observables.json
  #
  #   $0015  net +2896 under forward at monotone fraction 1.00 — a
  #          perfectly monotone progress signal, and far cleaner than
  #          Ninja Gaiden's +92 / 0.96 on the same protocol.
  #   $002B  jump/ballistic signature.
  #   $0303  decrements on death, agreed by 5 of 5 independent runs.
  #
  # DEATH-SIGNAL SANITY CHECK (added because Ninja Gaiden failed it):
  # $0303 reads 1 at this start state, so a decrement lands on 0 and is
  # detectable. Ninja Gaiden's lives byte reads 0 at ITS start state, so a
  # decrement underflows to 255 and no "lives went down" test can see the
  # death — which is why that run sat at 36 cells for 40 minutes and why
  # it must NOT be filed as a game difficulty wall.
  # 2026-08-23: $0015 FAILED the progress-signal gate (21 distinct
  # values, saturates at 209, no paired high byte — the archive could
  # not represent being further along; 73 min of search, 116 cells,
  # zero progress). Replaced by the PPU scroll odometer: certified
  # 5/5 (scripts/odometer_cert.py), gate re-run SOUND at 117 distinct
  # over 470 px (runs/odometer/gate_rygar_2026-08-23.json). Hardware
  # surface — same purity class as pixels/OAM.
  progress: {source: odometer, axis: x}
  y: 0x002B
  lives: 0x0303
  # Empty until a real clear is captured; guessing it is authored
  # semantics. The solver can search but cannot yet recognise winning.
  #
  # 2026-08-26: clear predicate REFUSED, with numbers this time --
  # docs/receipts/rygar/clear_predicate_REFUTED.md. The transition
  # instrument the earlier decline lacked now exists
  # (scripts/transition_witness.py: odo_blank edge-detected into runs,
  # 55/55 doors, 3 areas, matching the campaign's hand count), and it is
  # what refutes the predicate rather than enabling it. A blind
  # segment-stability search over all 2,048 RAM bytes returns exactly 8
  # that are constant inside every inter-blackout segment; the two
  # strongest are $001C (3 values) and $0014 (2 values), and they read
  # AREA, not stage. On the banked R1 tape that key alternates perfectly
  # for all 55 transitions -- 27 round trips through one door -- so
  # wiring it here as a level_key would make `is_clear` fire 28 times
  # and latch true for 62-83% of a tape whose artifact-free frontier
  # never moved past 4,608 px. DO NOT WIRE IT. The blocker is that no
  # Rygar clear has ever been witnessed, so there is no positive to
  # calibrate against; §5 of the receipt lists what would have to land
  # first, in order.
  level_key: []
  # solve.room_fp DECLINED (R1-05, 2026-08-26), not omitted by oversight.
  # Hypothesis confirmed: Rygar's transitions are blank-type (odo_debug
  # rendered lines drop < 120 for ~20 fs4-steps at each of 26 measured
  # blackouts in a 5,336px trace), so nes_core's odo_fold_frame blank
  # branch (ppu.rs:3142) returns before the scene-cut test and
  # odometer_scene never moves (0 cuts across the whole trace) -- the
  # scene counter is provably blind here, exactly as room_fp is designed
  # to route around. But arming room_fp itself does not fix it on this
  # profile: unmasked churn is 649 distinct nametable hashes over 3,490
  # rendered frames (mask calibration on this profile's own idle/walk
  # rollout found 0 volatile bytes -- there is nothing to mask), and no
  # settle value from 3 to 60 turns that into a small, stable,
  # transition-aligned room set. Best case (settle=14, Zelda/Metroid's
  # own constant) mints 41 "rooms" while individually resolving only 6 of
  # the 26 real blackout transitions -- the rest are swallowed because a
  # dense run of back-to-back transitions (12 paired blackouts from
  # x~4608 to x~5272, the same band the live solver's frontier stalls in)
  # arrives faster than the settle window can survive, and ordinary
  # mid-corridor pauses (blocked by terrain, fighting) mint just as
  # readily as real transitions under the same test. Full numbers,
  # settle sweep, and the blank-run census: docs/receipts/room_fp/rygar.md.
  # room_fp's settle mechanism is the right primitive for Metroid/Zelda's
  # static-camera rooms; it is the wrong primitive for this profile's
  # continuous scroll, and fixing that is a shared-engine change
  # (scripts/go_explore_solve.py fp_settle/replay_room_stream), not a
  # config knob -- left as a named follow-up, not attempted here.
  #
  # 2026-08-27 (D1, RYGAR_TRANSITIONS_2026-08-27): room_id() is the constant (0,)
  # function on this profile (level_key: [], no room_sig, no solve.area
  # above), so the sect/psig transit machinery has never fired here.
  # `transit_source: blank_run` routes it through the calibrated
  # blank-fold witness (scripts/transition_witness.py) instead --
  # area_key and min_blank_frames are copied verbatim from that module's
  # own RYGAR_AREA_KEY_ADDRS / RYGAR_MIN_BLANK_FRAMES (the values this
  # profile's own rollouts derived: 78-79 frame doors, 14-frame death
  # fades, 2.8x margin on both sides of the floor). See
  # docs/receipts/rygar/clear_predicate_REFUTED.md and
  # tests/test_transit_dimension.py.
  transit_source: blank_run
  area_key: [0x0014, 0x001C]
  min_blank_frames: 40
