name: "Gradius"
# Live stage-1 gameplay state (scripts/capture_start_state.py --game gradius).
# Without it the emulator cold-boots to the TITLE + attract-mode demo, which
# ignores controller input — training there gives zero learning signal.
# Captured state was confirmed LIVE (passed the RIGHT-vs-LEFT directionality
# probe) and is the pristine start of Stage 1: weapon/options/shield all 0,
# 3 lives, Vic Viper controllable.
start_state_path: "roms/Gradius (USA)_start.state.bin"
rom_hashes:
  - "fcc019dc8054403fd28b8de03d7e16aa"  # Gradius (USA) — mapper 3 CNROM, 32K PRG / 32K CHR

# Horizontal shoot-'em-up — needs responsive dodging, so frame_skip 4 (NOT
# the trainer's default 16, which is far too coarse to weave through bullet
# streams / terrain). Same choice as Contra / Mega Man.
frame_skip: 4
max_episode_steps: 2500

description: >
  Training profile for Gradius (NES, 1986, Konami). Horizontal AUTO-SCROLLING
  shoot-'em-up dispatched to the bespoke nes_core::rewards::GradiusReward.
  GENRE NOTE: the stage scrolls automatically, so the ship's on-screen X is NOT
  stage progress — staying alive IS progress (the world advances past the ship
  while it lives). SURVIVAL is therefore the dominant dense signal, layered with
  the signature power-up mechanic (collect capsules -> advance the meter ($0042)
  -> spend for Speed/Missile/Double/Laser/Option/Shield) and, on top, a
  stage-clear (Big-Core boss defeated) milestone that strictly dominates
  everything else. First death ends the episode (single-life convention) with a
  penalty — losing a life also wipes every power-up.
  WIN / BLOCKER: episode_success is a REAL stage clear (the stage byte strictly
  increments when the Big Core dies and the next stage loads), NOT a
  `cumulative_reward > 0` proxy. Gradius's stage-number byte is undocumented on
  datacrystal and every stable-looking zero-page candidate proved to change
  mid-stage under live probing, so `stage_addr` ships DISABLED (0): the win is
  conservatively unreachable — never a false positive — until the real byte is
  read off a genuine stage-1->2 transition (dump RAM at the moment the Big Core
  dies and find the byte that goes 1 -> 2) and set below. This mirrors Contra's
  clear_screen=255 sentinel.

# ── Verified RAM (empirical, on THIS emulator, from the captured start state)
# VERIFIED-LIVE: player_x/_y confirmed by directional-input divergence; lives
# confirmed (3 -> 2 on a collision death); status confirmed (1 alive, flips to 2
# during the death/explosion animation). weapon/option/shield/speed/missile/sel
# are the datacrystal.tcrf.net/wiki/Gradius_(NES) RAM-map values, cross-checked
# against fresh-ship base == 0 (scripted play could not grab a capsule to
# delta-verify them, so GradiusReward treats them as INCREASE-only shaping — a
# wrong address is a no-op, never a farmable bonus).
ram_mapping:
  player_x:      0x00A4   # current Vic Viper X (head of X-trail 0x07A0-0x07AB); LEFT-/RIGHT+  [VERIFIED-LIVE]
  player_y:      0x00A5   # current Vic Viper Y (head of Y-trail 0x07C0-0x07CF); UP-/DOWN+      [VERIFIED-LIVE]
  status:        0x0100   # 0x01 alive, 0x02 dead/dying (empirically flipped on collision)      [VERIFIED-LIVE]
  lives:         0x0020   # remaining ships (starts at 3; 3->2 on death)                         [VERIFIED-LIVE]
  weapon:        0x0044   # 0=Normal, 1=Laser, 2=Double        [datacrystal + base==0 verified]
  powerup_sel:   0x0042   # power-up meter selector (advances 1 per capsule collected)  [datacrystal]
  missile:       0x0041   # missile-enabled flag               [datacrystal + base==0 verified]
  options:       0x0045   # number of Options (multiples), cap 2 [datacrystal + base==0 verified]
  shield:        0x0046   # shield/Force-field strength         [datacrystal + base==0 verified]
  speed:         0x0040   # speed-up level                      [datacrystal + base==0 verified]
  high_score_lo: 0x07E4   # high-score BCD (datacrystal); current-score bytes NOT reliably pinned
  high_score_hi: 0x07E6   #   (0x07E0-0x07EF read all-zero after kill runs)
  # stage/area number: NOT FOUND — undocumented + no stable empirical candidate.
  # Required for the real WIN. See `stage_addr` below and the BLOCKER note above.

# ── reward_weights: keys for the bespoke GradiusReward.
# GradiusReward::new(survival_weight, powerup_bonus, capsule_bonus,
#                    stage_clear_bonus, death_penalty, time_penalty, stage_addr).
# SURVIVAL is the dense auto-scroller signal (each alive step = the stage
# scrolled forward). Over a full 2500-step episode it tops out near
# 0.05*2500 = 125, so the stage-clear win (1000) dominates it ~8x and the
# power-ups by far more — there is no farmable local optimum.
reward_weights:
  survival_weight:    0.05    # DOMINANT dense signal — every alive step is forward progress
  powerup_bonus:      5.0     # per composite upgrade level gained (Speed/Missile/Options/Shield/armed-Weapon)
  capsule_bonus:      2.0     # per power-meter ($0042) advance = one capsule collected
  stage_clear_bonus:  1000.0  # THE win — Big Core defeated -> next stage (must dominate survival)
  death_penalty:     -25.0    # first death ends the episode (also wipes all power-ups)
  time_penalty:      -0.002   # mild; smaller than survival so living always nets positive (+0.048/step)
  stage_addr:         0       # 0 = stage-clear WIN DISABLED (never-false-positive default).
                              #   Set to the verified current-stage byte to enable win detection.

# ── Action space: 8-way movement + fire (B) + power-up activate (A).
# Bit layout: A=0x01 (activate selected capsule), B=0x02 (fire). Diagonals +
# fire are the core dodge-while-shooting verbs of a shmup. select/start omitted.
action_space:
  - []                       # NOOP
  - ["B"]                    # fire
  - ["right"]
  - ["left"]
  - ["up"]
  - ["down"]
  - ["right", "B"]
  - ["left", "B"]
  - ["up", "B"]
  - ["down", "B"]
  - ["up", "right", "B"]     # dodge up-forward while firing
  - ["down", "right", "B"]   # dodge down-forward while firing
  - ["up", "left", "B"]
  - ["down", "left", "B"]
  - ["A"]                    # activate power-up capsule (speed/missile/double/laser/option/shield)

curriculum:
  stage_1: ["*"]
  stage_2: ["*"]
  stage_3: ["*"]

reinforce:
  enabled: true
  # === UNIFIED vanilla_ppo (pixel-CNN path, same as Contra / Mega Man) ===
  # No RAM tile decoder for Gradius, so the universal pixel encoder:
  # 4-stacked 84x84 grayscale -> Nature DQN CNN -> actor/critic. The SMB
  # area-byte save-state curriculum is gated off for non-Mario games; Gradius
  # trains single-stage from its start state. RND drives exploration.
  trainer_mode: vanilla_ppo
  encoder: nature_dqn
  # f16 observations straight from the Rust pool: skips the per-batch
  # /255 MPS kernel and halves host->device bytes on the pixel path.
  preprocess_f16: true
  device: mps            # CNN ~4.7x faster on MPS than CPU (benched)
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02     # shmups are dodge-heavy; keep exploration up
  grad_clip: 0.5
  value_loss: huber
  # Gradius is unforgiving (one hit kills the ship + strips its upgrades) —
  # a hard-exploration regime RND targets. Set rnd_intrinsic_coef: 0.0 for a
  # pure baseline.
  rnd_intrinsic_coef: 0.5
  rnd_loss_coef: 1.0

# Go-Explore solver adapter (bootstrap 2026-08-03). Every address below was
# discovered/confirmed LIVE from THIS core's stage-1 start state via scripted
# (noop/right/left/up/down/right+B/down+right) + suicide rollouts only — no
# external maps or disassembly. Receipt: runs/gradius/gradius_receipt.json.
#
# PROGRESS for a HORIZONTAL AUTO-SCROLLER. The stage scrolls forward on its
# own, so the ship's screen-X ($00A4) is NOT world progress. The forced scroll
# is tracked by a 16-bit little-endian accumulator at $003E (lo) / $003F (hi):
#   * MONOTONE while alive: nondec=1.000, zero backward jumps over every
#     scripted first life (11 -> 836 deep, 11 -> 429 shallow).
#   * SCROLL-LINKED, not a free-running frame counter: $003E FREEZES during the
#     death/explosion pause (68,68,0,0,0...) exactly when the world stops
#     scrolling, whereas the genuine frame counter $0002 counts straight
#     through the same death (56,57,...66). This is the frame-counter rejection
#     the discovery lore demands — $0002/$0036 (per-frame, never pause) are
#     rejected; $003E/$003F advance only with scroll.
#   * DEPTH-DEPENDENT CHECKPOINT RESET (world position, not a fixed respawn):
#     a shallow death near the entrance resets the accumulator to 0 (start
#     checkpoint); a deep suicide-death resets to 512 (page-2 checkpoint).
#   * SATURATION TEST PASSED: $003F keeps STEPPING across screens (reached
#     page 3 in a 1652-frame life and kept climbing), unlike the camera byte
#     $006D which CLAMPS at 240 (the Kirby camera-clamp failure mode) — $006D,
#     $006E and the cyclic scroll-fine copies $0012/$0048 are all rejected as
#     progress. Auto-scroll is input-independent: $003E advances at the same
#     rate under noop and forward, confirming it is the stage's forced scroll.
# level_key EMPTY: no clean stage-advance byte exists (the config's ram_mapping
# already documents that the stage-number byte was NOT FOUND, and a real
# stage-1->2 transition is unreachable under bootstrap play), so this runs as a
# COVERAGE baseline (count selection). player_state is deliberately OMITTED:
# lives ($0020, clean 3->2->1->0 on death) is the robust death signal, while
# the ram_mapping's status $0100 was falsified here (it reads 2 during NORMAL
# alive play, e.g. frames 200/300/600 with lives=3 — wiring it would abort live
# bursts on phantom deaths).
solve:
  rom: "roms/Gradius (USA).nes"
  # 16-bit forced-scroll accumulator (lo $003E, hi $003F). $003E adjacent to
  # $003F is the natural little-endian pair; $003F increments exactly when
  # $003E wraps 255->0 (at_wrap 1.00). This is the stage-distance frontier.
  progress: {lo: 0x003E, hi: 0x003F}
  # Transition-garbage guard: observed values stay tiny ($003F in 0..3, val
  # <= 836 in scripted lives); 20000 (page ~78) can never be reached in one
  # stage yet clips a stray high $003F read on a mode transition.
  progress_cap: 20000
  # Vic Viper vertical position (head of the Y-trail $07C0-$07CF). VERIFIED-
  # LIVE: up- / down+. Drives the cell y-band, critical for a dodge-heavy
  # shmup. ($0320 OAM-Y mirrors it; $00A5 is the canonical RAM byte.)
  y: 0x00A5
  # Coverage baseline: no stage-clear byte (see BLOCKER in the description /
  # ram_mapping). The Big-Core boss defeat is the true clear; wire a stage
  # byte here once it is read off a genuine stage-1->2 transition.
  level_key: []
  # TRIED AND REJECTED (2026-08-06): wired clear: {mode: confluence} (the
  # same generic detector used for Contra) to fix real unattended search
  # time (54+ min today) that could never bank a win. Verified UNSAFE by
  # direct replay before shipping: it fired at 205 actions on a trajectory
  # that was a real DEATH (lives 3->2, progress reset to 0), not a clear —
  # is_clear() is checked before is_dead() in Solver.observe(), so this
  # would have recorded every death as a fake win. The "coord" signal
  # (position reset + entity-slot wipe = "fresh level loading in") reads a
  # death-and-respawn in a scrolling shmup identically to a real stage
  # transition. Do not re-wire confluence here without either reordering
  # the death check ahead of it or adding a lives-drop veto to is_clear().
  # Remaining ships. VERIFIED-LIVE: 3 at spawn, steps 3->2->1->0 exactly on
  # each death (then wraps to 255 at game-over). start_lives=3 => is_dead
  # fires on the first life lost. Robust across bullet/collision/terrain deaths.
  lives: 0x0020