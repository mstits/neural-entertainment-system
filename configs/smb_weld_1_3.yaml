name: Mario 1-3
rom_hashes:
- 811b027eaf99c2def7b933c5208636de
description: 'Tile-scout vanilla PPO that welds ONE SMB level at a time under a cold
  no-regression gate. 100% of the pool trains the target level''s rungs; every probe
  cold-evals the target and each protect level from its entry state and rolls back
  on any protect regression. Terminates on a sustained greedy clear bar with a DONE
  marker so a driver can chain 1-1 -> 1-2 -> 1-3 -> 1-4.

  '
frame_skip: 4
max_episode_steps: 2400
start_state_path: roms/Super Mario Bros. (World)_start.state.bin
ram_mapping:
  x_position_page: 109
  x_position_low: 134
  y_position: 206
  lives: 1882
  score_start: 2014
  score_end: 2019
  world: 1887
  level: 1884
  player_state: 14
  float_state: 29
reinforce:
  enabled: true
  trainer_mode: vanilla_ppo
  encoder: smb_tiles
  num_envs: 24
  preprocess_f16: true
  batched_render: replace
  device: mps
  smb_curriculum: true
  consolidate_level:
    enabled: true
    target: 1-3
    protect: []
    seed_globs:
    - checkpoints/super_mario_bros/smb_curriculum/stage_*.state
    - checkpoints/super_mario_bros_one_shot_tiles/smb_curriculum/stage_*.state
    schedule:
      entropy:
        from: 0.01
        to: 0.002
        iters: 80
      rnd:
        from: 0.1
        to: 0.0
    probe:
      every: 25
      episodes: 8
      max_steps: 1500
    accept_bar: 0.75
    accept_probes: 3
    cooldown: 40
    target_entry_state: checkpoints/handoffs/handoff_1-3.state
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 0.0003
  gamma: 0.9
  gae_lambda: 0.95
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  sticky_action_prob: 0.0
  panic_isolation: false
  async_pipeline: false
reward_weights:
  forward_progress: 3.0
  score_delta: 0.005
  death_penalty: 0.0
  completion_bonus: 2000.0
  time_penalty: -0.05
  checkpoint_scale: 1.0
  jump_clear_bonus: 50.0
  jump_clear_min_dx: 16
  survival_bonus: 0.0
  survival_block_steps: 150
  air_bonus: 1.5
  pit_fall_extra: 0.0
  enemy_death_extra: 0.0
action_space:
- []
- - right
- - right
  - A
- - right
  - B
- - right
  - A
  - B
- - A
- - left
curriculum:
  stage_1:
  - 1-1
  stage_2:
  - 1-1
  - 1-2
  stage_3:
  - 1-1
  - 1-2
  - 1-3
  - 1-4
