name: "Mario 1-4 go-explore"
rom_hashes:
  - "811b027eaf99c2def7b933c5208636de"

# SMB 1-4 via GO-EXPLORE (first-return-then-explore) to DISCOVER a winning
# axe-reaching trajectory, then a backward curriculum robustifies it.
#
# Why: the retained 1-4 winner does not reliably reach the axe even
# stochastically (0 world-2 crossings in a short capture), so there's no
# winning trajectory to seed a backward curriculum from. Go-Explore's
# archive (src/training/go_explore.py) records the furthest-reached cells
# as save-states and RETURNS to the frontier each iter, then PPO-explores
# onward — pushing max_x past the firebar/Bowser end toward the axe
# ($075F world-byte increment) without needing a demo. Once a cell crosses
# to world 2, its trajectory states become the backward-curriculum anchors.
#
# Cell = bucketed (x_page, x_low, y) so the archive stays diverse across
# 1-4's platform heights + x-progress; score = max_x (drives the frontier
# forward). Hyperparameters are the canonical uvipen recipe (lr 1e-4,
# gae_lambda 1.0) that clears 1-4; entropy 0.03 (higher: Go-Explore wants
# broad exploration from returned cells). smb_curriculum OFF (Go-Explore is
# mutually exclusive with it).
start_state_path: "checkpoints/super_mario_bros/smb_curriculum/stage_1_4_bw_x700.state"

frame_skip: 4
max_episode_steps: 2400

ram_mapping:
  x_position_page: 0x006D
  x_position_low:  0x0086
  y_position:      0x00CE
  lives:           0x075A
  score_start:     0x07DE
  score_end:       0x07E3
  world:           0x075F
  level:           0x075C
  player_state:    0x000E
  float_state:     0x001D

reinforce:
  enabled: true
  encoder: smb_tiles
  tile_frame_stack: 4
  trainer_mode: vanilla_ppo
  smb_curriculum: false
  go_explore:
    enabled: true
    cell:
      type: ram_bytes
      addresses: [0x006D, 0x0086, 0x00CE]   # x_page, x_low, y
      bucket: 8                              # ~8px cells: diverse but generalizing
    score: max_x
    save_every: 20
  rollout_steps: 1024
  steps: 10
  ppo_minibatch_size: 256
  lr: 1.0e-4
  gamma: 0.9
  gae_lambda: 1.0
  ppo_clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.04
  grad_clip: 0.5
  value_loss: huber
  rnd_intrinsic_coef: 0.1
  rnd_loss_coef: 1.0
  bc_replay_enabled: false
  warmup_gens_ga_only: 0
  sticky_action_prob: 0.0
  device: cpu
  panic_isolation: false
  async_pipeline: false

reward_weights:
  forward_progress: 3.0
  score_delta:      0.005
  death_penalty:    0.0
  completion_bonus: 2000.0
  time_penalty:     -0.05
  checkpoint_scale: 1.0
  jump_clear_bonus: 50.0
  jump_clear_min_dx: 16
  survival_bonus:   0.0
  survival_block_steps: 150
  air_bonus:        1.5
  pit_fall_extra:   0.0
  enemy_death_extra: 0.0

action_space:
  - []
  - ["right"]
  - ["right", "A"]
  - ["right", "B"]
  - ["right", "A", "B"]
  - ["A"]
  - ["left"]

curriculum:
  stages:
    - name: stage_1
      levels: ["1-4"]
      advance_threshold: 0.5
      min_episodes: 200
