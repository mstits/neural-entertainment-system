[package]
name = "nes_core"
version = "0.1.0"
edition = "2024"
description = "Purpose-built NES core for RL training. Non-cycle-accurate, Apple-Silicon-optimized."
license = "MIT OR Apache-2.0"

[lib]
# `lib`    — for cargo test / cargo run --example
# `cdylib` — for maturin to produce the Python-importable .so
name = "nes_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[dependencies]
# Inherited from the RustedNES fork (rustednes-core). Will be pruned
# during the rewrite — disassembler/game_genie/serde_json are unused
# by the RL training path and can be removed once we fully replace
# the upstream save_state with our binary format.
bitflags = { version = "2.10", features = ["serde"] }
byteorder = "1.5"
bit_reverse = "0.1.8"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde_bytes = "0.11"
# Compact, fast binary serialization for in-memory NES state
# snapshots (start-state caching, eventual save_state byte API).
# 1.x is the legacy stable line; 2.x has a different API surface
# we don't need yet.
bincode = "1.3"
thiserror = "2.0"
once_cell = "1.21"
enum_dispatch = "0.3"
# Data-parallel iteration over worker instances. Critical for the
# Rust-native Pool that replaces Python's multiprocessing-based
# ParallelPool — one rayon par_iter step across N NES instances,
# zero IPC overhead.
rayon = "1.10"
# Core Audio backend (via cpal) for the in-Rust audio mixer. Replaces
# `sounddevice` (PortAudio wrapper) and runs on the macOS audio
# graph's dedicated thread. `cpal` is optional behind the `python`
# feature because only the Python-exposed AudioMixer needs it today.
cpal = { version = "0.15", optional = true }

# Metal compute pipeline for PPU render offload — optional because
# it's macOS-only. Enabled via the `metal` feature; on non-macOS the
# module compiles to a stub that falls back to the CPU render path.
# `objc2-metal` is the modern, safe wrapper over Apple's Metal
# framework (replaces the older `metal` crate which has fewer
# guarantees around objc runtime lifecycle).
objc2 = { version = "0.5", optional = true }
objc2-metal = { version = "0.2", optional = true, features = [
    "MTLDevice",
    "MTLCommandQueue",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLBuffer",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
    "MTLPixelFormat",
    "block2",
] }
objc2-foundation = { version = "0.2", optional = true, features = [
    "NSString",
    "NSURL",
    "NSError",
] }

# PyO3 + numpy are gated behind the `python` feature so a plain
# `cargo build` doesn't pull in the Python toolchain. Maturin builds
# with `--features python`.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"], optional = true }
numpy = { version = "0.22", optional = true, features = ["half"] }
num_cpus = "1.17.0"

# IEEE 754 half-precision float emission from the preprocess path.
# Trainer's Python side can skip the CPU→GPU cast+divide when the
# Rust pool hands it back float16 observations already normalized to
# [0, 1]. On a unified-memory M-series chip the cast/divide is the
# bandwidth-bound step, not the math — baking /255 into the FP16
# conversion constant saves a full GPU kernel launch per batch.
half = "2.4"

# md5 hash of ROM payload for profile-side dirty-dump detection.
# ~140 LOC, no deps of its own — adds negligible build cost.
md5 = "0.7"

# pthread QOS bindings (macOS asymmetric-core scheduling). Used by
# the rayon spawn_handler in pool.rs to pin every worker thread to
# QOS_CLASS_USER_INTERACTIVE so the macOS scheduler keeps them on
# P-cores instead of E-cores.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Test ROM runners + golden-frame harness will go here as splits 02/03/04 land.

[features]
default = []
# `simd` enables NEON (aarch64) / SSE (x86_64) palette + audio paths.
# Off by default for portability; the integration split (05) flips it on.
simd = []
# `pgo` is a build-time marker. The wheel build script consults it to
# pick instrumented vs PGO-optimized rustc flags.
pgo = []
# `python` enables the PyO3 module. Gated so plain `cargo build` doesn't
# need the Python interpreter on PATH. Used by maturin via
# `--features python` (set automatically through the `[tool.maturin]`
# table in pyproject.toml).
python = ["dep:pyo3", "dep:numpy", "dep:cpal"]
# `asm_cpu` enables the AArch64-assembly 6502 CPU core
# (docs/proposals/aarch64_cpu_asm.md). Only effective on
# `target_arch = "aarch64"`; on other targets the code is excluded
# and the pure-Rust core is used. Must always compile + pass tests
# whether enabled or not.
asm_cpu = []
# Diagnostic counter for ASM dispatch rate. Bumping a global AtomicU64
# per instruction serializes rayon workers via cacheline contention
# (measured 5% parallel efficiency at 16 workers on M4 Max). Keep OFF
# for training / production pool runs; enable locally when verifying
# ASM integration via the `integration_asm_hits_on_real_nes_step` test.
asm_hit_counter = []
# Metal compute path for PPU render offload. When enabled, the
# palette-expansion kernel + (future) tile-decode kernel run on the
# M-series GPU. No benefit for training (frame_skip=16 skips render
# on 15/16 frames) but closes the single-env fs=1 gap vs nes-py's
# LaiNES C++ PPU — the workload `watch_asm.py` hits.
metal = ["dep:objc2", "dep:objc2-metal", "dep:objc2-foundation"]
# `ppu_neon_stats` enables per-frame counters for the batched PPU
# renderer: total scanlines, fallback counts, and per-source
# invalidation tallies (palette, nametable, register, mapper).
# Diagnostic only — a handful of atomic-free `+= 1` on the Ppu struct.
# Off by default; enable for tuning the invalidation heuristics.
ppu_neon_stats = []
# Refined skip-render BG-pixel-pipeline elision. On a skip-render frame,
# a visible scanline with no sprite 0 drops its unobserved dot 1..=256
# background pipeline (fetches/shifts/render_pixel) for mappers with no
# visible-fetch side effect (see `MapperEnum::skip_render_bg_elision_safe`).
# OFF by default: it is byte-exact (guards: the *_refined_skip_render_
# state_parity_off_vs_on tests in tests/skip_render_parity.rs pass with
# this feature too) but a non-PGO A/B on Zelda/SMB/Punch-Out showed it
# does NOT beat the always-on
# idle-HBlank fast path and regresses the common MMC3/MMC2 mappers by
# ~1-3% (added hot-tick-body code crosses a bad layout threshold — the
# same icache fragility that makes inlining `tick` regress 52%). Retained
# for re-evaluation under PGO, which may recover the discovery's numbers.
# The idle-HBlank fast path (the measured, shipped win) is unconditional.
ppu_skip_bg = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# `panic = "unwind"` is REQUIRED for PyO3. With "abort", every Rust
# `panic!()` (including upstream RustedNES's many unimplemented-opcode
# and edge-case branches) calls abort() and takes down the whole
# Python process — seen live as SIGABRT from libsystem_c::abort via
# the Rust panic runtime. With unwind, panics become PyErr at the
# FFI boundary and catch_unwind inside pool.rs can isolate bad
# workers without killing the entire training subprocess.
panic = "unwind"
strip = "symbols"
overflow-checks = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"
